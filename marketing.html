<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Framework: Marketing</title>
  <link rel="stylesheet" href="/css/gate.css">
  <script src="/js/gate.js"></script>
  <style>
    /* The funnel monitor's palette and type, so the two pages read as one set. */
    :root {
      --bg:#0f1115; --card:#171a21; --line:#262b36; --line-soft:#1e222b;
      --ink:#e6e9ef; --dim:#9aa4b2; --muted:#6b7480;
      --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
      --mark:#3987e5;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
      font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    a { color:inherit; }

    header { padding:18px 28px; border-bottom:1px solid var(--line); display:flex;
      align-items:baseline; gap:16px; flex-wrap:wrap; }
    h1 { margin:0; font-size:17px; letter-spacing:-.01em; }
    .nav { font-size:13px; color:var(--dim); text-decoration:none; }
    .nav:hover { color:var(--ink); }
    .freshness { margin-left:auto; font-size:12.5px; }

    main { padding:24px 28px 72px; max-width:1280px; margin:0 auto; }
    section { margin-bottom:34px; }
    .sec-head { display:flex; align-items:baseline; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
    h2 { font-size:14px; margin:0; letter-spacing:.01em; }
    .sec-note { font-size:12.5px; color:var(--muted); }

    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; }
    .pad { padding:18px 20px; }
    .msg { padding:70px 24px; text-align:center; color:var(--dim); }
    .msg code { background:var(--card); padding:2px 6px; border-radius:5px; color:var(--ink); }
    .empty { color:var(--muted); font-size:12.5px; padding:6px 2px; }
    .muted { color:var(--muted); }
    .dim { color:var(--dim); }
    .warn { color:var(--warning); }
    .mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
    .when { color:var(--muted); font-size:11.5px; white-space:nowrap; }

    /* The standing line: one paragraph, the steward's note behind a fold. */
    .standing { font-size:13.5px; line-height:1.7; }
    .standing b { font-weight:600; }
    .standing .sep { color:var(--muted); padding:0 6px; }

    /* The ladder: seven rows, stage 1 at the top, because a story moves DOWN it.
       Columns held on a laptop; on a phone each row stacks into one column. */
    .ladder { display:grid; grid-template-columns:1fr; }
    .rung { display:grid; grid-template-columns:190px 210px 1fr; gap:6px 24px; padding:14px 0;
      border-top:1px solid var(--line-soft); align-items:start; }
    .rung:first-child { border-top:0; padding-top:4px; }
    .rung .num { color:var(--muted); font-variant-numeric:tabular-nums; margin-right:8px; font-size:12.5px; }
    .rung .name { font-weight:600; }
    .rung .who { color:var(--dim); font-size:12.5px; line-height:1.5; }
    .rung .when-cadence { color:var(--muted); font-size:12px; }
    .items { margin:0; padding:0; list-style:none; display:grid; grid-template-columns:1fr; gap:3px; }
    .item { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; font-size:13px; }
    .item .lbl { color:var(--dim); min-width:150px; }
    .item .val { color:var(--ink); }
    .item .note { color:var(--muted); font-size:12px; }
    .flags { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
    .flag { color:var(--warning); border:1px solid rgba(250,178,25,.4); border-radius:5px;
      padding:1.5px 8px; font-size:11.5px; }
    @media (max-width:860px) {
      .rung { grid-template-columns:1fr; gap:4px; }
      .item .lbl { min-width:0; }
    }

    /* The story board: a row per story, a marker in the column of its stage. */
    .tablewrap { overflow-x:auto; }
    table { border-collapse:collapse; width:100%; font-size:13px; }
    th, td { text-align:left; padding:9px 12px; vertical-align:top; }
    thead th { color:var(--muted); font-weight:500; font-size:11.5px; text-transform:uppercase;
      letter-spacing:.04em; border-bottom:1px solid var(--line); white-space:nowrap; }
    tbody tr { border-bottom:1px solid var(--line-soft); }
    tbody tr:last-child { border-bottom:0; }
    td.story { min-width:200px; }
    td.story .nm { font-weight:600; }
    td.story .sub { font-size:11.5px; color:var(--muted); margin-top:1px; }
    th.stg, td.stg { text-align:center; width:44px; padding-left:4px; padding-right:4px; }
    th.stg .stg-name { display:block; font-size:10px; letter-spacing:.03em; color:var(--muted); }
    td.stg { color:var(--line); }
    td.stg.here { color:var(--mark); font-size:16px; line-height:1; }
    td.stg.declared { color:var(--warning); font-size:14px; line-height:1; }
    td.standing { min-width:220px; }
    td.standing .status { color:var(--ink); }
    td.standing .counts { color:var(--dim); font-size:12px; margin-top:2px; }
    td.standing .has { margin-top:4px; display:flex; gap:5px; flex-wrap:wrap; }
    .chip { font-size:10.5px; padding:1.5px 7px; border-radius:5px; border:1px solid var(--line);
      color:var(--dim); white-space:nowrap; }
    .chip.made { color:var(--good); border-color:rgba(12,163,12,.35); }
    @media (max-width:860px) { th.stg .stg-name { display:none; } }

    /* Decisions, sessions, doors: lists. */
    .list { margin:0; padding:0; list-style:none; }
    .list li { padding:7px 0; border-top:1px solid var(--line-soft); font-size:13px; }
    .list li:first-child { border-top:0; padding-top:0; }
    .list .un { color:var(--muted); font-size:12px; }
    .sessions { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
    .session { border:1px solid var(--line-soft); border-radius:9px; padding:12px 14px; font-size:13px; }
    .session .cmd { font-family:ui-monospace,Menlo,monospace; font-weight:600; }
    .session .purpose { color:var(--dim); font-size:12px; margin:2px 0 8px; }
    .session .last { font-size:12px; }
    @media (max-width:860px) { .sessions { grid-template-columns:1fr 1fr; } }
    @media (max-width:520px) { .sessions { grid-template-columns:1fr; } }
    .doors li { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
    .doors a { color:var(--ink); }
    .doors .note { color:var(--muted); font-size:12px; }
    .local { color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:0 7px; font-size:10.5px; }

    /* Folds. The same triangle the monitor uses; the text in them is verbatim. */
    details { border-top:1px solid var(--line); padding-top:12px; margin-top:8px; }
    details:first-of-type { border-top:0; margin-top:0; padding-top:0; }
    details summary { cursor:pointer; font-size:13px; color:var(--dim); list-style:none; }
    details summary::-webkit-details-marker { display:none; }
    details summary:before { content:"\25B8  "; color:var(--muted); }
    details[open] summary:before { content:"\25BE  "; }
    details .inner { padding:12px 2px 6px; line-height:1.7; }
    pre { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font-family:ui-monospace,Menlo,monospace;
      font-size:12px; line-height:1.6; color:var(--dim); background:var(--bg); border:1px solid var(--line-soft);
      border-radius:8px; padding:12px 14px; }
    .runs { margin:8px 0 0; padding:0; list-style:none; font-size:12.5px; }
    .runs li { padding:2px 0; display:flex; gap:10px; flex-wrap:wrap; }
    .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 16px; font-size:13px; align-items:baseline; }
    .kv dt { color:var(--dim); margin:0; }
    .kv dd { margin:0; font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
  <header>
    <h1>Framework: Marketing</h1>
    <a class="nav" href="/metrics.html">&rarr; Funnel Monitor</a>
    <a class="nav" href="/catalog.html">&rarr; Catalog Manager</a>
    <div class="freshness" id="fresh"></div>
  </header>
  <main id="main"><div class="msg">Loading&hellip;</div></main>

  <script>
  (function () {
    // The key comes from the shared gate, not the URL. See js/gate.js.
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); };
    var show = function (h) { document.getElementById('main').innerHTML = h; };
    var arr = function (v) { return Array.isArray(v) ? v : []; };
    var obj = function (v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; };
    var has = function (v) { return v !== null && v !== undefined && v !== ''; };
    var D = null;

    // Nothing is fetched until the gate has a key the server accepts.
    FrameworkGate.ready()
      .then(function () { return FrameworkGate.fetch('/api/marketing-data'); })
      .then(function (r) {
        if (r.status === 401) throw new Error('Unauthorized. Check your key.');
        if (r.status === 404) throw new Error('Nothing published yet. The ops publish step sends the first snapshot; on npm run dev the state builder in framework-ops builds it on the spot.');
        if (!r.ok) return r.json().then(function (b) { throw new Error(b && b.error ? b.error : 'HTTP ' + r.status); }, function () { throw new Error('HTTP ' + r.status); });
        return r.json();
      })
      .then(function (d) { D = obj(d); render(); })
      .catch(function (e) { show('<div class="msg">' + esc(e.message) + '</div>'); });

    // ---------- dates ----------
    var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function parse(v) {
      if (!has(v)) return null;
      var d = new Date(v);
      return isNaN(d.getTime()) ? null : d;
    }
    function two(n) { return (n < 10 ? '0' : '') + n; }
    /** 9 Sep 2026, 11:42 in the reader's zone; a date with no time stays a date. */
    function fmt(v) {
      var d = parse(v);
      if (!d) return has(v) ? String(v) : '';
      var dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(String(v));
      var s = d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear();
      return dateOnly ? s : s + ', ' + two(d.getHours()) + ':' + two(d.getMinutes());
    }
    function fmtDay(v) {
      var d = parse(v);
      if (!d) return has(v) ? String(v) : '';
      return d.getDate() + ' ' + MON[d.getMonth()];
    }
    function ago(v) {
      var d = parse(v);
      if (!d) return '';
      var days = Math.floor((Date.now() - d.getTime()) / 86400000);
      return days <= 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago';
    }
    function when(v, cls) {
      if (!has(v)) return '';
      return '<span class="' + (cls || 'when') + '" title="' + esc(v) + '">' + esc(fmt(v)) + '</span>';
    }

    // ---------- the shape the page holds even when the snapshot does not ----------
    // A story moves down this ladder from stage 3. Named here so an empty or
    // partial snapshot still shows the seven stages, which is the structure.
    var STAGES = [
      [1, 'Understand'], [2, 'Intend'], [3, 'Story'], [4, 'Produce'],
      [5, 'Distribute'], [6, 'Converse'], [7, 'Measure']
    ];
    var SESSIONS = [
      ['strategy', 'the quarter: objective, segments, the channel grid'],
      ['ads', 'the audiences, then the config'],
      ['content', 'the image pass, this month\'s configuration, posts, blog'],
      ['monitor', 'the weekly brief, then the gates in the studio']
    ];
    var SITE_DOORS = [
      { label: 'Funnel Monitor', href: '/metrics.html', note: 'the numbers' },
      { label: 'Catalog Manager', href: '/catalog.html', note: 'what is for sale and how it is shown' }
    ];

    function render() {
      var gen = D.generatedAt;
      var days = parse(gen) ? Math.floor((Date.now() - parse(gen).getTime()) / 86400000) : null;
      var col = days === null ? 'var(--muted)' : days <= 2 ? 'var(--good)' : days <= 7 ? 'var(--warning)' : 'var(--critical)';
      document.getElementById('fresh').innerHTML = parse(gen)
        ? '<span style="color:' + col + '">&#9679; Generated ' + esc(ago(gen)) + '</span><span class="muted"> &middot; ' + esc(fmt(gen)) + '</span>'
        : '<span class="muted">No generated time in this snapshot</span>';

      show(standing() + ladder() + stories() + decisions() + sessions() + doors() + structure() + files() + measures() + extras());
    }

    // ---------- the standing line ----------
    function standing() {
      var home = obj(D.home), st = obj(D.steward), spend = obj(st.spendMonth);
      var parts = [];
      var from = [];
      if (has(home.commit)) from.push('commit <span class="mono">' + esc(String(home.commit).slice(0, 10)) + '</span>');
      if (has(home.branch)) from.push('on <span class="mono">' + esc(home.branch) + '</span>');
      if (has(home.commitAt)) from.push('committed ' + when(home.commitAt, 'dim'));
      parts.push('<b>Generated</b> ' + (has(D.generatedAt) ? esc(fmt(D.generatedAt)) : '<span class="muted">(no time)</span>')
        + (from.length ? ' from ' + from.join(' ') : '')
        + (has(home.path) ? ' <span class="muted mono">' + esc(home.path) + '</span>' : ''));

      var s = [];
      if (has(st.installed)) s.push(st.installed ? 'installed' : 'not installed');
      if (has(st.lastRun)) s.push('last run ' + when(st.lastRun, 'dim'));
      if (has(st.nextRun)) s.push('next ' + when(st.nextRun, 'dim'));
      if (has(spend.usd) || has(spend.capUsd)) {
        var over = has(spend.capUsd) && Number(spend.usd) > Number(spend.capUsd);
        s.push('<span class="' + (over ? 'warn' : '') + '">spent $' + esc(has(spend.usd) ? Number(spend.usd).toFixed(2) : '0.00')
          + (has(spend.capUsd) ? ' of $' + esc(spend.capUsd) : '') + (has(spend.month) ? ' in ' + esc(spend.month) : ' this month') + '</span>');
      }
      parts.push('<b>Steward</b> ' + (s.length ? s.join('<span class="sep">&middot;</span>') : '<span class="muted">nothing on record</span>'));

      var schema = has(D.schema) && D.schema !== 'framework-marketing-state@1'
        ? '<div class="muted" style="font-size:12px;margin-top:6px">Snapshot schema ' + esc(D.schema) + '; this page reads framework-marketing-state@1.</div>' : '';

      var fold = '';
      var runs = arr(st.runs);
      if (has(st.lastNote) || runs.length) {
        fold = '<details><summary>The steward\'s last note' + (runs.length ? ' and its runs' : '') + '</summary><div class="inner">'
          + (has(st.lastNote) ? '<pre>' + esc(st.lastNote) + '</pre>' : '<div class="empty">No note yet.</div>')
          + (has(st.lastNoteFile) ? '<div class="muted mono" style="margin-top:6px">' + esc(st.lastNoteFile) + '</div>' : '')
          + (runs.length ? '<ul class="runs">' + runs.map(function (r) {
              r = obj(r);
              var bits = [];
              var at = r.at || r.ranAt || r.when || r.date;
              if (has(at)) bits.push(when(at, 'dim'));
              if (has(r.ok)) bits.push('<span class="' + (r.ok ? 'muted' : 'warn') + '">' + (r.ok ? 'ok' : 'failed') + '</span>');
              if (has(r.usd)) bits.push('<span class="muted">$' + esc(Number(r.usd).toFixed(2)) + '</span>');
              if (has(r.note)) bits.push(esc(r.note));
              Object.keys(r).forEach(function (k) {
                if (['at','ranAt','when','date','ok','usd','note'].indexOf(k) >= 0) return;
                if (r[k] !== null && typeof r[k] === 'object') return;
                bits.push('<span class="muted">' + esc(k) + '</span> ' + esc(r[k]));
              });
              return '<li>' + bits.join(' ') + '</li>';
            }).join('') + '</ul>' : '')
          + '</div></details>';
      }
      return '<section><div class="card pad standing">' + parts.join('<br>') + schema + (fold ? '<div style="margin-top:12px">' + fold + '</div>' : '') + '</div></section>';
    }

    // ---------- the ladder ----------
    function ladder() {
      var given = {};
      arr(D.ladder).forEach(function (s) { s = obj(s); if (has(s.stage)) given[Number(s.stage)] = s; });
      var rows = STAGES.map(function (pair) {
        var s = obj(given[pair[0]]);
        var items = arr(s.items), flags = arr(s.flags);
        return '<div class="rung">'
          + '<div><span class="num">' + pair[0] + '</span><span class="name">' + esc(s.name || pair[1]) + '</span></div>'
          + '<div>' + (has(s.owner) ? '<div class="who">' + esc(s.owner) + '</div>' : '')
            + (has(s.cadence) ? '<div class="when-cadence">' + esc(s.cadence) + '</div>' : '')
            + (!has(s.owner) && !has(s.cadence) ? '<div class="when-cadence">nothing on record</div>' : '') + '</div>'
          + '<div>' + (items.length ? '<ul class="items">' + items.map(item).join('') + '</ul>' : '<div class="empty">Nothing on record for this stage.</div>')
            + (flags.length ? '<div class="flags">' + flags.map(function (f) { return '<span class="flag">' + esc(typeof f === 'string' ? f : (f && (f.text || f.message)) || JSON.stringify(f)) + '</span>'; }).join('') + '</div>' : '')
          + '</div></div>';
      });
      // Anything the snapshot put on the ladder outside 1 to 7 is still shown.
      arr(D.ladder).forEach(function (s) {
        s = obj(s);
        var n = Number(s.stage);
        if (has(s.stage) && (n >= 1 && n <= 7)) return;
        rows.push('<div class="rung"><div><span class="num">' + esc(has(s.stage) ? s.stage : '?') + '</span><span class="name">' + esc(s.name || '') + '</span></div>'
          + '<div class="who">' + esc(s.owner || '') + '</div><div>' + (arr(s.items).length ? '<ul class="items">' + arr(s.items).map(item).join('') + '</ul>' : '') + '</div></div>');
      });
      return '<section><div class="sec-head"><h2>The ladder</h2><span class="sec-note">seven stages in a loop; a story enters at 3 and moves down; 7 feeds 1</span></div>'
        + '<div class="card pad"><div class="ladder">' + rows.join('') + '</div></div></section>';
    }
    function item(it) {
      it = obj(it);
      var val = has(it.value) ? esc(it.value) : '<span class="muted">(none)</span>';
      var path = '';
      // A URL or a site path is a link. A path inside a folder on the machine
      // is not (a browser cannot open it), so it is shown as where the thing is.
      if (has(it.href) && isLink(it.href)) val = link(it.href, val);
      else if (has(it.href) && String(it.href) !== String(it.value)) path = '<span class="note mono">' + esc(it.href) + '</span>';
      return '<li class="item"><span class="lbl">' + esc(it.label || '') + '</span><span class="val">' + val + '</span>'
        + when(it.at) + (has(it.note) ? '<span class="note">' + esc(it.note) + '</span>' : '') + path + '</li>';
    }
    function isLink(href) { return /^(https?:\/\/|\/)/i.test(String(href || '')); }
    function isLocal(href) { return /^https?:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/i.test(String(href || '')); }
    function link(href, inner) {
      var h = String(href);
      var out = /^https?:\/\//i.test(h);
      return '<a href="' + esc(h) + '"' + (out ? ' target="_blank" rel="noopener"' : '') + '>' + inner + '</a>'
        + (isLocal(h) ? ' <span class="local">local</span>' : '');
    }

    // ---------- the stories ----------
    function stories() {
      var list = arr(D.stories).map(obj);
      var head = '<tr><th>Story</th>' + STAGES.map(function (p) {
        return '<th class="stg">' + p[0] + '<span class="stg-name">' + esc(p[1]) + '</span></th>';
      }).join('') + '<th>Standing</th></tr>';
      var body = list.map(function (s) {
        var c = obj(s.counts), f = obj(s.files);
        var sub = [s.segment, s.room, s.configuration].filter(has).map(esc).join(' &middot; ');
        var stage = Number(s.stage);
        // Where the files put it, and (hollow, in the warning colour) where
        // story.md says it is, when the two disagree.
        var declared = has(s.stageDeclared) ? Number(s.stageDeclared) : stage;
        var cells = STAGES.map(function (p) {
          if (p[0] === stage) return '<td class="stg here" title="stage ' + p[0] + ', ' + esc(p[1]) + '">&#9679;</td>';
          if (p[0] === declared) return '<td class="stg declared" title="story.md says stage ' + p[0] + '">&#9675;</td>';
          return '<td class="stg">&middot;</td>';
        }).join('');
        var flags = arr(s.flags);
        var counts = [];
        if (has(c.designsKept)) counts.push(n(c.designsKept, 'design') + ' kept');
        var sc = [];
        if (has(c.scenesKept)) sc.push(c.scenesKept + ' kept');
        if (has(c.scenesRejected)) sc.push(c.scenesRejected + ' rejected');
        if (has(c.scenesUnjudged)) sc.push(c.scenesUnjudged + ' unjudged');
        if (sc.length) counts.push('scenes: ' + sc.join(', '));
        var chips = [];
        if (c.blogDraft) chips.push('<span class="chip made">blog draft</span>');
        if (c.video) chips.push('<span class="chip made">video</span>');
        if (s.namedInAds) chips.push('<span class="chip made">in ads</span>');
        var present = Object.keys(f).filter(function (k) { return f[k]; });
        if (present.length) chips.push('<span class="chip">' + present.map(esc).join(' &middot; ') + '</span>');
        return '<tr><td class="story"><div class="nm">' + esc(s.name || s.slug || '(unnamed)') + '</div>'
          + (sub ? '<div class="sub">' + sub + '</div>' : '')
          + (has(s.slug) && s.slug !== s.name ? '<div class="sub mono">' + esc(s.slug) + '</div>' : '') + '</td>'
          + cells
          + '<td class="standing">' + (has(s.status) ? '<div class="status">' + esc(s.status) + '</div>' : '<div class="muted">no status</div>')
          + (counts.length ? '<div class="counts">' + counts.join(' &middot; ') + '</div>' : '')
          + (chips.length ? '<div class="has">' + chips.join('') + '</div>' : '')
          + (flags.length ? '<div class="flags">' + flags.map(function (x) { return '<span class="flag">' + esc(x) + '</span>'; }).join('') + '</div>' : '')
          + (has(s.updatedAt) ? '<div class="counts">updated ' + when(s.updatedAt) + '</div>' : '')
          + (!isNaN(stage) && (stage < 1 || stage > 7) ? '<div class="warn" style="font-size:12px">stage ' + esc(s.stage) + ' is off the ladder</div>' : '')
          + (isNaN(stage) ? '<div class="counts">no stage</div>' : '')
          + '</td></tr>';
      }).join('');
      return '<section><div class="sec-head"><h2>The stories</h2><span class="sec-note">one row each; the marker is the stage it has reached</span></div>'
        + '<div class="card">' + (list.length
          ? '<div class="tablewrap"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>'
          : '<div class="pad empty">No stories yet. The first /strategy names the quarter\'s stories.</div>')
        + '</div></section>';
    }
    function n(count, word) { var c = Number(count) || 0; return c + ' ' + word + (c === 1 ? '' : 's'); }

    // ---------- decisions ----------
    function decisions() {
      var list = arr(D.decisions);
      return '<section><div class="sec-head"><h2>Decisions waiting on Ben</h2><span class="sec-note">DECISIONS.md, one line each</span></div>'
        + '<div class="card pad">' + (list.length ? '<ul class="list">' + list.map(function (d) {
            if (typeof d === 'string') return '<li>' + esc(d) + '</li>';
            d = obj(d);
            return '<li>' + esc(d.text || '') + (has(d.unblocks) ? ' <span class="un">Unblocks: ' + esc(d.unblocks) + '</span>' : '') + '</li>';
          }).join('') + '</ul>' : '<div class="empty">Nothing waiting.</div>') + '</div></section>';
    }

    // ---------- sessions ----------
    function sessions() {
      var given = obj(D.sessions);
      var cards = SESSIONS.map(function (pair) {
        var s = obj(given[pair[0]]);
        var dry = Array.isArray(s.dryRun) ? s.dryRun : (s.dryRun ? [true] : []);
        var last = has(s.last) ? 'last run ' + when(s.last, 'dim') : '<span class="muted">not yet run with Ben</span>';
        return '<div class="session"><div class="cmd">/' + pair[0] + '</div><div class="purpose">' + esc(pair[1]) + '</div>'
          + '<div class="last">' + last + '</div>'
          + (has(s.file) ? '<div class="last muted mono">' + esc(s.file) + '</div>' : '')
          + dry.map(function (d) { return '<div class="last muted">dry run' + (d === true ? '' : ' <span class="mono">' + esc(d) + '</span>') + '</div>'; }).join('')
          + '</div>';
      });
      // Anything named in the snapshot beyond the four is still shown.
      Object.keys(given).forEach(function (k) {
        if (SESSIONS.some(function (p) { return p[0] === k; })) return;
        var s = obj(given[k]);
        cards.push('<div class="session"><div class="cmd">/' + esc(k) + '</div><div class="last">' + (has(s.last) ? 'last run ' + when(s.last, 'dim') : '<span class="muted">never run</span>') + '</div>'
          + (has(s.file) ? '<div class="last muted mono">' + esc(s.file) + '</div>' : '') + '</div>');
      });
      return '<section><div class="sec-head"><h2>Sessions</h2><span class="sec-note">open Claude Code in the marketing folder and type the command; the console will carry these conversations later</span></div>'
        + '<div class="card pad"><div class="sessions">' + cards.join('') + '</div></div></section>';
    }

    // ---------- doors ----------
    function doors() {
      var list = arr(D.doors).map(obj).filter(function (d) { return has(d.href) || has(d.label); });
      var hrefs = list.map(function (d) { return String(d.href || '').replace(/\/$/, ''); });
      SITE_DOORS.forEach(function (d) {
        var same = hrefs.some(function (h) { return h === d.href || h === d.href.replace(/\.html$/, ''); });
        if (!same) list.push(d);
      });
      return '<section><div class="sec-head"><h2>Doors</h2><span class="sec-note">the tools, where they are</span></div>'
        + '<div class="card pad">' + (list.length ? '<ul class="list doors">' + list.map(function (d) {
            var label = esc(d.label || d.href);
            return '<li>' + (has(d.href) ? link(d.href, label) : label) + (has(d.note) ? '<span class="note">' + esc(d.note) + '</span>' : '') + '</li>';
          }).join('') + '</ul>' : '<div class="empty">No doors listed.</div>') + '</div></section>';
    }

    // ---------- structure ----------
    function structure() {
      var st = obj(D.structure);
      var un = arr(st.undeclared), miss = arr(st.missing), decl = arr(st.declared);
      var body;
      if (!D.structure) body = '<div class="empty">No structure check in this snapshot.</div>';
      else if (!un.length && !miss.length) body = '<div>As declared' + (decl.length ? ' <span class="muted">(' + decl.length + ' entries in STRUCTURE.md)</span>' : '') + '.</div>';
      else body = (un.length ? '<div><span class="warn">Undeclared:</span> ' + un.map(function (x) { return '<span class="mono warn">' + esc(x) + '</span>'; }).join(', ') + '</div>' : '')
        + (miss.length ? '<div><span class="warn">Missing:</span> ' + miss.map(function (x) { return '<span class="mono warn">' + esc(x) + '</span>'; }).join(', ') + '</div>' : '');
      return '<section><div class="sec-head"><h2>Structure</h2><span class="sec-note">the folder against STRUCTURE.md</span></div><div class="card pad">' + body + '</div></section>';
    }

    // ---------- the state files, verbatim ----------
    function files() {
      var f = obj(D.files);
      var names = Object.keys(f);
      return '<section><div class="sec-head"><h2>State files</h2><span class="sec-note">as they are in the folder, behind folds</span></div>'
        + '<div class="card pad">' + (names.length ? names.map(function (name) {
            var text = f[name];
            if (text !== null && typeof text === 'object') text = JSON.stringify(text, null, 2);
            return '<details><summary><span class="mono">' + esc(name) + '</span>' + (has(text) ? ' <span class="muted">' + esc(String(text).split('\n').length) + ' lines</span>' : '') + '</summary>'
              + '<div class="inner">' + (has(text) ? '<pre>' + esc(text) + '</pre>' : '<div class="empty">Empty.</div>') + '</div></details>';
          }).join('') : '<div class="empty">No files in this snapshot.</div>') + '</div></section>';
    }

    // ---------- anything the snapshot carries beyond the contract ----------
    // The builder may add a field before this page learns to draw it. Rather
    // than hide it, each one is here behind a fold, as it is.
    var KNOWN = ['schema','generatedAt','home','structure','ladder','stories','steward','decisions','sessions','doors','files','measures'];
    function extras() {
      var keys = Object.keys(D).filter(function (k) { return KNOWN.indexOf(k) < 0; });
      if (!keys.length) return '';
      var out = keys.map(function (k) {
        var v = D[k];
        var inner;
        if (v === null || typeof v !== 'object') inner = '<div>' + esc(String(v)) + '</div>';
        else if (Array.isArray(v) && v.every(function (x) { return typeof x !== 'object' || x === null; })) inner = '<ul class="list">' + v.map(function (x) { return '<li>' + esc(String(x)) + '</li>'; }).join('') + '</ul>';
        else if (!Array.isArray(v) && Object.keys(v).every(function (x) { return v[x] === null || typeof v[x] !== 'object'; })) {
          inner = '<dl class="kv">' + Object.keys(v).map(function (x) { return '<dt>' + esc(x) + '</dt><dd>' + esc(v[x] === null ? '' : typeof v[x] === 'number' ? v[x].toLocaleString('en-US') : String(v[x])) + '</dd>'; }).join('') + '</dl>';
        } else inner = '<pre>' + esc(JSON.stringify(v, null, 2)) + '</pre>';
        var count = Array.isArray(v) ? ' <span class="muted">' + v.length + '</span>' : '';
        return '<details><summary><span class="mono">' + esc(k) + '</span>' + count + '</summary><div class="inner">' + inner + '</div></details>';
      });
      return '<section><div class="sec-head"><h2>Also in the snapshot</h2><span class="sec-note">fields this page has no place for yet, as they are</span></div>'
        + '<div class="card pad">' + out.join('') + '</div></section>';
    }

    // ---------- measures ----------
    function measures() {
      if (!has(D.measures)) return '';
      var m = obj(D.measures);
      var keys = Object.keys(m);
      var rows = keys.map(function (k) {
        var v = m[k];
        var shown = v !== null && typeof v === 'object' ? '<span class="mono">' + esc(JSON.stringify(v)) + '</span>'
          : typeof v === 'number' ? esc(v.toLocaleString('en-US'))
          : /^\d{4}-\d{2}-\d{2}T/.test(String(v)) ? when(v, 'dim') : esc(String(v));
        return '<dt>' + esc(k) + '</dt><dd>' + shown + '</dd>';
      });
      return '<section><div class="sec-head"><h2>Measures</h2><span class="sec-note">what the snapshot carried</span></div>'
        + '<div class="card pad">' + (rows.length ? '<dl class="kv">' + rows.join('') + '</dl>' : '<div class="empty">None.</div>') + '</div></section>';
    }
  })();
  </script>
</body>
</html>
