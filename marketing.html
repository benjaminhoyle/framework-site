<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Framework: Marketing</title>
  <link rel="stylesheet" href="/css/gate.css">
  <script src="/js/gate.js"></script>
  <style>
    /* The funnel monitor's palette, so the two pages read as one set. Two
       sizes only: 13px for a value, 12px muted for a label. */
    :root {
      --bg:#0f1115; --card:#171a21; --line:#262b36; --line-soft:#1e222b;
      --ink:#e6e9ef; --dim:#9aa4b2; --muted:#6b7480;
      --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
      --mark:#3987e5;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
      font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    a { color:inherit; }

    header { padding:16px 28px; border-bottom:1px solid var(--line); display:flex;
      align-items:baseline; gap:16px; flex-wrap:wrap; }
    h1 { margin:0; font-size:16px; letter-spacing:-.01em; }
    .nav { font-size:12px; color:var(--dim); text-decoration:none; }
    .nav:hover { color:var(--ink); }
    .freshness { margin-left:auto; font-size:12px; }

    main { padding:20px 28px 56px; max-width:1280px; margin:0 auto; }
    section { margin-bottom:22px; }
    h2 { font-size:13px; margin:0 0 8px; letter-spacing:.01em; }

    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 18px; }
    .msg { padding:70px 24px; text-align:center; color:var(--dim); }
    .msg code { background:var(--card); padding:2px 6px; border-radius:5px; color:var(--ink); }
    .empty, .muted { color:var(--muted); font-size:12px; }
    .dim { color:var(--dim); }
    .warn { color:var(--warning); }
    .mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; }

    /* The standing card: two lines, the steward's note behind the one fold. */
    .standing { line-height:1.7; }
    .standing b { font-weight:600; }

    /* The ladder: seven rungs, stage 1 at the top, because a story moves
       down it. Three columns on a laptop; one on a phone. */
    .rung { display:grid; grid-template-columns:150px 200px 1fr; gap:4px 24px; padding:10px 0;
      border-top:1px solid var(--line-soft); align-items:start; }
    .rung:first-child { border-top:0; padding-top:2px; }
    .rung .num { color:var(--muted); font-variant-numeric:tabular-nums; margin-right:8px; font-size:12px; }
    .rung .name { font-weight:600; }
    .rung .who { color:var(--muted); font-size:12px; line-height:1.5; }
    .items { margin:0; padding:0; list-style:none; display:grid; grid-template-columns:1fr; gap:2px; }
    .item { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
    .item .lbl { color:var(--dim); font-size:12px; min-width:140px; }
    .item .lbl a { color:var(--dim); }
    .flags { margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; align-items:flex-start; }
    .flag { color:var(--warning); border:1px solid rgba(250,178,25,.4); border-radius:5px;
      padding:1px 8px; font-size:12px; }
    /* Several ad changes with no log entry fold into one chip. */
    .flags details { border:0; margin:0; padding:0; }
    .flags details[open] { flex-basis:100%; }
    .flags details summary { display:inline-block; cursor:pointer; list-style:none; }
    .flags details summary::-webkit-details-marker { display:none; }
    .flags details summary:before { content:"\25B8\00a0"; color:inherit; }
    .flags details[open] summary:before { content:"\25BE\00a0"; }
    .flags .lines { margin:6px 0 0; padding:0; list-style:none; color:var(--dim); font-size:12px; line-height:1.6; }
    @media (max-width:860px) {
      .rung { grid-template-columns:1fr; gap:2px; }
      .item { display:block; }
      .item .lbl { min-width:0; margin-right:8px; }
    }

    /* The stories, each on the rung of its stage. The hollow marker in the
       warning colour is story.md's own word when it differs from the files. */
    .stories { margin-top:8px; padding-top:8px; border-top:1px solid var(--line-soft);
      display:grid; grid-template-columns:1fr; gap:6px; }
    .stories.alone { margin-top:0; padding-top:0; border-top:0; }
    .story .nm { font-weight:600; }
    .story .declared { color:var(--warning); font-weight:400; font-size:12px; margin-left:8px; white-space:nowrap; }
    .story .seg { color:var(--dim); font-size:12px; }
    .story .counts { color:var(--dim); font-size:12px; }

    /* Decisions, sessions, doors. */
    .list { margin:0; padding:0; list-style:none; }
    .list li { padding:5px 0; border-top:1px solid var(--line-soft); }
    .list li:first-child { border-top:0; padding-top:0; }
    .list li:last-child { padding-bottom:0; }
    .row { display:flex; gap:6px 18px; flex-wrap:wrap; align-items:baseline; }
    .session { font-family:ui-monospace,Menlo,monospace; font-weight:600; font-size:12px; }
    .session.next { color:var(--mark); }
    .next-tag { color:var(--mark); font-weight:500; font-size:12px; margin-left:6px;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    .doors a { color:var(--ink); }

    /* The fold. The same triangle the monitor uses; the text in it is verbatim. */
    details { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
    details summary { cursor:pointer; font-size:12px; color:var(--dim); list-style:none; }
    details summary::-webkit-details-marker { display:none; }
    details summary:before { content:"\25B8  "; color:var(--muted); }
    details[open] summary:before { content:"\25BE  "; }
    details .inner { padding:10px 2px 4px; line-height:1.7; }
    pre { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font-family:ui-monospace,Menlo,monospace;
      font-size:12px; line-height:1.6; color:var(--dim); background:var(--bg); border:1px solid var(--line-soft);
      border-radius:8px; padding:12px 14px; }
    .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 16px; align-items:baseline; }
    .kv dt { color:var(--dim); margin:0; font-size:12px; }
    .kv dd { margin:0; font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
  <header>
    <h1>Framework: Marketing</h1>
    <a class="nav" href="/metrics.html">&rarr; Funnel Monitor</a>
    <a class="nav" href="/catalog.html">&rarr; Catalog Manager</a>
    <div class="freshness" id="fresh"></div>
  </header>
  <main id="main"><div class="msg">Loading&hellip;</div></main>

  <script>
  (function () {
    // The key comes from the shared gate, not the URL. See js/gate.js.
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); };
    var show = function (h) { document.getElementById('main').innerHTML = h; };
    var arr = function (v) { return Array.isArray(v) ? v : []; };
    var obj = function (v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; };
    var has = function (v) { return v !== null && v !== undefined && v !== ''; };
    var D = null;

    // Nothing is fetched until the gate has a key the server accepts.
    FrameworkGate.ready()
      .then(function () { return FrameworkGate.fetch('/api/marketing-data'); })
      .then(function (r) {
        if (r.status === 401) throw new Error('Unauthorized. Check your key.');
        if (r.status === 404) throw new Error('Nothing published yet. The ops publish step sends the first snapshot; on npm run dev the state builder in framework-ops builds it on the spot.');
        if (!r.ok) return r.json().then(function (b) { throw new Error(b && b.error ? b.error : 'HTTP ' + r.status); }, function () { throw new Error('HTTP ' + r.status); });
        return r.json();
      })
      .then(function (d) { D = obj(d); render(); })
      .catch(function (e) { show('<div class="msg">' + esc(e.message) + '</div>'); });

    // ---------- dates ----------
    var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function parse(v) {
      if (!has(v)) return null;
      var d = new Date(v);
      return isNaN(d.getTime()) ? null : d;
    }
    function two(n) { return (n < 10 ? '0' : '') + n; }
    /** 9 Sep 2026, 11:42 in the reader's zone; a date with no time stays a date. */
    function fmt(v) {
      var d = parse(v);
      if (!d) return has(v) ? String(v) : '';
      var dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(String(v));
      var s = d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear();
      return dateOnly ? s : s + ', ' + two(d.getHours()) + ':' + two(d.getMinutes());
    }
    function ago(v) {
      var d = parse(v);
      if (!d) return '';
      var days = Math.floor((Date.now() - d.getTime()) / 86400000);
      return days <= 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago';
    }
    // A value that is itself a day or an instant: the builder's way of saying
    // that when it happened is the point.
    function isWhen(v) { return /^\d{4}-\d{2}-\d{2}(T\S*)?$/.test(String(v)); }

    // ---------- the shape the page holds even when the snapshot does not ----------
    // A story moves down this ladder from stage 3. Named here so an empty or
    // partial snapshot still shows the seven stages, which is the structure.
    var STAGES = [
      [1, 'Understand'], [2, 'Intend'], [3, 'Story'], [4, 'Produce'],
      [5, 'Distribute'], [6, 'Converse'], [7, 'Measure']
    ];
    var SESSIONS = ['strategy', 'ads', 'content', 'monitor'];
    var SITE_DOORS = [
      { label: 'Funnel Monitor', href: '/metrics.html' },
      { label: 'Catalog Manager', href: '/catalog.html' }
    ];

    function render() {
      var gen = D.generatedAt;
      var days = parse(gen) ? Math.floor((Date.now() - parse(gen).getTime()) / 86400000) : null;
      var col = days === null ? 'var(--muted)' : days <= 2 ? 'var(--good)' : days <= 7 ? 'var(--warning)' : 'var(--critical)';
      document.getElementById('fresh').innerHTML = parse(gen)
        ? '<span style="color:' + col + '" title="' + esc(fmt(gen)) + '">&#9679; Generated ' + esc(ago(gen)) + '</span>'
        : '<span class="muted">No generated time in this snapshot</span>';

      show(standing() + ladder() + decisions() + sessions() + doors() + structure() + extras());
    }

    // ---------- the standing card ----------
    // Line one: what waits on Ben and which session comes first. Line two:
    // when this was generated and from what, and the steward's standing.
    function standing() {
      var home = obj(D.home), st = obj(D.steward), spend = obj(st.spendMonth), nx = obj(D.next);
      var waiting = has(nx.decisions) ? Number(nx.decisions) : arr(D.decisions).length;
      var one = '<a href="#decisions"><b>' + esc(waiting) + ' decision' + (waiting === 1 ? '' : 's') + ' waiting</b></a>'
        + (has(nx.session) ? '; next: <span class="mono">' + esc(nx.session) + '</span>' : '');

      var two = 'generated ' + (has(D.generatedAt) ? esc(fmt(D.generatedAt)) : '<span class="muted">(no time)</span>')
        + (has(home.commit) ? ' from <span class="mono" title="' + esc(home.commit) + (has(home.branch) ? ' on ' + esc(home.branch) : '') + '">' + esc(String(home.commit).slice(0, 8)) + '</span>' : '');
      var s = [];
      if (has(st.installed)) s.push('steward ' + (st.installed ? 'installed' : 'not installed'));
      if (has(st.lastRun)) s.push('last run ' + esc(fmt(st.lastRun)));
      if (has(st.nextRun)) s.push('next ' + esc(fmt(st.nextRun)));
      if (has(spend.usd) || has(spend.capUsd)) {
        var over = has(spend.capUsd) && Number(spend.usd) > Number(spend.capUsd);
        s.push('<span class="' + (over ? 'warn' : '') + '">$' + esc(has(spend.usd) ? Number(spend.usd).toFixed(2) : '0.00')
          + (has(spend.capUsd) ? ' of $' + esc(spend.capUsd) : '') + ' this month</span>');
      }
      if (s.length) two += '; ' + s.join(', ');

      var schema = has(D.schema) && D.schema !== 'framework-marketing-state@1'
        ? '<div class="warn" style="margin-top:6px">Snapshot schema ' + esc(D.schema) + '; this page reads framework-marketing-state@1.</div>' : '';
      var fold = has(st.lastNote)
        ? '<details><summary>The steward\'s last note</summary><div class="inner"><pre>' + esc(st.lastNote) + '</pre></div></details>' : '';
      return '<section><div class="card standing">' + one + '<br>' + two + schema + fold + '</div></section>';
    }

    // ---------- the ladder ----------
    function ladder() {
      var given = {};
      arr(D.ladder).forEach(function (s) { s = obj(s); if (has(s.stage)) given[Number(s.stage)] = s; });
      // Each story sits on the rung of the stage the files put it at; one with
      // no stage, or a stage off the ladder, is listed after the seven rungs.
      var byStage = {}, off = [];
      arr(D.stories).map(obj).forEach(function (s) {
        var n = Number(s.stage);
        if (has(s.stage) && n >= 1 && n <= 7) (byStage[n] = byStage[n] || []).push(s);
        else off.push(s);
      });
      var rows = STAGES.map(function (pair) {
        var s = obj(given[pair[0]]);
        var items = arr(s.items), flags = arr(s.flags), mine = arr(byStage[pair[0]]);
        var who = [s.owner, s.cadence].filter(has).map(esc).join(' &middot; ');
        return '<div class="rung">'
          + '<div><span class="num">' + pair[0] + '</span><span class="name">' + esc(s.name || pair[1]) + '</span></div>'
          + '<div class="who">' + (who || 'nothing on record') + '</div>'
          + '<div>' + (items.length ? '<ul class="items">' + items.map(item).join('') + '</ul>' : (mine.length || flags.length ? '' : '<div class="empty">nothing on record</div>'))
            + chips(flags)
            + (mine.length ? '<div class="stories' + (items.length || flags.length ? '' : ' alone') + '">' + mine.map(story).join('') + '</div>' : '')
          + '</div></div>';
      });
      // Anything the snapshot put on the ladder outside 1 to 7 is still shown.
      arr(D.ladder).forEach(function (s) {
        s = obj(s);
        var n = Number(s.stage);
        if (has(s.stage) && (n >= 1 && n <= 7)) return;
        rows.push('<div class="rung"><div><span class="num">' + esc(has(s.stage) ? s.stage : '?') + '</span><span class="name">' + esc(s.name || '') + '</span></div>'
          + '<div class="who">' + esc(s.owner || '') + '</div><div>' + (arr(s.items).length ? '<ul class="items">' + arr(s.items).map(item).join('') + '</ul>' : '') + chips(arr(s.flags)) + '</div></div>');
      });
      if (off.length) {
        rows.push('<div class="rung"><div><span class="num">?</span><span class="name">Off the ladder</span></div>'
          + '<div class="who">a stage this page has no rung for</div>'
          + '<div><div class="stories alone">' + off.map(story).join('') + '</div></div></div>');
      }
      return '<section><h2>The ladder</h2><div class="card">' + rows.join('') + '</div></section>';
    }

    // One item: a label and a value. The label is the link where there is
    // one; a value that is a date is shown as one; the builder's note and
    // time sit behind the value as its title.
    function item(it) {
      it = obj(it);
      var v = it.value;
      var val = !has(v) ? '<span class="muted">none</span>'
        : isWhen(v) ? esc(fmt(v))
        : typeof v === 'number' ? esc(v.toLocaleString('en-US'))
        : esc(v);
      var lbl = esc(it.label || '');
      if (has(it.href) && isLink(it.href)) lbl = link(it.href, lbl);
      var title = [has(it.note) ? it.note : null, has(it.at) && !isWhen(v) ? fmt(it.at) : null].filter(has).join(' · ');
      return '<li class="item"><span class="lbl">' + lbl + '</span><span' + (title ? ' title="' + esc(title) + '"' : '') + '>' + val + '</span></li>';
    }
    function isLink(href) { return /^(https?:\/\/|\/)/i.test(String(href || '')); }
    function link(href, inner) {
      var h = String(href);
      var out = /^https?:\/\//i.test(h);
      var local = /^https?:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/i.test(h);
      return '<a href="' + esc(h) + '"' + (out ? ' target="_blank" rel="noopener"' : '') + (local ? ' title="local: needs the dev server"' : '') + '>' + inner + '</a>';
    }

    // The flags as chips. Two or more ad changes with no log entry fold into
    // one chip that opens on the lines themselves.
    var NO_LOG = /, no log entry$/;
    function flagText(f) { return typeof f === 'string' ? f : (f && (f.text || f.message)) || JSON.stringify(f); }
    function chips(flags) {
      var texts = arr(flags).map(flagText);
      var adChanges = texts.filter(function (t) { return NO_LOG.test(t); });
      var rest = adChanges.length >= 2 ? texts.filter(function (t) { return !NO_LOG.test(t); }) : texts;
      if (!rest.length && adChanges.length < 2) return '';
      var out = rest.map(function (t) { return '<span class="flag">' + esc(t) + '</span>'; });
      if (adChanges.length >= 2) {
        out.push('<details><summary class="flag">' + adChanges.length + ' ad changes with no log entry</summary>'
          + '<ul class="lines">' + adChanges.map(function (t) { return '<li>' + esc(t.replace(NO_LOG, '')) + '</li>'; }).join('') + '</ul></details>');
      }
      return '<div class="flags">' + out.join('') + '</div>';
    }

    // One story, on its rung: the name, the segment, its status; the counts
    // once it is at 4 or beyond; story.md's own word, hollow, when it differs.
    function story(s) {
      var c = obj(s.counts);
      var stage = Number(s.stage);
      var declared = has(s.stageDeclared) ? Number(s.stageDeclared) : stage;
      var differs = !isNaN(declared) && declared !== stage;
      var mark = differs
        ? ' <span class="declared" title="story.md says stage ' + esc(declared) + '; the files put it at ' + esc(stage) + '">&#9675; story.md says ' + esc(declared) + '</span>' : '';
      var counts = [];
      if (stage >= 4) {
        if (has(c.designsKept)) counts.push(n(c.designsKept, 'design') + ' kept');
        var sc = [];
        if (has(c.scenesKept)) sc.push(c.scenesKept + ' kept');
        if (has(c.scenesRejected)) sc.push(c.scenesRejected + ' rejected');
        if (has(c.scenesUnjudged)) sc.push(c.scenesUnjudged + ' unjudged');
        if (sc.length) counts.push('scenes ' + sc.join(', '));
      }
      // The marker already says what a "story.md says stage N" flag says.
      var flags = arr(s.flags).filter(function (f) { return !(differs && /^story\.md says stage/.test(flagText(f))); });
      return '<div class="story"><div><span class="nm">' + esc(s.name || s.slug || '(unnamed)') + '</span>' + mark + '</div>'
        + '<div>' + (has(s.segment) ? '<span class="seg">' + esc(s.segment) + ' &middot; </span>' : '')
        + (has(s.status) ? esc(s.status) : '<span class="muted">no status</span>') + '</div>'
        + (counts.length ? '<div class="counts">' + counts.join(' &middot; ') + '</div>' : '')
        + chips(flags)
        + '</div>';
    }
    function n(count, word) { var c = Number(count) || 0; return c + ' ' + word + (c === 1 ? '' : 's'); }

    // ---------- decisions ----------
    function decisions() {
      var list = arr(D.decisions);
      return '<section id="decisions"><h2>Decisions waiting on Ben</h2>'
        + '<div class="card">' + (list.length ? '<ul class="list">' + list.map(function (d) {
            if (typeof d === 'string') return '<li>' + esc(d) + '</li>';
            d = obj(d);
            return '<li' + (has(d.unblocks) ? ' title="Unblocks: ' + esc(d.unblocks) + '"' : '') + '>' + esc(d.text || '') + '</li>';
          }).join('') + '</ul>' : '<div class="empty">Nothing waiting.</div>') + '</div></section>';
    }

    // ---------- sessions ----------
    function sessions() {
      var given = obj(D.sessions);
      var nextCmd = has(obj(D.next).session) ? String(obj(D.next).session).replace(/^\//, '') : null;
      var names = SESSIONS.concat(Object.keys(given).filter(function (k) { return SESSIONS.indexOf(k) < 0; }));
      var row = names.map(function (k) {
        var isNext = nextCmd === k;
        return '<span class="session' + (isNext ? ' next' : '') + '">/' + esc(k) + (isNext ? '<span class="next-tag">next</span>' : '') + '</span>';
      });
      return '<section><h2>Sessions</h2><div class="card">'
        + '<div class="dim" style="margin-bottom:6px">Open Claude Code in the marketing folder and type the command.</div>'
        + '<div class="row">' + row.join('') + '</div></div></section>';
    }

    // ---------- doors ----------
    // Plain links in one row. The door to this page is not a door.
    function doors() {
      var here = /^\/marketing(\.html)?$/i;
      var list = arr(D.doors).map(obj).filter(function (d) {
        if (!has(d.href) && !has(d.label)) return false;
        return !(has(d.href) && here.test(String(d.href).replace(/^https?:\/\/[^/]+/i, '').replace(/\/$/, '')));
      });
      var hrefs = list.map(function (d) { return String(d.href || '').replace(/\/$/, ''); });
      SITE_DOORS.forEach(function (d) {
        var same = hrefs.some(function (h) { return h === d.href || h === d.href.replace(/\.html$/, ''); });
        if (!same) list.push(d);
      });
      return '<section><h2>Doors</h2><div class="card">' + (list.length ? '<div class="row doors">' + list.map(function (d) {
            var label = esc(d.label || d.href);
            return has(d.href) && isLink(d.href) ? link(d.href, label) : '<span' + (has(d.where) ? ' title="' + esc(d.where) + '"' : '') + '>' + label + '</span>';
          }).join('') + '</div>' : '<div class="empty">No doors listed.</div>') + '</div></section>';
    }

    // ---------- structure ----------
    function structure() {
      var st = obj(D.structure);
      // Nothing declares the folder's shape any more, so there is nothing to
      // police and the section would only add a line saying so.
      if (!st.declared || !st.declared.length) return '';
      var un = arr(st.undeclared), miss = arr(st.missing), decl = arr(st.declared);
      var body;
      if (!D.structure) body = '<div class="empty">No structure check in this snapshot.</div>';
      else if (!un.length && !miss.length) body = '<div>As declared' + (decl.length ? ' <span class="muted">(' + decl.length + ' entries in STRUCTURE.md)</span>' : '') + '.</div>';
      else body = (un.length ? '<div><span class="warn">Undeclared:</span> ' + un.map(function (x) { return '<span class="mono warn">' + esc(x) + '</span>'; }).join(', ') + '</div>' : '')
        + (miss.length ? '<div><span class="warn">Missing:</span> ' + miss.map(function (x) { return '<span class="mono warn">' + esc(x) + '</span>'; }).join(', ') + '</div>' : '');
      return '<section><h2>Structure</h2><div class="card">' + body + '</div></section>';
    }

    // ---------- anything the snapshot carries beyond the contract ----------
    // The builder may add a field before this page learns to draw it. Rather
    // than hide it, each one is here behind a fold, as it is. The keys named
    // here are drawn already, drawn onto the ladder by the builder (the
    // measures, the studio totals, the batches, the videos, the pages, the ad
    // changes), or live in the folder (the files), so they are not listed.
    var KNOWN = ['schema','generatedAt','home','structure','ladder','stories','steward','decisions','sessions','doors','files','measures',
      'next','studio','batches','videos','pages','undocumentedAdChanges'];
    function extras() {
      var keys = Object.keys(D).filter(function (k) { return KNOWN.indexOf(k) < 0; });
      if (!keys.length) return '';
      var out = keys.map(function (k) {
        var v = D[k];
        var inner;
        if (v === null || typeof v !== 'object') inner = '<div>' + esc(String(v)) + '</div>';
        else if (Array.isArray(v) && v.every(function (x) { return typeof x !== 'object' || x === null; })) inner = '<ul class="list">' + v.map(function (x) { return '<li>' + esc(String(x)) + '</li>'; }).join('') + '</ul>';
        else if (!Array.isArray(v) && Object.keys(v).every(function (x) { return v[x] === null || typeof v[x] !== 'object'; })) {
          inner = '<dl class="kv">' + Object.keys(v).map(function (x) { return '<dt>' + esc(x) + '</dt><dd>' + esc(v[x] === null ? '' : typeof v[x] === 'number' ? v[x].toLocaleString('en-US') : String(v[x])) + '</dd>'; }).join('') + '</dl>';
        } else inner = '<pre>' + esc(JSON.stringify(v, null, 2)) + '</pre>';
        var count = Array.isArray(v) ? ' <span class="muted">' + v.length + '</span>' : '';
        return '<details><summary><span class="mono">' + esc(k) + '</span>' + count + '</summary><div class="inner">' + inner + '</div></details>';
      });
      return '<section><h2>Also in the snapshot</h2><div class="card">' + out.join('') + '</div></section>';
    }
  })();
  </script>
</body>
</html>
