<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/css/gate.css">
<script src="/js/gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Framework — Catalog Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#101111;color:#ece8df;font-family:'DM Sans','Segoe UI',sans-serif}
button,input,select,textarea{font:inherit}
button{border:0}
button:not(:disabled){cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
a{color:inherit}
img{display:block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#0b0c0c}
::-webkit-scrollbar-thumb{background:#444;border-radius:4px}
.page{min-height:100vh;padding:18px}
.grid{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:16px;align-items:start}
.sticky{position:sticky;top:14px}
.drop{border:1px dashed #4d5a55;border-radius:8px;min-height:210px;display:flex;align-items:center;justify-content:center;background:#111313;overflow:hidden;position:relative}
.drop.scale-active{border-color:#d99a47;cursor:crosshair}
.drop img{width:100%;height:100%;max-height:360px;object-fit:contain;background:#0d0e0e}
.empty-drop{padding:22px;text-align:center;color:#9da6a1;font-size:12px;line-height:1.5}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.color-row{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:center}
.color-input{width:42px;height:36px;padding:3px;border-radius:7px;border:1px solid #3a403e;background:#101212;cursor:pointer}
.source-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:180px;overflow:auto;padding-right:2px}
.source-item{display:grid;grid-template-columns:46px 1fr;gap:9px;align-items:center;padding:8px;border:1px solid #2d3331;background:#121414;border-radius:7px}
.source-item img{width:46px;height:46px;object-fit:cover;border-radius:5px}
.source-name{font-size:12px;font-weight:800;color:#f3efe8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.source-meta{font-size:10px;color:#98a39d;margin-top:2px}
.source-actions{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.status-pill{font-size:10px;text-transform:uppercase;letter-spacing:.06em;border:1px solid #383e3c;color:#98a39d;padding:5px 7px;border-radius:99px;font-weight:800}
.status-pill.set{border-color:#315844;color:#cef5de;background:#14241c}
.status-pill.skip{border-color:#5b5036;color:#f5d89a;background:#211c12}
.status-pill.need{border-color:#6f3737;color:#ffd7d7;background:#241717}
.sets{display:flex;flex-direction:column;gap:14px}
.set-card{background:#171919;border:1px solid #2a2f2e;border-radius:8px;overflow:hidden}
.set-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #262b2a;background:#141616}
.set-name{font-size:13px;font-weight:800;color:#fff}
.set-status{font-size:11px;color:#a4aca8}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step{font-size:10px;text-transform:uppercase;letter-spacing:.06em;border:1px solid #383e3c;color:#98a39d;padding:5px 7px;border-radius:99px;font-weight:800}
.step.active{border-color:#d99a47;color:#ffd596;background:#2a2116}
.step.done{border-color:#315844;color:#cef5de;background:#14241c}
.step.skip{border-color:#4a4f4d;color:#858d88;background:#191c1b}
.result-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:#252a28}
.detail-options{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.detail-option{display:grid;grid-template-columns:38px 1fr;gap:7px;align-items:center;padding:6px;border:1px solid #343a37;border-radius:7px;background:#121414;color:#cbd1cd;text-align:left;font-size:10px;font-weight:800;line-height:1.25}
.detail-option:hover:not(:disabled){border-color:#718078;background:#18201d}
.detail-option.selected{border-color:#d99a47;background:#282116;color:#ffe1ad}
.detail-option img{width:38px;height:38px;border-radius:4px;object-fit:cover}
.detail-option.none{grid-template-columns:1fr;min-height:52px}
.detail-preview{margin-top:7px;color:#98a39d;font-size:10px;line-height:1.4}
.result{background:#111313;min-width:0}
.result-title{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-bottom:1px solid #242927}
.result-title span{font-size:12px;font-weight:800;color:#f5efe5}
.thumb{aspect-ratio:1/1;background:#0d0e0e;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.clickable{cursor:pointer}
.thumb.clickable:hover{outline:1px solid #d99a47;outline-offset:-1px}
.placeholder{font-size:12px;color:#76817b}
.download-row{display:flex;gap:6px;padding:9px 10px;border-top:1px solid #242927;min-height:48px;flex-wrap:wrap}
.prompt-preview{margin-top:12px;border:1px solid #2a2f2e;border-radius:8px;overflow:hidden;background:#111313}
.prompt-preview summary{padding:10px 12px;cursor:pointer;font-size:12px;font-weight:800;color:#f4efe6}
.prompt-preview pre{white-space:pre-wrap;margin:0;padding:0 12px 12px;color:#aeb8b2;font-size:11px;line-height:1.45;max-height:250px;overflow:auto}
.notice{padding:18px;border:1px solid #2a2f2e;background:#141616;border-radius:8px;color:#aeb8b2;font-size:13px;line-height:1.5}
.progress{height:4px;background:#242927;border-radius:999px;overflow:hidden;margin-top:12px}
.progress div{height:100%;background:#e6a44d;width:40%;animation:slide 1.2s ease-in-out infinite alternate;border-radius:999px}
.queue-panel{position:sticky;top:0;z-index:5;margin:-18px -18px 16px;padding:12px 18px;background:rgba(16,17,17,.96);backdrop-filter:blur(10px);border-bottom:1px solid #2a2f2e}
.queue-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.queue-title{font-size:12px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:.08em}
.queue-stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.queue-stat{font-size:11px;color:#c9d0cc;border:1px solid #343a37;background:#141616;border-radius:999px;padding:6px 9px;font-weight:800}
.queue-strip{display:flex;gap:7px;overflow:auto;padding-top:9px}
.queue-chip{flex:0 0 auto;max-width:360px;border:1px solid #343a37;background:#121414;border-radius:999px;padding:5px 6px 5px 10px;color:#cbd1cd;font-size:11px;font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:8px}
.queue-chip-label{min-width:0;overflow:hidden;text-overflow:ellipsis}
.queue-chip-actions{display:flex;gap:3px;align-items:center}
.queue-chip-actions button{height:20px;min-width:20px;padding:0 6px;border-radius:999px;border:1px solid #3c4140;background:#202323;color:#ebe6dd;font-size:10px;font-weight:900}
.queue-chip-actions button:hover:not(:disabled){background:#303535}
.queue-chip-actions button:disabled{opacity:.35}
.queue-chip.running{border-color:#d99a47;color:#ffd596;background:#2a2116}
.queue-chip.done{border-color:#315844;color:#cef5de;background:#14241c}
.queue-chip.error{border-color:#6f3737;color:#ffd7d7;background:#241717}
.debug-details{margin-top:8px;border:1px solid #2a2f2e;border-radius:8px;background:#111313}
.debug-details summary{padding:9px 10px;cursor:pointer;font-size:11px;font-weight:900;color:#f4efe6}
.studio{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:14px;align-items:start}
.upload-row{display:flex;flex-direction:column;gap:14px;position:sticky;top:118px}
.source-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.preview-actions{margin-top:10px;border:1px solid #2a2f2e;border-radius:8px;background:#111313;padding:9px;display:grid;gap:8px}
.preview-actions-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.preview-actions-buttons{display:flex;gap:5px;flex-wrap:wrap}
.source-mini-list{display:flex;gap:8px;overflow:auto;margin-top:10px;padding-bottom:2px}
.source-mini{flex:0 0 160px;border:1px solid #2d3331;background:#121414;border-radius:8px;padding:7px}
.source-mini.selected{border-color:#d99a47;background:#282116}
.source-mini img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:5px;background:#0d0e0e}
.source-mini-name{font-size:11px;font-weight:900;color:#f3efe8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}
.source-mini-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.rows{display:flex;flex-direction:column;gap:14px}
.flow-row{background:#171919;border:1px solid #2a2f2e;border-radius:9px;overflow:hidden}
.flow-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #262b2a;background:#141616}
.flow-title{font-size:13px;font-weight:900;color:#fff}
.flow-status{font-size:11px;color:#a4aca8;margin-top:2px}
.flow-lane{display:flex;gap:1px;overflow:auto;background:#252a28;padding-bottom:1px}
.flow-card{flex:0 0 255px;background:#111313;min-width:0}
.flow-card.source-card{flex-basis:230px}
.flow-card.add-card{display:flex;align-items:stretch;justify-content:center;background:#101212}
.flow-card.meta-card{flex-basis:300px;padding:10px;background:#121414}
.meta-card .input{height:32px;font-size:11px}
.meta-card .textarea{font-size:11px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.meta-grid .field.full{grid-column:1 / -1}
.meta-filenames{margin-top:8px;border:1px solid #2a2f2e;border-radius:7px;background:#0f1111;padding:8px;display:grid;gap:4px}
.meta-file{font-size:9px;color:#aeb8b2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-row{display:flex;gap:5px;padding:0 10px 8px;min-height:33px;align-items:center;flex-wrap:wrap}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-bottom:1px solid #242927;min-height:48px}
.card-title span{font-size:12px;font-weight:900;color:#f5efe5}
.card-sub{font-size:10px;color:#98a39d;margin-top:2px}
.card-actions{display:flex;gap:5px;flex-wrap:wrap;padding:9px 10px;border-top:1px solid #242927;min-height:48px}
.flow-card .btn-small,.source-tools .btn-small{height:25px;padding:0 8px;font-size:10px;border-radius:999px}
.flow-card .btn-primary,.source-tools .btn-primary{box-shadow:inset 0 -1px 0 rgba(0,0,0,.18)}
.card-actions{gap:4px;padding:8px 9px}
.add-inner{padding:14px;display:flex;flex-direction:column;gap:8px;min-width:240px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.menu-grid .btn{height:auto;min-height:34px;white-space:normal;line-height:1.2}
.drop.dragging{border-color:#d99a47;background:#171f1b}
.lib-overlay{position:fixed;inset:0;background:rgba(8,9,9,.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.lib-modal{width:min(920px,100%);max-height:86vh;background:#141414;border:1px solid #2a2a2a;border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden}
.lib-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid #2a2a2a}
.lib-head .title{font-size:14px;font-weight:800;color:#fff}
.lib-close{height:28px;width:28px;padding:0;border-radius:7px;background:#262929;color:#f6f2e9;border:1px solid #3c4140;font-weight:800}
.lib-filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid #2a2a2a}
.lib-kinds{display:flex;gap:6px}
.lib-kinds .btn-small{border-radius:999px}
.lib-search{flex:1;min-width:160px}
.lib-body{flex:1;overflow:auto;padding:14px 16px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.lib-item{border:1px solid #2a2a2a;border-radius:8px;background:#111313;overflow:hidden;text-align:left;color:#ece8df}
.lib-item:hover:not(:disabled){border-color:#d99a47}
.lib-thumb{aspect-ratio:1/1;background:#0d0e0e;display:flex;align-items:center;justify-content:center;overflow:hidden}
.lib-thumb img{width:100%;height:100%;object-fit:cover}
.lib-label{padding:6px 8px;font-size:10px;line-height:1.35}
.lib-label .name{font-weight:800;color:#f3efe8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-label .kind{color:#98a39d;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.lib-label .kind.note{text-transform:none;letter-spacing:0;line-height:1.4}
.lib-empty{padding:30px 10px;text-align:center;color:#9da6a1;font-size:12px;line-height:1.5}
@keyframes slide{from{transform:translateX(-70%)}to{transform:translateX(220%)}}
@media(max-width:980px){
  .grid{grid-template-columns:1fr}
  .studio{grid-template-columns:1fr}
  .upload-row{grid-template-columns:1fr}
  .upload-row{position:static}
  .sticky{position:static}
  .result-grid{grid-template-columns:1fr}
  .detail-options{grid-template-columns:1fr}
  .top{flex-direction:column}
  .top-actions{justify-content:flex-start}
}
</style>
</head>
<body>
<div id="framework-nav"></div>
<div id="root"></div>
<script src="/js/studio/chrome.js"></script>
<script src="/js/builder/engine.js"></script>
<script src="/js/studio/framework-names.js"></script>
<script src="/js/studio/scale.js"></script>
<script src="/js/studio/handoff.js"></script>
<script src="/js/studio/prompt-config.js"></script>
<script src="/js/studio/catalog-product-reference.js"></script>
<script type="text/babel">
const {useMemo,useRef,useState,useEffect}=React;
const CONFIG=window.PROMPT_CONFIG?.CONFIG||{};

const GEMINI_MODELS=[
  "gemini-3-pro-image-preview",
  "gemini-3.1-flash-image-preview",
  "gemini-2.5-flash-image"
];
const GEMINI_TEXT_MODELS=["gemini-3.5-flash","gemini-2.5-flash"];
const GEMINI_API_BASE="https://generativelanguage.googleapis.com/v1beta/models";
const GEMINI_TIMEOUT_MS=240000;
const SERVER_MAX_DIM=1280;
const DIRECT_MAX_DIM=1800;
const UPLOAD_MAX_DIM=1800;
const REQUEST_LIMIT=5500000;
const STORAGE_KEY="frameworkCatalogGeminiKeyV1";
const BACKGROUND_STORAGE_KEY="frameworkCatalogInitialBackgroundV1";
const SESSION_DB_NAME="frameworkCatalogStudio";
const SESSION_DB_STORE="sessions";
const SESSION_AUTOSAVE_KEY="catalog-v2-autosave";
const QUEUE_CONCURRENCY=2;
const DEFAULT_BACKGROUND={color:"#FFFFFF",name:""};
const ROW_IMAGE_DIR="images/shelving/configs";
const PRODUCT_REFERENCE=window.FRAMEWORK_CATALOG_REFERENCE||[];
const CATALOG_COLOR_SWATCHES=[
  {id:"charcoal_steel",label:"Charcoal steel",material:"steel",hex:"#171E20",usage:"dark powder-coated tube/bar shade"},
  {id:"cool_grey_mdf",label:"Cool grey MDF",material:"mdf",hex:"#94A4B0",usage:"lighter board/surface shade"},
  {id:"coral_steel",label:"Coral steel",material:"steel",hex:"#C8554B",usage:"dark powder-coated tube/bar shade"},
  {id:"soft_coral_mdf",label:"Soft coral MDF",material:"mdf",hex:"#F29A8C",usage:"lighter board/surface shade"},
  {id:"deep_blue_steel",label:"Deep blue steel",material:"steel",hex:"#143F68",usage:"dark powder-coated tube/bar shade"},
  {id:"sky_blue_mdf",label:"Sky blue MDF",material:"mdf",hex:"#82AAD0",usage:"lighter board/surface shade"},
  {id:"leaf_green_steel",label:"Leaf green steel",material:"steel",hex:"#6F986A",usage:"dark powder-coated tube/bar shade"},
  {id:"mint_green_mdf",label:"Mint green MDF",material:"mdf",hex:"#B3D4BE",usage:"lighter board/surface shade"}
];
const CATALOG_DETAILS=[
  {
    id:"joint",
    label:"Joint",
    shortLabel:"Tube joint",
    src:"/images/studio/details/shelf-10-joint.jpg",
    description:"The collar-and-socket connection between two separate round uprights at an MDF shelf.",
    analysisInstruction:"Find a visible tube joint/collar on the actual emptied shelf image. Return the real local upper-tube colour, lower-tube colour, washer/collar colour, and nearby MDF colour from that exact location. Do not assume the legacy blue-to-green source-detail colours; use blue/green only if those colours are actually visible in the emptied shelf at the chosen joint. If the shelf is one colour module at that location, upper tube, lower tube, and washer/collar should be the same steel colour.",
    geometryLock:`This is a two-part tube joint, not one continuous post. The upper round tube ends at a very thin flat washer: a shallow sharp-edged cylinder with a clean concentric hole, never a rounded bead, torus, or donut. The washer is painted exactly the same colour as the upper steel tube above it. A short smaller-diameter male peg continues through that hole. The lower round tube comes up through the MDF and terminates as an open receiving socket. In an assembled view, the peg enters that socket while the flat washer stays fully above the MDF with a visible air gap. The washer must never be thick, rounded, buried in, cut through, or fused into the MDF. Keep the main upper and lower tubes the same outside diameter; only the short joining peg is narrower.`
  },
  {
    id:"foot",
    label:"Foot",
    shortLabel:"Adjustable foot",
    src:"/images/studio/details/shelf-12-foot.jpg",
    description:"The lower tube, small adjustable leveling foot, and adjacent underside of the shelf.",
    analysisInstruction:"Find one bottom-level foot and return the leg colour, the nearest MDF board colour, the small foot colour, and the floor/background appearance. The MDF board and its supporting steel are the same hue family, but the MDF is always the lighter shade and the steel frame below it is darker.",
    geometryLock:`Keep the long round leg, its clean tube end, and the small threaded adjustable foot exactly as shown. The foot is a compact, distinct metal adjuster below the tube, not a large caster, cap, pad, or new bracket. The tube must stop at the foot; it must not intersect, sink into, or pass through the nearby MDF. Preserve the nearby MDF edge and the relative gap to the floor.`
  },
  {
    id:"under-mdf",
    label:"Under MDF",
    shortLabel:"Underside structure",
    src:"/images/studio/details/shelf-14-under-mdf.jpg",
    description:"The steel support structure and fasteners below the MDF shelf surface.",
    analysisInstruction:"Use the two uppermost shelf levels only: the top grey/charcoal MDF board and the next lower pink/coral MDF board. Return these two levels in that exact top-to-bottom order, plus every visible support-tube colour. Do not substitute lower blue or green shelves unless the upper two are absent. For each shelf level, the steel directly below the MDF surface matches the horizontal legs/supports it connects to; MDF is the lighter shade of that same hue family.",
    geometryLock:`Preserve the exact underside construction in the reference: every visible MDF plane in the same vertical order, each board's long overhang past its support bar, the straight exposed edges, slim steel support members below, visible fasteners, and their precise intersections with the round uprights. Do not simplify it into a generic shelf bracket, repeat one shelf colour for multiple boards, add extra rails, shorten an overhang, or hide the open negative spaces.`
  },
  {
    id:"mdf-edge",
    label:"MDF edge",
    shortLabel:"Bar + MDF edge",
    src:"/images/studio/details/shelf-11-mdf-edge.jpg",
    description:"The round upright, collar detail, support bar, and exposed MDF shelf edge.",
    analysisInstruction:"Find one shelf edge with its nearby upright and underside support. Return the MDF board colour, upright colour above and below the board if different, support-bar colour, and washer colour if a washer is present. The support bar directly below the MDF must match the steel legs/supports it connects to horizontally. The MDF surface is the lighter shade of the same hue family as its supporting steel. A washer, if present, matches the steel tube directly above it.",
    geometryLock:`Preserve the exposed MDF edge, the two round uprights, the small shallow collar at the joint, the full board overhang beyond the upright, and the short flat structural support bar below the board exactly as shown. The support stays below the MDF edge; do not turn it into a thick rail, a new shelf, or a bracket cutting through the board. No upright or support may intersect, sink into, or visually cut through the MDF.`
  }
];
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function makeId(prefix="id"){return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,9)}`}
function fmtBytes(n){if(!Number.isFinite(n))return "";if(n>1000000)return `${(n/1000000).toFixed(1)} MB`;if(n>1000)return `${Math.round(n/1000)} KB`;return `${n} B`}
function safeMsg(error){return String(error?.message||error||"Unknown error").replace(/\s+/g," ").slice(0,260)}
function shortErr(error){return safeMsg(error).slice(0,180)}
function dataUrlMime(dataUrl){return String(dataUrl||"").match(/^data:([^;]+);base64,/)?.[1]||"image/jpeg"}
function dataUrlBase64(dataUrl){return String(dataUrl||"").split(",")[1]||""}
function filenameSafe(name){return String(name||"catalog-set").toLowerCase().replace(/[^a-z0-9-]+/g,"-").replace(/-{2,}/g,"-").replace(/^-|-$/g,"").slice(0,70)||"catalog-set"}
function filenameInputSafe(name){return String(name||"").toLowerCase().replace(/[^a-z0-9-]+/g,"-").replace(/-{2,}/g,"-").replace(/^-+/g,"").slice(0,70)}
function titleFromId(id){return String(id||"catalog set").replace(/[-_]+/g," ").replace(/\b\w/g,char=>char.toUpperCase())}
function parsePriceValue(value){return Number(String(value||"").replace(/[^\d.]/g,""))||0}
function formatKshPrice(value,fallback=""){
  const numeric=parsePriceValue(value||fallback);
  if(!numeric)return "";
  return `Ksh ${new Intl.NumberFormat("en-US",{maximumFractionDigits:0}).format(numeric)}`;
}
/**
 * Everything a design code already knows about the product.
 *
 * The code resolves to the design itself, so the price it was quoted at, the
 * size, the finish and its address in the builder are all facts we hold -- there
 * is no reason to make someone retype them, or to have a model guess them from a
 * photograph. Returns null when the code does not resolve; a wrong code should
 * leave the row alone rather than half-fill it.
 */
async function factsFromDesignCode(code){
  if(!window.FrameworkNames?.CODE?.test(String(code||"")))return null;
  const res=await window.FrameworkGate.fetch(`/api/design?code=${encodeURIComponent(code)}`);
  if(!res.ok)return null;
  const body=await res.json();
  if(!body.ok||!body.design)return null;

  const facts={
    designerUrl:`https://framework.co.ke/builder/${body.code}`,
    priceValue:body.total_ksh||"",
    pieces:body.pieces??null,
    sizeCm:null
  };
  // Size from the design's own bounds, using the builder's engine. Works for
  // designs saved before the record carried anything but the shelf.
  try{
    const engine=window.FrameworkDesignerEngine;
    if(engine){
      const catalog=engine.normalizeCatalog(await (await fetch("/assets/shelving/catalog.json")).json());
      const bounds=engine.designBounds(catalog,engine.deserializeState(catalog,body.design));
      if(bounds){
        const cm=n=>Math.round(n/10);
        facts.sizeCm={w:cm(bounds[3]-bounds[0]),d:cm(bounds[4]-bounds[1]),h:cm(bounds[5]-bounds[2])};
      }
    }
  }catch(error){/* size is a nicety; the price and the link are the point */}
  return facts;
}

function defaultRowMeta(source){
  const sourceName=String(source?.name||"standard-stack");
  const ours=window.FrameworkNames?.parseLoose(sourceName);
  // A render's own filename is a terrible product id -- it would ship
  // fw-0nkcede-r-a45e24-l12-01-populated.jpg to the live site, and it says
  // nothing about what the product is called. When the source is one of ours,
  // take only the design code from it and leave the id to be typed.
  const id=ours?.strict?"catalog-set":filenameSafe(sourceName.replace(/\.[^.]+$/,""));
  return {
    id,
    title:titleFromId(id),
    priceValue:"",
    description:"",
    designerUrl:"/designer#",
    // Which shelf this product is, when the source image came from the render
    // console and still had its name. The package images keep their product-id
    // names -- starter-front.jpg is more use to a person than a hash -- so the
    // code travels in the JSON instead, and rides through to catalog.json.
    designCode:ours?.code||"",
    // Width x depth x height in cm, from the design the code names. A fact we
    // hold rather than something to guess from a photograph.
    sizeCm:null
  };
}
function normalizedRowMeta(source){
  const meta={...defaultRowMeta(source),...(source?.meta||{})};
  if(!meta.priceValue&&meta.price)meta.priceValue=String(parsePriceValue(meta.price)||"");
  return meta;
}
function imageExtension(image){
  const mime=dataUrlMime(image?.dataUrl||"");
  if(/png/i.test(mime))return "png";
  if(/webp/i.test(mime))return "webp";
  return "jpg";
}
function rowImageManifest(source){
  const meta=normalizedRowMeta(source);
  const id=filenameSafe(meta.id);
  const items=[];
  const used=new Map();
  const uniqueName=name=>{
    const count=used.get(name)||0;
    used.set(name,count+1);
    if(!count)return name;
    return name.replace(/(\.[^.]+)$/,(ext)=>`-${count+1}${ext}`);
  };
  if(source?.dataUrl)items.push({key:"source",json:false,name:uniqueName(`${id}-source.${imageExtension(source)}`),dataUrl:source.dataUrl});
  if(source?.filled?.dataUrl)items.push({key:"filled",json:true,name:uniqueName(`${id}-populated.${imageExtension(source.filled)}`),dataUrl:source.filled.dataUrl});
  if(source?.empty?.dataUrl)items.push({key:"empty",json:true,name:uniqueName(`${id}-emptied.${imageExtension(source.empty)}`),dataUrl:source.empty.dataUrl});
  (source?.children||[]).forEach((child,index)=>{
    if(!child?.dataUrl)return;
    const base=child.type==="angle"?"angle":child.type==="front"?"front":child.type==="detail"?(child.detailId||filenameSafe(child.label)):filenameSafe(child.label||`custom-${index+1}`);
    items.push({key:`${base}-${index+1}`,json:true,name:uniqueName(`${id}-${base}.${imageExtension(child)}`),dataUrl:child.dataUrl});
  });
  return items;
}
function rowJsonObject(source){
  const meta=normalizedRowMeta(source);
  const imagePaths=rowImageManifest(source).filter(item=>item.json).map(item=>`${ROW_IMAGE_DIR}/${item.name}`);
  const priceValue=parsePriceValue(meta.priceValue||meta.price);
  const row={
    id:filenameSafe(meta.id),
    title:meta.title||titleFromId(meta.id),
    image:imagePaths[0]||"",
    images:imagePaths,
    price:formatKshPrice(priceValue,meta.price),
    priceValue,
    description:meta.description||"",
    designerUrl:meta.designerUrl||"/designer#"
  };
  // Only when there is one, so a package without a code does not claim an empty
  // string as an answer.
  if(meta.designCode)row.designCode=meta.designCode;
  if(meta.sizeCm)row.size=`${meta.sizeCm.w} × ${meta.sizeCm.d} × ${meta.sizeCm.h} cm`;
  return row;
}
function imageVersion(image){
  if(!image?.dataUrl)return null;
  const {history,historyIndex,...version}=image;
  return version;
}
function withImageHistory(previous,next,status="done"){
  const clean=imageVersion({...next,status});
  if(!clean)return next;
  let history=Array.isArray(previous?.history)?previous.history.slice(0,(previous.historyIndex??previous.history.length-1)+1):[];
  const prior=imageVersion(previous);
  if(!history.length&&prior)history=[prior];
  history=[...history,clean];
  return {...clean,history,historyIndex:history.length-1};
}
function historyVersion(image,index){
  if(!Array.isArray(image?.history))return image;
  const bounded=Math.max(0,Math.min(image.history.length-1,index));
  return {...image,...image.history[bounded],history:image.history,historyIndex:bounded};
}

function readFileDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>reject(new Error("Could not read image"));
    img.src=src;
  });
}

async function resizeDataUrl(dataUrl,maxDim=SERVER_MAX_DIM,quality=.86){
  const img=await loadImage(dataUrl);
  const w=img.naturalWidth||img.width;
  const h=img.naturalHeight||img.height;
  const scale=Math.min(1,maxDim/Math.max(w,h));
  const outW=Math.max(1,Math.round(w*scale));
  const outH=Math.max(1,Math.round(h*scale));
  const canvas=document.createElement("canvas");
  canvas.width=outW;
  canvas.height=outH;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#f7f5ef";
  ctx.fillRect(0,0,outW,outH);
  ctx.drawImage(img,0,0,outW,outH);
  return canvas.toDataURL("image/jpeg",quality);
}

async function fileToSource(file){
  const raw=await readFileDataUrl(file);
  const dataUrl=await resizeDataUrl(raw,UPLOAD_MAX_DIM,.9);
  const img=await loadImage(dataUrl);
  return {
    id:makeId("src"),
    name:file.name||"source image",
    dataUrl,
    width:img.naturalWidth||img.width,
    height:img.naturalHeight||img.height,
    size:file.size||dataUrlBase64(dataUrl).length*.75,
    scale:{status:"unset"}
  };
}

async function fileToGeneratedImage(file){
  const raw=await readFileDataUrl(file);
  const dataUrl=await resizeDataUrl(raw,SERVER_MAX_DIM,.92);
  const img=await loadImage(dataUrl);
  return {
    dataUrl,
    base64:dataUrlBase64(dataUrl),
    mimeType:dataUrlMime(dataUrl),
    width:img.naturalWidth||img.width,
    height:img.naturalHeight||img.height,
    modelUsed:"manual replacement",
    replacedAt:Date.now(),
    status:"manual"
  };
}

function geminiGenerationConfig(model,options={}){
  const image={aspectRatio:options.aspect||"1:1"};
  if(model==="gemini-3-pro-image-preview"||model==="gemini-3.1-flash-image-preview")image.imageSize=options.imageSize||"2K";
  return {responseModalities:["TEXT","IMAGE"],imageConfig:image};
}

function normalizeGemini(response){
  const candidate=response?.candidates?.[0];
  if(!candidate)throw new Error("No candidates returned");
  const parts=candidate.content?.parts||[];
  const images=parts.filter(part=>part.inlineData).map(part=>({
    base64:part.inlineData.data,
    mimeType:part.inlineData.mimeType||"image/png",
    dataUrl:`data:${part.inlineData.mimeType||"image/png"};base64,${part.inlineData.data}`
  }));
  return {
    images,
    text:parts.filter(part=>part.text).map(part=>part.text).join("\n"),
    finish:candidate.finishReason
  };
}

function shouldTryNextGemini(error){
  const retryStatuses=new Set([404,408,409,429,500,502,503,504]);
  if(retryStatuses.has(error?.status))return true;
  return /fetch failed|network|overloaded|busy|capacity|unavailable|resource_exhausted|deadline|timeout|timed out|not found|model/i.test(shortErr(error));
}

async function callGeminiDirect(key,model,contents,options={}){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),GEMINI_TIMEOUT_MS);
  let response;
  try{
    response=await fetch(`${GEMINI_API_BASE}/${model}:generateContent?key=${encodeURIComponent(key)}`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      signal:controller.signal,
      body:JSON.stringify({contents,generationConfig:geminiGenerationConfig(model,options)})
    });
  }catch(error){
    const wrapped=new Error(error?.name==="AbortError"?"Gemini request timed out":"Gemini request failed");
    wrapped.status=error?.name==="AbortError"?504:503;
    throw wrapped;
  }finally{
    clearTimeout(timeout);
  }
  if(!response.ok){
    const body=await response.text();
    const err=new Error(`Gemini ${model} ${response.status}: ${body.slice(0,500)}`);
    err.status=response.status;
    throw err;
  }
  return normalizeGemini(await response.json());
}

async function callGeminiDirectWithFallback(key,contents,logger){
  const errors=[];
  for(let i=0;i<GEMINI_MODELS.length;i++){
    const model=GEMINI_MODELS[i];
    try{
      logger("info",`Gemini model ${i+1}/${GEMINI_MODELS.length}: ${model}`);
      const result=await callGeminiDirect(key,model,contents,{aspect:"1:1",imageSize:"2K"});
      if(!result.images?.length){
        const err=new Error(`No image returned from ${model}: ${result.text||result.finish||"empty response"}`);
        err.status=502;
        throw err;
      }
      return {...result,modelUsed:model,fallbackUsed:i>0,fallbackErrors:errors};
    }catch(error){
      errors.push(`${model}: ${shortErr(error)}`);
      const last=i===GEMINI_MODELS.length-1;
      logger(last?"error":"info",`Gemini ${model} failed: ${shortErr(error)}${!last&&shouldTryNextGemini(error)?" - trying fallback":""}`);
      if(last||!shouldTryNextGemini(error))throw new Error(errors.length>1?`Gemini fallback failed: ${errors.join(" | ")}`:shortErr(error));
    }
  }
  throw new Error("No Gemini image models configured");
}

async function callGeminiTextDirect(key,model,contents){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),60000);
  let response;
  try{
    response=await fetch(`${GEMINI_API_BASE}/${model}:generateContent?key=${encodeURIComponent(key)}`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      signal:controller.signal,
      body:JSON.stringify({contents})
    });
  }catch(error){
    const wrapped=new Error(error?.name==="AbortError"?"Gemini analysis timed out":"Gemini analysis request failed");
    wrapped.status=error?.name==="AbortError"?504:503;
    throw wrapped;
  }finally{clearTimeout(timeout)}
  if(!response.ok){
    const body=await response.text();
    const err=new Error(`Gemini ${model} ${response.status}: ${body.slice(0,500)}`);
    err.status=response.status;
    throw err;
  }
  return normalizeGemini(await response.json());
}

async function callGeminiTextDirectWithFallback(key,contents,logger){
  const errors=[];
  for(let i=0;i<GEMINI_TEXT_MODELS.length;i++){
    const model=GEMINI_TEXT_MODELS[i];
    try{
      logger("info",`Gemini analysis model ${i+1}/${GEMINI_TEXT_MODELS.length}: ${model}`);
      const result=await callGeminiTextDirect(key,model,contents);
      if(!result.text?.trim())throw new Error(`No analysis text returned from ${model}`);
      return {...result,modelUsed:model,fallbackUsed:i>0};
    }catch(error){
      errors.push(`${model}: ${shortErr(error)}`);
      const last=i===GEMINI_TEXT_MODELS.length-1;
      logger(last?"error":"info",`Gemini ${model} analysis failed: ${shortErr(error)}${!last&&shouldTryNextGemini(error)?" - trying fallback":""}`);
      if(last||!shouldTryNextGemini(error))throw new Error(errors.length>1?`Gemini analysis fallback failed: ${errors.join(" | ")}`:shortErr(error));
    }
  }
  throw new Error("No Gemini analysis models configured");
}

function makeJobId(){return `job_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,12)}`}

async function startServerJob(contents,logger){
  const jobId=makeJobId();
  const body=JSON.stringify({
    jobId,
    action:"image",
    provider:"gemini",
    geminiContents:contents,
    geminiOptions:{aspect:"1:1",imageSize:"2K"}
  });
  logger("info",`Starting background job ${jobId} (${fmtBytes(body.length)})`);
  if(body.length>REQUEST_LIMIT)throw new Error(`Job request is too large (${fmtBytes(body.length)}). Use fewer references or enter a browser Gemini key.`);
  const response=await window.FrameworkGate.fetch("/api/ai-start",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body
  });
  const raw=await response.text();
  let parsed;
  try{parsed=JSON.parse(raw)}catch{throw new Error(`Netlify ai-start ${response.status}: ${raw.slice(0,220)}`)}
  if(![200,202].includes(response.status))throw new Error(parsed.error||`Could not start job (${response.status})`);
  return jobId;
}

async function pollServerJob(jobId,logger){
  const started=Date.now();
  let interval=1800;
  let lastState="";
  let fetchFailures=0;
  while(Date.now()-started<14*60*1000){
    await wait(interval);
    interval=Math.min(4500,interval+350);
    let response;
    try{
      response=await window.FrameworkGate.fetch(`/api/ai-result?id=${encodeURIComponent(jobId)}&t=${Date.now()}`,{headers:{"Accept":"application/json"}});
      fetchFailures=0;
    }catch(error){
      fetchFailures+=1;
      const message=shortErr(error);
      logger(fetchFailures<4?"info":"error",`Job ${jobId}: status poll failed (${message}); retry ${fetchFailures}/6`);
      if(fetchFailures<6)continue;
      throw new Error(`Could not reach local Netlify job status endpoint for ${jobId}. Open the app through Netlify dev at http://localhost:8888/catalog.html and keep "npx netlify dev --port 8888" running. Last fetch error: ${message}`);
    }
    const raw=await response.text();
    let body;
    try{body=JSON.parse(raw)}catch{throw new Error(`Job poll ${response.status}: ${raw.slice(0,220)}`)}
    const elapsed=Math.round((Date.now()-started)/1000);
    if(body.state!==lastState){
      lastState=body.state;
      logger("info",`Job ${jobId}: ${body.state}${elapsed?` after ${elapsed}s`:""}`);
    }
    if(body.state==="pending"||body.state==="queued"||body.state==="processing")continue;
    if(body.state==="error")throw new Error(body.error||`Background job ${jobId} failed`);
    if(body.state==="done"){
      const result=body.result||{};
      const images=await Promise.all((result.images||[]).map(async image=>{
        if(image.dataUrl||image.base64){
          const mimeType=image.mimeType||"image/png";
          return {...image,mimeType,dataUrl:image.dataUrl||`data:${mimeType};base64,${image.base64}`};
        }
        if(image.url){
          const imageResponse=await window.FrameworkGate.fetch(`${image.url}${image.url.includes("?")?"&":"?"}t=${Date.now()}`);
          if(!imageResponse.ok)throw new Error(`Generated image download failed (${imageResponse.status})`);
          const blob=await imageResponse.blob();
          const dataUrl=await new Promise((resolve,reject)=>{
            const reader=new FileReader();
            reader.onload=()=>resolve(reader.result);
            reader.onerror=()=>reject(reader.error);
            reader.readAsDataURL(blob);
          });
          return {...image,mimeType:blob.type||image.mimeType||"image/png",dataUrl,base64:dataUrlBase64(dataUrl)};
        }
        return image;
      }));
      logger("success",`Job ${jobId} complete`);
      return {...result,images};
    }
  }
  throw new Error(`Background generation ${jobId} did not finish within 14 minutes`);
}

async function prepareReferences(refs,useBrowserKey){
  const maxDim=useBrowserKey?DIRECT_MAX_DIM:SERVER_MAX_DIM;
  return Promise.all(refs.map(async ref=>({
    ...ref,
    dataUrl:await resizeDataUrl(ref.dataUrl,maxDim,.84)
  })));
}

function buildContents(prompt,refs){
  const parts=[{text:prompt}];
  refs.forEach((ref,index)=>{
    const label=ref.label||`Reference ${index+1}`;
    parts.push({text:`REFERENCE IMAGE ${index+1}: ${label}`});
    parts.push({inlineData:{mimeType:dataUrlMime(ref.dataUrl),data:dataUrlBase64(ref.dataUrl)}});
  });
  return [{role:"user",parts}];
}

async function callImage(prompt,refs,browserKey,logger){
  const readyRefs=await prepareReferences(refs,Boolean(browserKey));
  const contents=buildContents(prompt,readyRefs);
  const result=browserKey
    ? await callGeminiDirectWithFallback(browserKey,contents,logger)
    : await pollServerJob(await startServerJob(contents,logger),logger);
  const image=result.images?.[0];
  if(!image?.dataUrl&&!image?.base64)throw new Error(result.text||"No generated image returned");
  const mimeType=image.mimeType||dataUrlMime(image.dataUrl)||"image/png";
  const dataUrl=image.dataUrl||`data:${mimeType};base64,${image.base64}`;
  return {...image,mimeType,dataUrl,base64:dataUrlBase64(dataUrl),modelUsed:result.modelUsed||null};
}

function parseJsonObject(text){
  const cleaned=String(text||"").replace(/```json\s*/gi,"").replace(/```\s*/g,"").trim();
  const first=cleaned.indexOf("{");
  const last=cleaned.lastIndexOf("}");
  if(first<0||last<=first)throw new Error("Detail analysis did not return JSON");
  return JSON.parse(cleaned.slice(first,last+1));
}

function productReferenceText(){
  return PRODUCT_REFERENCE.map(item=>[
    `ID: ${item.id}`,
    `Title: ${item.title}`,
    `Description: ${item.description}`,
    item.bestFor?`Best for: ${item.bestFor}`:""
  ].filter(Boolean).join("\n")).join("\n\n");
}

/**
 * What the live catalogue already calls things.
 *
 * Passed to the model as ground to avoid, not as style to imitate: without it
 * you get a second Curator and a description that reads like the one three rows
 * up. Read through the gate so retired products count too -- a name that was
 * used and turned off is still spent.
 */
async function catalogueLanguageInUse(){
  try{
    const res=await window.FrameworkGate.fetch("/api/catalog");
    if(!res.ok)return null;
    const body=await res.json();
    const products=(body.published&&body.published.products)||[];
    if(!products.length)return null;
    return products.map(p=>`- ${p.title||p.id}: ${String(p.description||"").trim()}`).join("\n");
  }catch(error){return null;}
}

function catalogMetaPrompt({referenceText,note,inUse}){
  return `You are writing product catalogue metadata for Framework Designs' modular shelving configurations in Nairobi.

Use the attached populated shelf image to understand the configuration, scale, colour story, use case, and visual character. Use the reference examples below only for naming/copy style and product vocabulary.

REFERENCE EXAMPLES:
${referenceText}

ALREADY IN THE CATALOGUE — do not repeat any of this:
${inUse||"(none yet)"}

DISTINCTNESS RULES (these outrank style):
- The new name must not reuse any distinctive word from the names above. If a
  product is already called "The Curator", nothing else may be a Curator.
- Do not echo the sentence shape or opening words of the descriptions above.
- Do not reuse their characteristic adjectives and metaphors. Reach for the
  thing this shelf actually is instead.
- Ordinary words (shelf, steel, Nairobi, storage) are fine to repeat; it is the
  memorable ones that must stay unique.

STYLE RULES:
- Create a short product name that feels like it belongs with the examples.
- The file ID must be a lowercase slug with words separated by dashes.
- The title can use "The ..." when it sounds natural, but it does not have to.
- The description should be one or two concise sentences, direct and useful, with the same plainspoken Framework tone.
- Do not mention prices, image filenames, links, discounts, delivery timelines, or unavailable facts.
- Do not invent exact dimensions or modules unless they are visually obvious from the image.
- If the note asks for a direction, follow it while staying consistent with the image.

OPTIONAL USER NOTE:
${String(note||"").trim()||"(none)"}

Respond with JSON only:
{
  "id":"lowercase-dashed-file-id",
  "title":"catalogue title",
  "description":"catalogue description"
}`;
}

async function generateCatalogMeta({image,source,note,browserKey,logger}){
  if(!image?.dataUrl)throw new Error("Generate a populated image before auto-filling row copy.");
  const prompt=catalogMetaPrompt({referenceText:productReferenceText(),note,inUse:await catalogueLanguageInUse()});
  const parts=[
    {text:prompt},
    {text:`POPULATED SHELF IMAGE for ${source?.name||"this row"}:`},
    {inlineData:{mimeType:dataUrlMime(image.dataUrl),data:dataUrlBase64(image.dataUrl)}}
  ];
  const raw=browserKey
    ? await callGeminiTextDirectWithFallback(browserKey,[{role:"user",parts}],logger)
    : await callServerText(parts,logger,"row copy");
  const parsed=parseJsonObject(raw.text);
  const id=filenameSafe(parsed.id||parsed.title||source?.name);
  if(!id||!parsed.title||!parsed.description)throw new Error("Row copy response was incomplete.");
  return {id,title:String(parsed.title).trim(),description:String(parsed.description).trim(),modelUsed:raw.modelUsed||null};
}

function detailAnalysisColourRules(detail){
  const swatches=CATALOG_COLOR_SWATCHES.map(item=>`- ${item.id}: ${item.label}, ${item.material}, ${item.hex}, ${item.usage}`).join("\n");
  const paletteLock=`FIXED FRAMEWORK COLOUR SWATCHES:
${swatches}

SWATCH-SELECTION RULES:
- Choose the closest Framework swatch family and material from the eight swatches above.
- MDF shelf boards always use one of the lighter MDF swatches. Steelwork, tubes, feet, bars, supports, collars, and washers always use one of the darker steel swatches.
- Match hue family by construction: charcoal_steel with cool_grey_mdf, coral_steel with soft_coral_mdf, deep_blue_steel with sky_blue_mdf, leaf_green_steel with mint_green_mdf.
- If the generated shelf image is visibly shifted from the exact reference swatch, report the nearest swatch_id plus an adjusted hex approximation from the image. Preserve the light/dark gap within a matching MDF/steel family by shifting paired colours in parallel rather than collapsing them to one value.
- If shadows or highlights make a part ambiguous, choose the nearest structural swatch by hue family and material, not a literal shadow colour.`;
  if(detail?.id==="joint"){
    return `${paletteLock}

JOINT-SPECIFIC COLOUR ANALYSIS RULES:
- Choose a real visible tube joint/collar from the attached emptied shelf image, not from the legacy detail reference.
- The chosen joint's colours must come from the emptied shelf image at that exact location. Do not import the old reference-detail blue/green colours unless those colours are visibly present on the emptied shelf.
- If the selected joint is within a single colour module, report the same steel colour for upper tube, lower tube, and washer/collar.
- If a true colour change is visible at the joint, report the upper tube colour and lower tube colour separately; the washer/collar inherits the tube colour immediately above it.
- The nearby MDF colour must come from the shelf plane adjacent to that same visible joint.`;
  }
  if(detail?.id==="foot"){
    return `${paletteLock}

FOOT-SPECIFIC COLOUR ANALYSIS RULES:

async function callServerText(parts,logger,label="detail analysis"){
  logger("info",`Starting Gemini ${label} with server key`);
  const response=await window.FrameworkGate.fetch("/api/ai",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action:"text",provider:"gemini",partsOrText:parts})
  });
  const raw=await response.text();
  if(!response.ok)throw new Error(`Netlify ${label} ${response.status}: ${raw.slice(0,220)}`);
  let result;
  try{result=JSON.parse(raw.trim())}catch{throw new Error(`Netlify ${label} returned invalid JSON: ${raw.slice(-220)}`)}
  if(result.status>=400)throw new Error(result.error||`Gemini ${label} failed (${result.status})`);
  if(!result.text?.trim())throw new Error(`Gemini ${label} returned no text`);
  logger("success",`Gemini ${label} complete${result.modelUsed?` (${result.modelUsed})`:""}`);
  return result;
}

async function analyzeDetailConfiguration(emptyImage,detail,browserKey,logger){
  const prompt=`You are a meticulous product-production analyst. Inspect ONLY the attached empty shelf image and return a compact JSON configuration brief for a later image edit. Do not generate an image. Do not infer geometry that is not visible.

DETAIL TYPE: ${detail.label}
DETAIL LOOKUP TASK: ${detail.analysisInstruction}

Choose one specific matching location visible in the empty shelf. Report the exact local colour mapping and studio look needed to recolour an existing detail reference image.

${detailAnalysisColourRules(detail)}

Respond with JSON only, no markdown:
{
  "target_location":"short, concrete location in the empty shelf",
  "steel_segments":[{"part":"upper/lower/left/right/support/washer","connects_to":"brief module or level relationship","swatch_id":"nearest steel swatch id from the fixed palette","color_name":"fixed swatch label","hex":"fixed swatch hex","hex_adjusted":"#RRGGBB if the visible shelf shifts the family, otherwise same as hex","value":"dark"}],
  "mdf_planes":[{"part":"main/upper/lower","supported_by_steel_part":"matching steel segment part","swatch_id":"nearest MDF swatch id from the fixed palette","color_name":"fixed swatch label","hex":"fixed swatch hex","hex_adjusted":"#RRGGBB if the visible shelf shifts the family, otherwise same as hex","value":"light"}],
  "background":{"color_name":"...","hex_approx":"#RRGGBB"},
  "lighting":"brief direction, softness, and exposure description",
  "material_notes":"state the selected steel/MDF swatch pairings, washer colour inheritance, and where steel colour transitions occur"
}`;
  const parts=[{text:prompt},{text:"EMPTY SHELF IMAGE — analyse this image only:"},{inlineData:{mimeType:dataUrlMime(emptyImage.dataUrl),data:dataUrlBase64(emptyImage.dataUrl)}}];
  const raw=browserKey
    ? await callGeminiTextDirectWithFallback(browserKey,[{role:"user",parts}],logger)
    : await callServerText(parts,logger);
  const configuration=parseJsonObject(raw.text);
  if(!configuration.target_location||!Array.isArray(configuration.steel_segments)||!Array.isArray(configuration.mdf_planes))throw new Error("Detail analysis was incomplete; retry the detail generation.");
  return {...configuration,modelUsed:raw.modelUsed||null};
}

function textBytes(text){return new TextEncoder().encode(text)}
function dataUrlBytes(dataUrl){
  const binary=atob(dataUrlBase64(dataUrl));
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return bytes;
}
const CRC_TABLE=(()=>{
  const table=new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c=n;
    for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);
    table[n]=c>>>0;
  }
  return table;
})();
function crc32(bytes){
  let c=0xffffffff;
  for(let i=0;i<bytes.length;i++)c=CRC_TABLE[(c^bytes[i])&0xff]^(c>>>8);
  return (c^0xffffffff)>>>0;
}
function pushU16(out,value){out.push(value&255,(value>>>8)&255)}
function pushU32(out,value){out.push(value&255,(value>>>8)&255,(value>>>16)&255,(value>>>24)&255)}
function pushBytes(out,bytes){for(let i=0;i<bytes.length;i++)out.push(bytes[i])}
function makeZip(entries){
  const out=[];
  const central=[];
  let offset=0;
  entries.forEach(entry=>{
    const nameBytes=textBytes(entry.name);
    const bytes=entry.bytes;
    const crc=crc32(bytes);
    const localOffset=offset;
    pushU32(out,0x04034b50);
    pushU16(out,20);
    pushU16(out,0);
    pushU16(out,0);
    pushU16(out,0);
    pushU16(out,0);
    pushU32(out,crc);
    pushU32(out,bytes.length);
    pushU32(out,bytes.length);
    pushU16(out,nameBytes.length);
    pushU16(out,0);
    pushBytes(out,nameBytes);
    pushBytes(out,bytes);
    offset=out.length;

    pushU32(central,0x02014b50);
    pushU16(central,20);
    pushU16(central,20);
    pushU16(central,0);
    pushU16(central,0);
    pushU16(central,0);
    pushU16(central,0);
    pushU32(central,crc);
    pushU32(central,bytes.length);
    pushU32(central,bytes.length);
    pushU16(central,nameBytes.length);
    pushU16(central,0);
    pushU16(central,0);
    pushU16(central,0);
    pushU16(central,0);
    pushU32(central,0);
    pushU32(central,localOffset);
    pushBytes(central,nameBytes);
  });
  const centralOffset=out.length;
  pushBytes(out,central);
  pushU32(out,0x06054b50);
  pushU16(out,0);
  pushU16(out,0);
  pushU16(out,entries.length);
  pushU16(out,entries.length);
  pushU32(out,central.length);
  pushU32(out,centralOffset);
  pushU16(out,0);
  return new Blob([new Uint8Array(out)],{type:"application/zip"});
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=name;

function openSessionDb(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(SESSION_DB_NAME,1);
    request.onupgradeneeded=()=>request.result.createObjectStore(SESSION_DB_STORE);
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}

async function idbPut(key,value){
  const db=await openSessionDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(SESSION_DB_STORE,"readwrite");
    tx.objectStore(SESSION_DB_STORE).put(value,key);
    tx.oncomplete=()=>{db.close();resolve()};
    tx.onerror=()=>{db.close();reject(tx.error)};
  });
}

async function idbGet(key){
  const db=await openSessionDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(SESSION_DB_STORE,"readonly");
    const request=tx.objectStore(SESSION_DB_STORE).get(key);
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
    tx.oncomplete=()=>db.close();
  });
}

function bytesToText(bytes){return new TextDecoder().decode(bytes)}
function bytesToDataUrl(bytes,mimeType="image/jpeg"){
  let binary="";
  const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary+=String.fromCharCode(...bytes.slice(i,i+chunk));
  }
  return `data:${mimeType};base64,${btoa(binary)}`;
}

function mimeFromName(name){
  if(/\.png$/i.test(name))return "image/png";
  if(/\.webp$/i.test(name))return "image/webp";
  if(/\.jpe?g$/i.test(name))return "image/jpeg";
  if(/\.json$/i.test(name))return "application/json";
  return "application/octet-stream";
}

async function parseStoredZip(file){
  const bytes=new Uint8Array(await file.arrayBuffer());
  const entries=[];
  let offset=0;
  while(offset+30<=bytes.length){
    const sig=bytes[offset]|(bytes[offset+1]<<8)|(bytes[offset+2]<<16)|(bytes[offset+3]<<24);
    if(sig!==0x04034b50)break;
    const method=bytes[offset+8]|(bytes[offset+9]<<8);
    const size=(bytes[offset+18]|(bytes[offset+19]<<8)|(bytes[offset+20]<<16)|(bytes[offset+21]<<24))>>>0;
    const nameLen=bytes[offset+26]|(bytes[offset+27]<<8);
    const extraLen=bytes[offset+28]|(bytes[offset+29]<<8);
    const name=bytesToText(bytes.slice(offset+30,offset+30+nameLen));
    const dataStart=offset+30+nameLen+extraLen;
    const data=bytes.slice(dataStart,dataStart+size);
    if(method!==0)throw new Error("Only stored row ZIP files exported by this app can be imported.");
    entries.push({name,data,mimeType:mimeFromName(name)});
    offset=dataStart+size;
  }
  if(!entries.length)throw new Error("No files found in ZIP.");
  return entries;
}

async function sourceFromRowZip(file){
  const entries=await parseStoredZip(file);
  const jsonEntry=entries.find(entry=>/\.json$/i.test(entry.name));
  if(!jsonEntry)throw new Error("Row ZIP does not contain a product JSON file.");
  const product=JSON.parse(bytesToText(jsonEntry.data));
  const folder=(jsonEntry.name.match(/^(.+)\//)||[])[1]||filenameSafe(product.id||file.name);
  const images=entries.filter(entry=>/^image\//.test(entry.mimeType)).map(entry=>({
    ...entry,
    basename:entry.name.split("/").pop(),
    dataUrl:bytesToDataUrl(entry.data,entry.mimeType)
  }));
  const findImage=patterns=>images.find(image=>patterns.some(pattern=>pattern.test(image.basename)));
  const sourceImage=findImage([/-source\./i,/_source\./i])||images[0]||null;
  const filledImage=findImage([/-populated\./i,/_filled\./i,/-filled\./i]);
  const emptyImage=findImage([/-emptied\./i,/_empty\./i,/-empty\./i]);
  const used=new Set([sourceImage?.name,filledImage?.name,emptyImage?.name].filter(Boolean));
  const children=images.filter(image=>!used.has(image.name)).map((image,index)=>{
    const base=image.basename.replace(/\.[^.]+$/,"");
    const type=/-angle$/i.test(base)?"angle":/-front$/i.test(base)?"front":/-joint$|-foot$|-under-mdf$|-mdf-edge$/i.test(base)?"detail":/-detail-from-emptied$/i.test(base)?"crop-detail":"custom";
    return {
      id:makeId("gen"),
      type,
      label:type==="angle"?"Empty angle":type==="front"?"Front-facing empty":type==="crop-detail"?"Detail from emptied":titleFromId(base.replace(/^.+?-/,"")),
      dataUrl:image.dataUrl,
      base64:dataUrlBase64(image.dataUrl),
      mimeType:image.mimeType,
      status:"done"
    };
  });
  const loadedImage=image=>image?{
    dataUrl:image.dataUrl,
    base64:dataUrlBase64(image.dataUrl),
    mimeType:image.mimeType,
    status:"done",
    importedAt:Date.now()
  }:null;
  const primaryDataUrl=sourceImage?.dataUrl||filledImage?.dataUrl||emptyImage?.dataUrl||"";
  const img=primaryDataUrl?await loadImage(primaryDataUrl):null;
  return {
    id:makeId("src"),
    name:`${filenameSafe(product.id||folder)}.jpg`,
    dataUrl:primaryDataUrl,
    width:img?.naturalWidth||img?.width||0,
    height:img?.naturalHeight||img?.height||0,
    size:sourceImage?.data?.length||0,
    scale:{status:"skipped"},
    meta:{
      id:filenameSafe(product.id||folder),
      title:product.title||titleFromId(product.id||folder),
      priceValue:String(parsePriceValue(product.priceValue||product.price)),
      description:product.description||"",
      designerUrl:product.designerUrl||"/designer#"
    },
    filled:loadedImage(filledImage),
    empty:loadedImage(emptyImage),
    children,
    status:emptyImage?"emptied ready":filledImage?"populated ready":"ready"
  };
}

function imageLikeToGenerated(image,status="done"){
  const dataUrl=image?.dataUrl||(image?.base64?`data:${image.mimeType||"image/jpeg"};base64,${image.base64}`:"");
  if(!dataUrl)return null;
  return {
    ...image,
    dataUrl,
    base64:dataUrlBase64(dataUrl),
    mimeType:image.mimeType||dataUrlMime(dataUrl),
    status,
    importedAt:image.importedAt||Date.now()
  };
}

function normalizeImportedSource(source,index=0){
  const dataUrl=source?.dataUrl||(source?.base64?`data:${source.mimeType||"image/jpeg"};base64,${source.base64}`:"");
  const name=source?.name||source?.filename||`imported-source-${index+1}.jpg`;
  return {
    ...source,
    id:source?.id||makeId("src"),
    name,
    dataUrl,
    width:source?.width||0,
    height:source?.height||0,
    scale:source?.scale||{status:"skipped"},
    meta:normalizedRowMeta(source),
    filled:imageLikeToGenerated(source?.filled),
    empty:imageLikeToGenerated(source?.empty),
    children:Array.isArray(source?.children)?source.children.map(child=>({...child,id:child.id||makeId("gen"),dataUrl:child.dataUrl||(child.base64?`data:${child.mimeType||"image/jpeg"};base64,${child.base64}`:""),status:child.status||"done"})):[],
    status:source?.status||((source?.empty?.dataUrl||source?.empty?.base64)?"emptied ready":(source?.filled?.dataUrl||source?.filled?.base64)?"populated ready":"ready")
  };
}

function sourcesFromLegacyGeneratorSession(session){
  const ref=session?.refImage||session?.source||null;
  const refDataUrl=ref?.dataUrl||(ref?.base64?`data:${ref.mimeType||"image/jpeg"};base64,${ref.base64}`:"");
  if(!refDataUrl)return [];
  const generated=(Array.isArray(session.nodes)?session.nodes:[])
    .filter(node=>node?.type!=="ref"&&node?.type!=="ref-scale"&&node?.img?.dataUrl)
    .map((node,index)=>({
      id:makeId("gen"),
      type:index===0?"custom":"custom",
      label:node.type==="gen"?"Imported generated image":titleFromId(node.type||`imported-${index+1}`),
      ...imageLikeToGenerated(node.img)
    }));
  return [normalizeImportedSource({
    name:"legacy-generator-import.jpg",
    dataUrl:refDataUrl,
    width:ref.width||0,
    height:ref.height||0,
    scale:session?.scale?.shelfH?{status:"set",shelfH:session.scale.shelfH,pxCm:session.scale.pxCm||null}:{status:"skipped"},
    meta:defaultRowMeta({name:"legacy-generator-import.jpg"}),
    children:generated
  })];
}

function normalizeImportedSession(session){
  if(Array.isArray(session?.sources))return session.sources.map(normalizeImportedSource);
  if(Array.isArray(session))return session.map(normalizeImportedSource);
  const legacy=sourcesFromLegacyGeneratorSession(session);
  if(legacy.length)return legacy;
  if(session?.id||session?.title||session?.description){
    return [normalizeImportedSource({
      name:`${filenameSafe(session.id||session.title||"imported-config")}.jpg`,
      meta:{
        id:filenameSafe(session.id||session.title||"imported-config"),
        title:session.title||titleFromId(session.id||"imported config"),
        priceValue:String(parsePriceValue(session.priceValue||session.price)),
        description:session.description||"",
        designerUrl:session.designerUrl||"/designer#"
      },
      status:"metadata imported"
    })];
  }
  throw new Error("This JSON does not look like a catalog session or compatible Framework config.");
}

function formatMs(ms){
  if(!Number.isFinite(ms)||ms<0)return "0s";
  const total=Math.floor(ms/1000);
  const min=Math.floor(total/60);
  const sec=total%60;
  if(min>=60){
    const hr=Math.floor(min/60);
    const rest=min%60;
    return `${hr}h ${rest}m`;
  }
  return min?`${min}m ${String(sec).padStart(2,"0")}s`:`${sec}s`;
}
