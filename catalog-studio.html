      patchSource(previewSource.id,{scale:FrameworkScale.UNSET,scaleImage:null});
    },
    onSkip:()=>{
      if(!previewSource)return;
      patchSource(previewSource.id,{scale:FrameworkScale.SKIPPED,scaleImage:null});
      addLog("info",`${previewSource.name}: scale skipped`);
    }
  });
  const skipScale=source=>{selectPreview(source.id,"source");scaleTool.skip()};

  // A session measures the source photograph. Looking at a generated image
  // instead ends it rather than leaving it armed against the wrong picture.
  useEffect(()=>{if(previewType!=="source")scaleTool.cancel()},[previewType]);

  function commitSources(updater){
    const next=typeof updater==="function"?updater(sourcesRef.current):updater;
    sourcesRef.current=next;
    setSources(next);
  }

  function addLog(level,message){
    setLog(prev=>[{id:makeId("log"),time:new Date().toLocaleTimeString(),level,message},...prev].slice(0,160));
  }

  function sessionSnapshot(){
    return {
      version:2,
      savedAt:new Date().toISOString(),
      background,
      scaleCm,
      firstGenerationNote,
      sources:sourcesRef.current,
      log
    };
  }

  function getSource(id){return sourcesRef.current.find(source=>source.id===id)||null}

  function selectPreview(sourceId,type="source",childId=null){
    setActiveSource(sourceId);
    setPreviewSelection({sourceId,type,childId});
  }

  function patchSource(id,patch){
    commitSources(prev=>prev.map(source=>source.id===id?{...source,...(typeof patch==="function"?patch(source):patch)}:source));
  }

  function patchChild(sourceId,childId,patch){
    patchSource(sourceId,source=>({
      children:(source.children||[]).map(child=>child.id===childId?{...child,...(typeof patch==="function"?patch(child):patch)}:child)
    }));
  }

  function updateSourceMeta(sourceId,field,value){
    patchSource(sourceId,source=>({meta:{...normalizedRowMeta(source),[field]:value}}));
  }

  async function autoGenerateRowMeta(source){
    const note=String(normalizedRowMeta(source).aiNote||"").trim();
    const logger=(level,message)=>addLog(level,`${source.name}: ${message}`);
    patchSource(source.id,{metaStatus:"generating row copy"});
    try{
      const generated=await generateCatalogMeta({
        image:source.filled,
        source,
        note,
        browserKey:browserKey.trim(),
        logger
      });
      patchSource(source.id,current=>({
        meta:{
          ...normalizedRowMeta(current),
          id:generated.id,
          title:generated.title,
          description:generated.description
        },
        metaStatus:`row copy filled${generated.modelUsed?` (${generated.modelUsed})`:""}`
      }));
    }catch(error){
      patchSource(source.id,{metaStatus:"row copy error"});
      addLog("error",`${source.name}: row copy failed - ${safeMsg(error)}`);
    }
  }

  function patchGeneratedImage(source,type,updater,child=null){
    if(type==="filled"){
      patchSource(source.id,current=>({filled:typeof updater==="function"?updater(current.filled):updater}));
    }else if(type==="empty"){
      patchSource(source.id,current=>({empty:typeof updater==="function"?updater(current.empty):updater}));
    }else if(child){
      patchChild(source.id,child.id,current=>typeof updater==="function"?updater(current):updater);
    }
  }

  function moveImageHistory(source,type,delta,child=null){
    const current=type==="filled"?source.filled:type==="empty"?source.empty:child;
    if(!Array.isArray(current?.history))return;
    const index=(current.historyIndex??current.history.length-1)+delta;
    patchGeneratedImage(source,type,image=>historyVersion(image,index),child);
  }

  // Uploading is the other thing a click on an empty drop zone can mean, so it
  // is checked before the scale tool sees the event.
  function handleSourcePreviewClick(event){
    if(!previewSource){
      fileRef.current?.click();
      return;
    }
    scaleTool.imageProps.onClick(event);
  }

  function beginScale(source){
    selectPreview(source.id,"source");
    scaleTool.begin();
  }

  async function loadFiles(files){
    const [file]=[...(files||[])].filter(item=>item.type?.startsWith("image/"));
    if(!file)return;
    // Replacing, not appending -- so say what is about to be lost. Generated
    // images cost real money and are not worth dropping on a stray drag.
    if(sources.length&&hasGeneratedWork(sources[0])
       &&!window.confirm("Start a new row?\n\nThe images generated for the current row will be cleared. Download them first if you want to keep them."))return;
    addLog("info",`Loading ${file.name}`);
    try{
      const source=await fileToSource(file);
      const row={...source,meta:defaultRowMeta(source),filled:null,empty:null,children:[],status:"ready"};
      commitSources([row]);
      setActiveSource(row.id);
      selectPreview(row.id,"source");
      addLog("success",`Row source: ${file.name}`);
    }catch(error){
      addLog("error",`Image load failed: ${safeMsg(error)}`);
    }
  }

  /** Whether a row holds anything that cost a generation. */
  function hasGeneratedWork(source){
    return Boolean(source&&(source.filled?.dataUrl||source.empty?.dataUrl||(source.children||[]).some(child=>child.dataUrl)));
  }

  async function loadFromLibrary(record){
    addLog("info",`Loading ${record.configId||record.hash.slice(0,10)} from Library…`);
    try{
      const res=await fetch(window.DamClient.assetUrl(record.hash,record.ext||"jpg"));
      if(!res.ok)throw new Error(`Library fetch failed (${res.status})`);
      const blob=await res.blob();
      const file=new File([blob],`${record.configId||"library"}.jpg`,{type:blob.type||"image/jpeg"});
      const source=await fileToSource(file);
      source.meta={...defaultRowMeta(source),id:record.configId||defaultRowMeta(source).id};
      source.damHash=record.hash;
      source.damModules=record.modules||null;
      if(Number.isFinite(record.unitHeightMm)&&record.unitHeightMm>0){
        source.scale={status:"set",shelfH:Math.round(record.unitHeightMm/10)};
      }
      const loadedSource={...source,filled:null,empty:null,children:[],status:"ready"};
      commitSources(prev=>[...prev,loadedSource]);
      setActiveSource(loadedSource.id);
      selectPreview(loadedSource.id,"source");
      addLog("success",`Loaded ${loadedSource.meta.id} from Library`);
      setLibraryOpen(false);
    }catch(error){
      addLog("error",`Library load failed: ${safeMsg(error)}`);
    }
  }

  async function handleFiles(event){
    await loadFiles([...(event.target.files||[])]);
    event.target.value="";
  }

  function handleDrop(event){
    event.preventDefault();
    setDragging(false);
    loadFiles([...(event.dataTransfer?.files||[])]);
  }

  function deleteSource(sourceId){
    const source=getSource(sourceId);
    commitSources(prev=>prev.filter(item=>item.id!==sourceId));
    if(activeSource===sourceId)setActiveSource(null);
    if(previewSelection?.sourceId===sourceId)setPreviewSelection(null);
    scaleTool.cancel();
    addLog("info",`${source?.name||"Source"} removed. Queued jobs for it will be skipped.`);
  }

  function requestSnapshot(source){
    return {scaleLine:scaleLineForSource(source,scaleCm),browserKey};
  }

  function enqueueJob(job){
    const record={
      id:makeId("job"),
      label:job.label,
      sourceId:job.sourceId,
      targetId:job.targetId||null,
      type:job.type,
      status:"pending",
      enqueuedAt:Date.now(),
      startedAt:null,
      completedAt:null,
      estimatedCost:COST_ESTIMATES[job.type]||.04
    };
    jobQueueRef.current.push({...job,jobId:record.id});
    setQueueItems(prev=>[...prev,record].slice(-100));
    processJobQueue();
    return record.id;
  }

  function queueCanStart(job){
    return job?.sourceId&&!activeSourceLocksRef.current.has(job.sourceId);
  }

  function resetQueuedTarget(job){
    if(!job)return;
    const source=getSource(job.sourceId);
    if(!source)return;
    if(job.targetId){
      if(job.preserveTargetOnCancel){
        patchChild(job.sourceId,job.targetId,child=>({...child,status:child.dataUrl?"done":"error"}));
      }else{
        patchSource(job.sourceId,current=>({children:(current.children||[]).filter(child=>child.id!==job.targetId)}));
      }
    }else if(job.type==="filled"||job.imageType==="filled"){
      patchSource(job.sourceId,current=>({status:source.filled?.dataUrl?"populated ready":"ready",filled:current.filled?.dataUrl?{...current.filled,status:"done"}:current.filled}));
    }else if(job.type==="empty"||job.imageType==="empty"){
      patchSource(job.sourceId,current=>({status:source.empty?.dataUrl?"emptied ready":source.filled?.dataUrl?"populated ready":"ready",empty:current.empty?.dataUrl?{...current.empty,status:"done"}:current.empty}));
    }
  }

  function cancelQueuedJob(id){
    const job=jobQueueRef.current.find(item=>item.jobId===id);
    if(!job){
      addLog("info","Running jobs cannot be cancelled here; cancel pending jobs before they start.");
      return;
    }
    jobQueueRef.current=jobQueueRef.current.filter(item=>item.jobId!==id);
    resetQueuedTarget(job);
    setQueueItems(prev=>prev.filter(item=>item.id!==id));
    addLog("info",`${job.label}: removed from queue`);
  }

  function moveQueuedJob(id,direction){
    const queue=jobQueueRef.current;
    const index=queue.findIndex(item=>item.jobId===id);
    if(index<0)return;
    const nextIndex=index+direction;
    if(nextIndex<0||nextIndex>=queue.length)return;
    [queue[index],queue[nextIndex]]=[queue[nextIndex],queue[index]];
    jobQueueRef.current=[...queue];
    const order=new Map(jobQueueRef.current.map((item,idx)=>[item.jobId,idx]));
    setQueueItems(prev=>[...prev].sort((a,b)=>{
      const aOrder=order.has(a.id)?order.get(a.id):a.status==="running"?-1:9999;
      const bOrder=order.has(b.id)?order.get(b.id):b.status==="running"?-1:9999;
      return aOrder-bOrder;
    }));
  }

  function processJobQueue(){
    if(processingJobsRef.current)return;
    processingJobsRef.current=true;
    try{
      while(activeJobsRef.current.size<QUEUE_CONCURRENCY){
        const index=jobQueueRef.current.findIndex(queueCanStart);
        if(index<0)break;
        const [job]=jobQueueRef.current.splice(index,1);
        runQueuedJob(job);
      }
      const hasWork=activeJobsRef.current.size>0||jobQueueRef.current.length>0;
      setRunning(hasWork);
      if(hasWork)setProcessStartedAt(start=>start||Date.now());
      if(!activeJobsRef.current.size)setActiveJobId(null);
      if(!hasWork)setProcessStartedAt(null);
    }finally{
      processingJobsRef.current=false;
    }
  }

  async function runQueuedJob(job){
    const startedAt=Date.now();
    activeJobsRef.current.set(job.jobId,job);
    activeSourceLocksRef.current.add(job.sourceId);
    setActiveJobId(current=>current||job.jobId);
    setQueueItems(prev=>prev.map(item=>item.id===job.jobId?{...item,status:"running",startedAt}:item));
    try{
      await job.run();
      const completedAt=Date.now();
      const elapsed=completedAt-startedAt;
      setQueueItems(prev=>prev.map(item=>item.id===job.jobId?{...item,status:"done",completedAt,elapsedMs:elapsed}:item));
      setCompletedStats(prev=>({count:prev.count+1,estimatedSpend:prev.estimatedSpend+(COST_ESTIMATES[job.type]||.04),elapsedMs:prev.elapsedMs+elapsed}));
    }catch(error){
      job.onError?.(error);
      addLog("error",`${job.label}: ${safeMsg(error)}`);
      setQueueItems(prev=>prev.map(item=>item.id===job.jobId?{...item,status:"error",completedAt:Date.now(),error:safeMsg(error)}:item));
    }finally{
      activeJobsRef.current.delete(job.jobId);
      activeSourceLocksRef.current.delete(job.sourceId);
      setActiveJobId(current=>current===job.jobId?Array.from(activeJobsRef.current.keys())[0]||null:current);
      setTimeout(processJobQueue,0);
    }
  }

  function ensureSourceReady(source){
    if(!source)throw new Error("Source was removed before this queued job ran.");
    return source;
  }

  async function runFilled(sourceId,note=""){
    const source=ensureSourceReady(getSource(sourceId));
    const request=requestSnapshot(source);
    const logger=(level,message)=>addLog(level,`${source.name}: ${message}`);
    patchSource(sourceId,current=>({status:"generating populated",filled:{...(current.filled||{}),status:"running"},empty:null,children:[]}));
    const filled=await callImage(
      withUserNote(filledPrompt({scaleLine:request.scaleLine,sourceName:source.name,variant:1,totalVariants:1,background}),note,"REGENERATION / USER NOTE"),
      sourceRefs(source),
      request.browserKey,
      logger
    );
    patchSource(sourceId,current=>({filled:withImageHistory(current.filled,filled,"done"),empty:null,children:[],status:"populated ready"}));
    selectPreview(sourceId,"filled");
  }

  async function runEmpty(sourceId,note=""){
    const source=ensureSourceReady(getSource(sourceId));
    if(!source.filled?.dataUrl)throw new Error("Generate the populated image before the emptied image.");
    const request=requestSnapshot(source);
    const logger=(level,message)=>addLog(level,`${source.name}: ${message}`);
    patchSource(sourceId,current=>({status:"generating emptied",empty:{...(current.empty||{}),status:"running"},children:[]}));
    const filledRef={label:`Approved populated anchor image - preserve exact shelf, camera, lighting, ${backgroundLabel(background)} cyclorama, shelf-to-wall gap, and studio identity`,dataUrl:source.filled.dataUrl};
    const empty=await callImage(
      withUserNote(emptyPrompt({scaleLine:request.scaleLine,sourceName:source.name,background}),note,"REGENERATION / USER NOTE"),
      [filledRef],
      request.browserKey,
      logger
    );
    patchSource(sourceId,current=>({empty:withImageHistory(current.empty,empty,"done"),children:[],status:"emptied ready"}));
    selectPreview(sourceId,"empty");
  }

  function enqueueFilled(source,note=""){
    patchSource(source.id,current=>({status:"queued populated",filled:current.filled?.dataUrl?{...current.filled,status:"queued"}:current.filled}));
    enqueueJob({
      label:`${source.name} / populated`,
      sourceId:source.id,
      type:"filled",
      run:()=>runFilled(source.id,note),
      onError:()=>patchSource(source.id,current=>({status:"error",filled:current.filled?.dataUrl?{...current.filled,status:"error"}:current.filled}))
    });
  }

  function enqueueEmpty(source,note=""){
    patchSource(source.id,current=>({status:"queued emptied",empty:current.empty?.dataUrl?{...current.empty,status:"queued"}:current.empty}));
    enqueueJob({
      label:`${source.name} / emptied`,
      sourceId:source.id,
      type:"empty",
      run:()=>runEmpty(source.id,note),
      onError:()=>patchSource(source.id,current=>({status:"error",empty:current.empty?.dataUrl?{...current.empty,status:"error"}:current.empty}))
    });
  }

  function enqueueRequiredSequence(source){
    enqueueFilled(source,firstGenerationNote);
    enqueueEmpty(source);
    addLog("info",`${source.name}: queued populated then emptied.`);
  }

  /**
   * Take delivery of anything the scene studio sent back.
   *
   * A returned shot arrives as a child of its row, beside the angles and the
   * detail shots, so it downloads with the row ZIP and pushes to the library
   * like every other generated image without needing a slot of its own.
   */
  /**
   * A scene session for this row that was opened and never sent back.
   *
   * Leaving the scene studio without sending is a normal thing to do -- you go
   * and look at something else. Saying so on the row, with a way straight back
   * into it, is the difference between that and losing the session.
   */
  async function refreshOpenScene(){
    try{
      const row=sourcesRef.current[0];
      setOpenScene(row?await FrameworkHandoff.openFor(row.id):null);
    }catch{setOpenScene(null)}
  }

  async function collectSceneShots(){
    try{
      const {collected,waiting}=await FrameworkHandoff.collect(
        rowId=>sourcesRef.current.some(source=>source.id===rowId));
      for(const record of collected){
        const child={
          id:makeId("gen"),
          type:"scene",
          label:record.resultLabel||"Scene shot",
          status:"done",
          dataUrl:record.result.dataUrl,
          base64:record.result.base64||dataUrlBase64(record.result.dataUrl),
          mimeType:dataUrlMime(record.result.dataUrl),
          importedAt:Date.now()
        };
        patchSource(record.rowId,current=>({children:[...(current.children||[]),child]}));
        selectPreview(record.rowId,child.type,child.id);
        addLog("success",`${record.rowTitle||"Row"}: scene shot came back from the scene studio.`);
      }
      if(waiting)addLog("info",`${waiting} scene shot(s) are waiting for a row this session does not have.`);
    }catch(error){
      addLog("error",`Could not read the scene studio handoff: ${safeMsg(error)}`);
    }finally{
      // Even if collection failed, the row still needs to know whether a session
      // is sitting open — that is the thing that explains a missing shot.
      await refreshOpenScene();
    }
  }

  function handoffScale(source,kind){
    const scale=source?.scale;
    if(!FrameworkScale.isSet(scale))return null;
    if(kind==="source photo")return scale;
    return {status:"set",shelfH:scale.shelfH,pxCm:null,expandFrame:false,fx:null,fy:null,expandedSide:null,offsetX:0};
  }

  /**
   * Every image in the row that could start a scene, in the order they were made.
   *
   * Which one is right is a judgement about the shot somebody wants, not
   * something to infer. The emptied image is usually it — a clean shelf, ready
   * to be put in a room — but the original render is the answer when the
   * generated ones have drifted from the product, and a scene shot already in
   * the row is the answer when the next one should match it. So the list is
   * shown and the choice is made.
   */
  function sceneSources(source){
    const options=[];
    if(source?.dataUrl)options.push({key:"source",kind:"source photo",label:"Source",
      hint:"The photo or render this row was built from.",image:source});
    if(source?.filled?.dataUrl)options.push({key:"filled",kind:"populated",label:"Populated",
      hint:"Styled, on the studio background.",image:source.filled});
    if(source?.empty?.dataUrl)options.push({key:"empty",kind:"emptied",label:"Emptied",
      hint:"Usually the one: a clean shelf on a plain ground.",image:source.empty});
    for(const child of source?.children||[]){
      if(child?.dataUrl)options.push({key:child.id,kind:(child.label||"generated image").toLowerCase(),
        label:child.label||"Generated",hint:"Already in this row — start from it to match it.",image:child});
    }
    return options;
  }

  /**
   * Hand this row to the scene studio and follow it there.
   *
   * The scale goes too -- the record and the photograph with the figure already
   * composited into it -- so nobody measures the same shelf twice. Leaving with
   * the queue running would kill it mid-generation, so that is refused rather
   * than silently losing an image somebody has already paid for.
   */
  async function openInSceneStudio(source,picked){
    if(!picked){addLog("error",`${source.name}: nothing to build a scene from yet.`);return}
    if(queueBusy){
      addLog("error","Finish or clear the queue before leaving for the scene studio.");
      return;
    }
    const meta=normalizedRowMeta(source);
    addLog("info",`${meta.title||source.name}: opening the scene studio with the ${picked.kind} image.`);
    try{
      await FrameworkHandoff.send({
        from:"catalog-studio",
        rowId:source.id,
        rowTitle:meta.title||source.name,
        designCode:meta.designCode||"",
        imageKind:picked.kind,
        image:{
          dataUrl:picked.image.dataUrl,
          base64:dataUrlBase64(picked.image.dataUrl),
          width:picked.image.width||source.width||0,
          height:picked.image.height||source.height||0
        },
        // Only the source photograph was measured, so only it can carry the
        // figure. Pixels-per-centimetre is measured in *that* image's pixels; a
        // generated image is a different size, and reusing the number there
        // would stand a wrongly scaled figure next to the shelf. The height
        // survives either way -- it is a fact about the shelf, not the file.
        scale:handoffScale(source,picked.kind),
        scaleImage:picked.kind==="source photo"?(source.scaleImage||null):null
      });
    }catch(error){
      addLog("error",`Could not open the scene studio: ${safeMsg(error)}`);
    }
  }

  function addPendingChild(sourceId,child){
    patchSource(sourceId,source=>({children:[...(source.children||[]),child]}));
  }

  async function runGeneratedChild(sourceId,childId,kind,options={}){
    const source=ensureSourceReady(getSource(sourceId));
    if(!source.empty?.dataUrl)throw new Error("Generate the emptied image before adding more images.");
    const request=requestSnapshot(source);
    const logger=(level,message)=>addLog(level,`${source.name}: ${message}`);
    const emptyRef={label:`CURRENT DISPLAYED APPROVED EMPTIED IMAGE - this exact visible version is the only visual source for this generation`,dataUrl:source.empty.dataUrl};
    const emptyOnlyRefs=[emptyRef];
    patchChild(sourceId,childId,current=>({...current,status:"running"}));
    let image;
    if(kind==="angle"){
      image=await callImage(withUserNote(emptyAnglePrompt({scaleLine:request.scaleLine,sourceName:source.name,background}),options.note,"USER NOTE"),emptyOnlyRefs,request.browserKey,logger);
    }else if(kind==="front"){
      image=await callImage(withUserNote(emptyFrontFacingPrompt({scaleLine:request.scaleLine,sourceName:source.name,background}),options.note,"USER NOTE"),emptyOnlyRefs,request.browserKey,logger);
    }else if(kind==="custom"){
      image=await callImage(customEmptyPrompt({scaleLine:request.scaleLine,sourceName:source.name,background,note:options.note}),emptyOnlyRefs,request.browserKey,logger);
    }else if(kind==="crop-detail"){
      image=await callImage(croppedEmptyDetailPrompt({scaleLine:request.scaleLine,sourceName:source.name,background,note:options.note}),emptyOnlyRefs,request.browserKey,logger);
    }else if(kind==="detail"){
      const detail=CATALOG_DETAILS.find(item=>item.id===options.detailId);
      if(!detail)throw new Error("Detail type is missing.");
      patchSource(sourceId,{status:`analysing ${detail.label.toLowerCase()} colours`});
      const configuration=await analyzeDetailConfiguration(emptyRef,detail,request.browserKey,logger);
      patchChild(sourceId,childId,{configuration});
      const detailRef={label:`LOCKED EDIT TARGET: selected ${detail.label} construction reference. Preserve every geometric detail; apply only the text configuration in the prompt.`,dataUrl:detail.src};
      image=await callImage(withUserNote(detailShotPrompt({scaleLine:request.scaleLine,detail,configuration}),options.note,"USER NOTE"),[detailRef],request.browserKey,logger);
    }else{
      throw new Error(`Unknown generation type: ${kind}`);
    }
    patchChild(sourceId,childId,current=>withImageHistory(current,image,"done"));
    patchSource(sourceId,{status:"ready"});
    selectPreview(sourceId,kind,childId);
  }

  function enqueueChild(source,kind,options={}){
    if(!source.empty?.dataUrl){
      addLog("error",`${source.name}: create the emptied image before adding ${kind}.`);
      return;
    }
    const detail=kind==="detail"?CATALOG_DETAILS.find(item=>item.id===options.detailId):null;
    const label=kind==="detail"?`Detail: ${detail?.label||"Unknown"}`:kind==="angle"?"Empty angle":kind==="front"?"Front-facing empty":kind==="crop-detail"?"Detail from emptied":"Custom";
    const childId=options.replaceChildId||makeId("gen");
    if(options.replaceChildId){
      patchChild(source.id,childId,current=>({...current,status:"queued"}));
    }else{
      addPendingChild(source.id,{id:childId,type:kind,label,status:"queued",detailId:options.detailId||null,note:options.note||""});
    }
    enqueueJob({
      label:`${source.name} / ${label}`,
      sourceId:source.id,
      targetId:childId,
      type:kind,
      preserveTargetOnCancel:Boolean(options.replaceChildId),
      run:()=>runGeneratedChild(source.id,childId,kind,options),
      onError:()=>patchChild(source.id,childId,{status:"error"})
    });
  }

  function retryGenerated(source,type,child=null){
    const note=window.prompt("Optional note to add to this regeneration prompt:","");
    if(note===null)return;
    if(type==="filled")enqueueFilled(source,note);
    else if(type==="empty")enqueueEmpty(source,note);
    else if(child)enqueueChild(source,child.type,{detailId:child.detailId,note,replaceChildId:child.id});
  }

  async function runRefineGenerated(sourceId,type,childId,note){
    const source=ensureSourceReady(getSource(sourceId));
    const child=childId?(source.children||[]).find(item=>item.id===childId):null;
    const current=type==="filled"?source.filled:type==="empty"?source.empty:child;
    if(!current?.dataUrl)throw new Error("Refine needs a displayed generated image first.");
    const request=requestSnapshot(source);
    const logger=(level,message)=>addLog(level,`${source.name}: ${message}`);
    const title=type==="filled"?"populated image":type==="empty"?"emptied image":child?.label||"generated image";
    const editRef={label:`CURRENT DISPLAYED IMAGE - edit this exact version only`,dataUrl:current.dataUrl};
    const sourceRef={label:"ORIGINAL SOURCE PRODUCT PHOTO - use only to verify shelf geometry and material identity",dataUrl:source.dataUrl};
    patchGeneratedImage(source,type,image=>({...image,status:"running"}),child);
    const refined=await callImage(
      refinePrompt({scaleLine:request.scaleLine,sourceName:source.name,background,title,note}),
      [editRef,sourceRef],
      request.browserKey,
      logger
    );
    if(type==="filled"){
      patchSource(sourceId,currentSource=>({filled:withImageHistory(currentSource.filled,refined,"done"),empty:null,children:[],status:"populated ready"}));
      selectPreview(sourceId,"filled");
    }else if(type==="empty"){
      patchSource(sourceId,currentSource=>({empty:withImageHistory(currentSource.empty,refined,"done"),status:"emptied ready"}));
      selectPreview(sourceId,"empty");
    }else if(child){
      patchChild(sourceId,child.id,currentChild=>withImageHistory(currentChild,refined,"done"));
      patchSource(sourceId,{status:"ready"});
      selectPreview(sourceId,child.type,child.id);
    }
  }

  function refineGenerated(source,type,child=null){
    const note=window.prompt("Specific edit to make to this displayed image:");
    if(!note?.trim())return;
    patchGeneratedImage(source,type,image=>({...image,status:"queued"}),child);
    enqueueJob({
      label:`${source.name} / refine ${type==="filled"?"populated":type==="empty"?"emptied":child?.label||"image"}`,
      sourceId:source.id,
      targetId:child?.id||null,
      type:"refine",
      imageType:type,
      preserveTargetOnCancel:Boolean(child?.id),
      run:()=>runRefineGenerated(source.id,type,child?.id||null,note.trim()),
      onError:()=>patchGeneratedImage(source,type,image=>({...image,status:"error"}),child)
    });
  }

  async function replaceGeneratedImage(source,type,file,child=null){
    if(!file)return;
    try{
      const replacement=await fileToGeneratedImage(file);
      if(type==="filled"){
        const cleared=Boolean(source.empty?.dataUrl||(source.children||[]).length);
        patchSource(source.id,current=>({filled:withImageHistory(current.filled,replacement,"manual"),empty:null,children:[],status:"populated ready"}));
        selectPreview(source.id,"filled");
        addLog("success",`${source.name}: replaced populated image${cleared?"; cleared emptied and later images so they can regenerate from it":""}.`);
      }else if(type==="empty"){
        patchSource(source.id,current=>({empty:withImageHistory(current.empty,replacement,"manual"),status:"emptied ready"}));
        selectPreview(source.id,"empty");
        addLog("success",`${source.name}: replaced emptied image. Future angle, detail, front-facing, and custom generations will use this upload.`);
      }else if(child){
        patchChild(source.id,child.id,current=>withImageHistory(current,replacement,"manual"));
        selectPreview(source.id,child.type,child.id);
        addLog("success",`${source.name}: replaced ${child.label}.`);
      }
    }catch(error){
      addLog("error",`${source.name}: replacement failed — ${safeMsg(error)}`);
    }
  }

  function addCustom(source){
    const note=window.prompt("What custom image should be generated from the emptied shelf?");
    if(!note?.trim())return;
    enqueueChild(source,"custom",{note});
  }

  function addCropDetail(source){
    const note=window.prompt("Optional note for the cropped detail from the emptied image:","");
    if(note===null)return;
    enqueueChild(source,"crop-detail",{note});
  }

  function deleteGenerated(source,type,childId=null){
    if(type==="filled")patchSource(source.id,{filled:null,empty:null,children:[],status:"ready"});
    else if(type==="empty")patchSource(source.id,{empty:null,children:[],status:"populated ready"});
    else patchSource(source.id,current=>({children:(current.children||[]).filter(child=>child.id!==childId)}));
    if(previewSelection?.sourceId===source.id&&previewSelection.type===type&&(!childId||previewSelection.childId===childId)){
      selectPreview(source.id,"source");
    }
  }

  function clearAll(){
    commitSources([]);
    setActiveSource(null);
    setPreviewSelection(null);
    scaleTool.cancel();
    jobQueueRef.current=[];
    activeJobsRef.current=new Map();
    activeSourceLocksRef.current=new Set();
    setQueueItems([]);
    setActiveJobId(null);
    setProcessStartedAt(null);
    setCompletedStats({count:0,estimatedSpend:0,elapsedMs:0});
    setLog([]);
  }

  function downloadSourceSet(source){
    const meta=normalizedRowMeta(source);
    const folder=filenameSafe(meta.id);
    const manifest=rowImageManifest(source);
    const entries=manifest.map(item=>({name:`${folder}/${item.name}`,bytes:dataUrlBytes(item.dataUrl)}));
    entries.push({name:`${folder}/${folder}.json`,bytes:textBytes(JSON.stringify(rowJsonObject(source),null,2))});
    downloadBlob(makeZip(entries),`${folder}.zip`);
  }


  function saveSession(){
    const session=sessionSnapshot();
    downloadBlob(new Blob([JSON.stringify(session,null,2)],{type:"application/json"}),`catalog-session-${new Date().toISOString().slice(0,10)}.json`);
  }

  async function loadSessionFile(event){
    const file=event.target.files?.[0];
    event.target.value="";
    if(!file)return;
    try{
      const session=JSON.parse(await file.text());
      const loadedSources=normalizeImportedSession(session);
      commitSources(loadedSources);
      setActiveSource(loadedSources[0]?.id||null);
      setPreviewSelection(loadedSources[0]?{sourceId:loadedSources[0].id,type:"source",childId:null}:null);
      setBackground({...DEFAULT_BACKGROUND,...(session.background||{})});
      setScaleCm(String(session.scaleCm||""));
      setFirstGenerationNote(String(session.firstGenerationNote||""));
      scaleTool.cancel();
      jobQueueRef.current=[];
      activeJobsRef.current=new Map();
      activeSourceLocksRef.current=new Set();
      setQueueItems([]);
      setActiveJobId(null);
      setProcessStartedAt(null);
      setCompletedStats({count:0,estimatedSpend:0,elapsedMs:0});
      setLog(Array.isArray(session.log)?session.log:[]);
      addLog("success",`Loaded session from ${file.name}`);
    }catch(error){
      addLog("error",`Session load failed: ${safeMsg(error)}`);
    }
  }

  async function loadRowZipFile(event){
    const files=[...(event.target.files||[])];
    event.target.value="";
    if(!files.length)return;
    try{
      const row=await sourceFromRowZip(files[0]);
      commitSources([row]);
      setActiveSource(row.id);
      setPreviewSelection({sourceId:row.id,type:"source",childId:null});
      addLog("success",`Loaded row ${normalizedRowMeta(row).id}`);
    }catch(error){
      addLog("error",`Row ZIP load failed: ${safeMsg(error)}`);
    }
  }

  // ─── Push to Library (DAM) ─────────────────────────────────────
  // Writes a source's whole set into the DAM with provenance: the source photo
  // goes first, then each generated image links back to it via parentHash.
  // Runs alongside (not instead of) the row-ZIP export.
  async function pushSourceToDAM(source){
    const meta=normalizedRowMeta(source);
    const items=rowImageManifest(source);
    if(!items.length)return{pushed:0};
    const mkOrigin=name=>({path:name,root:"catalog",batch:"catalog-push",tool:"catalog",ingestedAt:new Date().toISOString()});
    let parentHash=source.damHash||null,pushed=0;
    if(!parentHash){
      const src=items.find(i=>i.key==="source");
      if(src){
        const r=await window.DamClient.putAsset(src.dataUrl,{kind:"photo",configId:meta.id,variant:"source",status:"active",tool:"catalog",batch:"catalog-push",origin:mkOrigin(src.name)});
        if(r?.ok){parentHash=r.hash;pushed++;}
      }
    }
    for(const item of items){
      if(item.key==="source")continue;
      const variant=item.key.replace(/-\d+$/,"").replace(/^filled$/,"populated").replace(/^empty$/,"emptied");
      const r=await window.DamClient.putAsset(item.dataUrl,{kind:"catalog",configId:meta.id,variant,parentHash,modules:source.damModules||undefined,status:"active",tool:"catalog",batch:"catalog-push",origin:mkOrigin(item.name)});
      if(r?.ok)pushed++;
    }
    return{pushed};
  }
  async function pushAllToDAM(){
    if(!window.DamClient){addLog("error","DAM client not loaded.");return;}
    if(!(await window.DamClient.available())){addLog("error","The Library is switched off.");return;}
    addLog("info","Pushing catalog sets to Library…");
    let total=0,sets=0;
    for(const source of sourcesRef.current){
      try{const {pushed}=await pushSourceToDAM(source);if(pushed){total+=pushed;sets++;}}
      catch(error){addLog("error",`Push failed for ${normalizedRowMeta(source).id}: ${safeMsg(error)}`);}
    }
    addLog("success",`Pushed ${total} image(s) from ${sets} set(s) to Library.`);
  }

  return (
    <main className="page">
      <section className="queue-panel">
        <div className="queue-top">
          <div>
            <div className="queue-title">Generation Queue</div>
            <div className="sub">{activeJobs.length?(activeJobs.length===1?`Running ${activeJob.label}`:`Running ${activeJobs.length} jobs`):visibleQueue.length?`${visibleQueue.length} queued/running`:"Idle"}</div>
          </div>
          <div className="queue-stats">
            <span className="queue-stat">Elapsed: {processStartedAt||completedStats.count?formatMs(elapsedTime):"—"}</span>
            <span className="queue-stat">Avg session: {completedStats.count?formatMs(averageSessionMs):"—"}</span>
            <span className="queue-stat">Spend est: ${totalSpend.toFixed(3)}</span>
            <span className="queue-stat">Queued est: ${queueSpend.toFixed(3)}</span>
          </div>
        </div>
        <div className="queue-strip">
          {visibleQueue.length?visibleQueue.map(item=>(
            <div key={item.id} className={`queue-chip ${item.status}`}>
              <span className="queue-chip-label">{item.status==="running"?"Now":item.status}: {item.label}</span>
              {item.status==="pending"&&(
                <span className="queue-chip-actions">
                  <button type="button" onClick={()=>moveQueuedJob(item.id,-1)} title="Move earlier">↑</button>
                  <button type="button" onClick={()=>moveQueuedJob(item.id,1)} title="Move later">↓</button>
                  <button type="button" onClick={()=>cancelQueuedJob(item.id)} title="Remove from queue">×</button>
                </span>
              )}
            </div>
          )):<div className="queue-chip">No queued jobs</div>}
        </div>
        <details className="debug-details">
          <summary>Activity log</summary>
          <div style={{padding:"0 10px 10px"}}>
            <FrameworkStudio.ActivityLog title="" entries={log} onClear={()=>setLog([])} onCopied={()=>addLog("info","Log copied")}/>
          </div>
        </details>
      </section>

      <header className="top">
        <div>
          <div className="eyebrow">Framework Designs</div>
          <h1>Catalog Studio</h1>
        </div>
        <div className="top-actions">
          <button className="btn btn-small" onClick={saveSession} disabled={!sources.length}>Save session</button>
          <button className="btn btn-small" onClick={()=>sessionFileRef.current?.click()}>Load session</button>
          <input ref={sessionFileRef} type="file" accept="application/json,.json" style={{display:"none"}} onChange={loadSessionFile}/>
          <button className="btn btn-small" onClick={()=>rowZipFileRef.current?.click()}>Load row ZIP</button>
          <input ref={rowZipFileRef} type="file" accept=".zip,application/zip" style={{display:"none"}} onChange={loadRowZipFile}/>
          {window.DamClient?.enabled&&<button className="btn btn-small" onClick={pushAllToDAM} disabled={!sources.some(source=>source.filled?.dataUrl||source.empty?.dataUrl||(source.children||[]).some(child=>child.dataUrl))}>Push to library</button>}
          <button className="btn btn-small btn-danger" onClick={clearAll} disabled={!sources.length&&!queueItems.length}>New row</button>
        </div>
      </header>

      <div className="studio">
        <section className="upload-row">
          <aside className="panel">
            <div className="panel-title">
              <div>
                <div className="title">Product row</div>
                <div className="sub">{sources.length?(normalizedRowMeta(sources[0]).title||sources[0].name):"No image yet"}</div>
              </div>
              <button className="btn btn-small btn-soft" onClick={()=>fileRef.current?.click()}>{sources.length?"Replace":"Upload"}</button>
              {window.DamClient?.enabled&&<button className="btn btn-small btn-soft" onClick={()=>setLibraryOpen(true)}>Library</button>}
            </div>
            <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleFiles}/>
            {libraryOpen&&<LibraryPickerModal onClose={()=>setLibraryOpen(false)} onPick={loadFromLibrary}/>}
            {scenePickerFor&&(()=>{
              const row=sources.find(item=>item.id===scenePickerFor);
              if(!row)return null;
              return <ScenePickerModal
                row={row}
                options={sceneSources(row)}
                onClose={()=>setScenePickerFor(null)}
                onPick={option=>{setScenePickerFor(null);openInSceneStudio(row,option)}}/>;
            })()}
            <div
              className={`drop ${scaleTool.active?"scale-active":""} ${dragging?"dragging":""}`}
              onClick={handleSourcePreviewClick}
              onDragOver={event=>{event.preventDefault();setDragging(true)}}
              onDragLeave={()=>setDragging(false)}
              onDrop={handleDrop}
            >
              {previewSource&&activePreview?<img ref={previewRef} src={activePreview} alt={previewTitle} onMouseDown={previewType==="source"?scaleTool.imageProps.onMouseDown:undefined} style={previewType==="source"?scaleTool.imageProps.style:undefined}/>:previewSource?<div className="empty-drop">Metadata imported. Replace or upload a source image before generating.</div>:<div className="empty-drop">Drag one or more product photos here, or click Upload.</div>}
            </div>
            {previewSource&&previewType!=="source"&&(
              <PreviewActionPanel
                title={previewTitle}
                image={previewImage}
                filename={`${filenameSafe(normalizedRowMeta(previewSource).id)}-${filenameSafe(previewTitle)}.jpg`}
                onRetry={()=>retryGenerated(previewSource,previewType,previewChild)}
                onRefine={()=>refineGenerated(previewSource,previewType,previewChild)}
                onReplace={file=>replaceGeneratedImage(previewSource,previewType,file,previewChild)}
                onDelete={()=>{
                  deleteGenerated(previewSource,previewType,previewChild?.id||null);
                  selectPreview(previewSource.id,"source");
                }}
                onUndo={()=>moveImageHistory(previewSource,previewType,-1,previewChild)}
                onRedo={()=>moveImageHistory(previewSource,previewType,1,previewChild)}
              />
            )}
            {previewSource&&previewType==="source"&&(
              <FrameworkScale.Panel {...scaleTool.panelProps}/>
            )}
            <div className="form-grid">
              <div className="field">
                <label htmlFor="scale">Fallback cm</label>
                <input id="scale" className="input" inputMode="numeric" placeholder="optional" value={scaleCm} onChange={event=>setScaleCm(event.target.value.replace(/[^\d.]/g,""))}/>
              </div>
              <div className="field">
                <label htmlFor="background-color">Background</label>
                <input id="background-color" className="color-input" type="color" value={background.color} onChange={event=>setBackground(current=>({...current,color:event.target.value.toUpperCase()}))}/>
              </div>
            </div>
            <div className="sub" style={{marginTop:7}}>Background uses the committed default studio treatment; the swatch only sets the starting cyclorama color.</div>
            <div className="field" style={{marginTop:10}}>
              <label htmlFor="first-note">First generation note</label>
              <textarea id="first-note" className="textarea" placeholder="optional direction for populated anchor" value={firstGenerationNote} onChange={event=>setFirstGenerationNote(event.target.value)}/>
            </div>
            <div className="field" style={{marginTop:10}}>
              <div className="sub">On localhost this calls Gemini directly from the browser. Without a key, use Netlify dev for server functions.</div>
            </div>
          </aside>

          <section className="notice">
            Required order per source: source photo → populated catalogue image → emptied catalogue image. After the emptied image exists, use the plus menu to queue angled, front-facing, detail, or custom images. Later images use the current displayed emptied image as their visual source.
          </section>
        </section>

        <section className="rows">
          {!sources.length&&<div className="notice">Upload or drag in one shelf photo to begin a product row.</div>}
          {sources.map(source=>(
            <article className="flow-row" key={source.id}>
              <div className="flow-head">
                <div>
                  <div className="flow-title">{source.name}</div>
                  <div className="flow-status">{source.status||"ready"}</div>
                </div>
                <div className="source-tools">
                  {!source.filled?.dataUrl&&<button className="btn btn-small btn-primary" onClick={()=>enqueueRequiredSequence(source)} disabled={!source.dataUrl}>Generate populated + emptied</button>}
                  {source.filled?.dataUrl&&!source.empty?.dataUrl&&<button className="btn btn-small btn-primary" onClick={()=>enqueueEmpty(source)}>Generate emptied</button>}
                  {openScene?.rowId===source.id
                    ?<button className="btn btn-small btn-soft" onClick={()=>FrameworkHandoff.resume(openScene.id)} title="A scene session for this row is still open">Resume scene</button>
                    :<button className="btn btn-small btn-soft" onClick={()=>setScenePickerFor(source.id)}
                       disabled={!sceneSources(source).length||queueBusy}
                       title={queueBusy?"Finish or clear the queue first — leaving would kill it mid-generation":"Pick an image, build a scene from it, and send the one you like back to this row"}>Add scene</button>}
                  <button className="btn btn-small" onClick={()=>downloadSourceSet(source)} disabled={!(source.filled?.dataUrl||source.empty?.dataUrl||(source.children||[]).some(child=>child.dataUrl))}>Download row</button>
                </div>
              </div>
              <div className="flow-lane">
                <FlowSourceCard source={source} onView={()=>selectPreview(source.id,"source")} onScale={()=>beginScale(source)} onSkipScale={()=>skipScale(source)} onDelete={()=>deleteSource(source.id)}/>
                <GeneratedFlowCard
                  title="Populated"
                  subtitle="required first generated image"
                  image={source.filled}
                  filename={`${filenameSafe(normalizedRowMeta(source).id)}-01-populated.jpg`}
                  placeholder="Queue populated"
                  onGenerate={()=>enqueueFilled(source,firstGenerationNote)}
                  disableGenerate={!source.dataUrl}
                  onRetry={()=>retryGenerated(source,"filled")}
                  onRefine={()=>refineGenerated(source,"filled")}
                  onReplace={file=>replaceGeneratedImage(source,"filled",file)}
                  onDelete={()=>deleteGenerated(source,"filled")}
                  onUndo={()=>moveImageHistory(source,"filled",-1)}
                  onRedo={()=>moveImageHistory(source,"filled",1)}
                  onView={()=>selectPreview(source.id,"filled")}
                />
                <GeneratedFlowCard
                  title="Emptied"
                  subtitle="source for all later images"
                  image={source.empty}
                  filename={`${filenameSafe(normalizedRowMeta(source).id)}-02-emptied.jpg`}
                  placeholder={source.filled?.dataUrl?"Queue emptied":"After populated"}
                  onGenerate={()=>source.filled?.dataUrl?enqueueEmpty(source):enqueueRequiredSequence(source)}
                  onRetry={()=>retryGenerated(source,"empty")}
                  onRefine={()=>refineGenerated(source,"empty")}
                  onReplace={file=>replaceGeneratedImage(source,"empty",file)}
                  onDelete={()=>deleteGenerated(source,"empty")}
                  onUndo={()=>moveImageHistory(source,"empty",-1)}
                  onRedo={()=>moveImageHistory(source,"empty",1)}
                  onView={()=>selectPreview(source.id,"empty")}
                />
                {source.empty?.dataUrl&&(
                  <AddMenuFlowCard
                    onAngle={()=>enqueueChild(source,"angle")}
                    onFront={()=>enqueueChild(source,"front")}
                    onCropDetail={()=>addCropDetail(source)}
                    onCustom={()=>addCustom(source)}
                    onDetail={detailId=>enqueueChild(source,"detail",{detailId})}
                  />
                )}
                {(source.children||[]).map((child,index)=>(
                  <GeneratedFlowCard
                    key={child.id}
                    title={child.label}
                    subtitle={child.status==="queued"?"queued":child.status==="running"?"running":child.status==="error"?"error":`generated ${index+1}`}
                    image={child}
                    filename={`${filenameSafe(normalizedRowMeta(source).id)}-${String(index+3).padStart(2,"0")}-${filenameSafe(child.label)}.jpg`}
                    placeholder={child.status||"Waiting"}
                    onRetry={()=>child.type==="scene"?setScenePickerFor(source.id):retryGenerated(source,child.type,child)}
                    onRefine={()=>refineGenerated(source,child.type,child)}
                    onReplace={file=>replaceGeneratedImage(source,child.type,file,child)}
                    onDelete={()=>deleteGenerated(source,child.type,child.id)}
                    onUndo={()=>moveImageHistory(source,child.type,-1,child)}
                    onRedo={()=>moveImageHistory(source,child.type,1,child)}
                    onView={()=>selectPreview(source.id,child.type,child.id)}
                  />
                ))}
                <RowMetaCard source={source} onChange={updateSourceMeta} onAutoMeta={()=>autoGenerateRowMeta(source)}/>
              </div>
            </article>
          ))}
        </section>
      </div>
    </main>
  );
}



function PreviewActionPanel({title,image,filename,onRetry,onRefine,onReplace,onDelete,onUndo,onRedo}){
  const replaceRef=useRef(null);
  const ready=Boolean(image?.dataUrl);
  const status=image?.status;
  const historyIndex=image?.historyIndex??(Array.isArray(image?.history)?image.history.length-1:0);
  const hasHistory=Array.isArray(image?.history)&&image.history.length>1;
  const busy=status==="running"||status==="queued";
  async function handleReplace(event){
    const file=event.target.files?.[0];
    event.target.value="";
    if(file&&onReplace)await onReplace(file);
  }
  return (
    <div className="preview-actions">
      <div className="preview-actions-top">
        <div>
          <div className="title">{title}</div>
          <div className="sub">{status==="running"?"running":status==="queued"?"queued":status==="manual"?"manually replaced":"selected image"}</div>
        </div>
        <button className="btn btn-small" onClick={()=>downloadDataUrl(image.dataUrl,filename)} disabled={!ready}>Save</button>
      </div>
      <div className="preview-actions-buttons">
        <button className="btn btn-small" onClick={onUndo} disabled={!hasHistory||historyIndex<=0}>Undo</button>
        <button className="btn btn-small" onClick={onRedo} disabled={!hasHistory||historyIndex>=image.history.length-1}>Redo</button>
        {hasHistory&&<span className="card-sub">{historyIndex+1} / {image.history.length}</span>}
      </div>
      <div className="preview-actions-buttons">
        <button className="btn btn-small btn-soft" onClick={onRetry} disabled={!ready||busy}>{status==="running"?"Running":status==="queued"?"Queued":"Retry + note"}</button>
        <button className="btn btn-small btn-soft" onClick={onRefine} disabled={!ready||busy}>Refine</button>
        <button className="btn btn-small" onClick={()=>replaceRef.current?.click()}>Replace</button>
        <input ref={replaceRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleReplace}/>
        <button className="btn btn-small btn-danger" onClick={onDelete}>Delete</button>
      </div>
    </div>
  );
}

/**
 * Which image should the scene be built from?
 *
 * One screen, every image the row has, each with the thing it is good for.
 * Choosing is one click and it leaves for the scene studio immediately -- the
 * whole point of the flow is that there is nothing to name, download or upload,
 * so there is no reason to make somebody confirm a choice they just made.
 */
function ScenePickerModal({row,options,onClose,onPick}){
  useEffect(()=>{
    const onKey=event=>{if(event.key==="Escape")onClose()};
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[onClose]);
  const title=normalizedRowMeta(row).title||row.name;
  return (
    <div className="lib-overlay" onClick={onClose}>
      <div className="lib-modal" style={{width:"min(720px,100%)"}} onClick={event=>event.stopPropagation()}>
        <div className="lib-head">
          <div>
            <div className="title">Add a scene to {title}</div>
            <div className="sub">Pick the image the room should be built around. The shot you choose in the scene studio comes back to this row.</div>
          </div>
          <button className="lib-close" onClick={onClose}>×</button>
        </div>
        <div className="lib-body">
          <div className="lib-grid">
            {options.map(option=>(
              <button key={option.key} type="button" className="lib-item" onClick={()=>onPick(option)}>
                <div className="lib-thumb"><img src={option.image.dataUrl} alt={option.label}/></div>
                <div className="lib-label">
                  <div className="name">{option.label}</div>
                  <div className={`kind ${option.hint?"note":""}`}>{option.hint||option.kind}</div>
                </div>
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function LibraryPickerModal({onClose,onPick}){
  const [status,setStatus]=useState("loading");
  const [records,setRecords]=useState([]);
  const [kindFilter,setKindFilter]=useState("all");
  const [query,setQuery]=useState("");
  const [pickingHash,setPickingHash]=useState(null);
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      if(!window.DamClient){if(!cancelled)setStatus("unavailable");return;}
      if(!(await window.DamClient.available())){if(!cancelled)setStatus("unavailable");return;}
      try{
        const [renders,photos]=await Promise.all([
          window.DamClient.listAssets({kind:"render"}),
          window.DamClient.listAssets({kind:"photo"})
        ]);
        if(cancelled)return;
        const merged=[...(renders||[]),...(photos||[])].sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
        setRecords(merged);
        setStatus("ready");
      }catch{
        if(!cancelled)setStatus("unavailable");
      }
    })();
    return ()=>{cancelled=true};
  },[]);
  const filtered=records.filter(record=>{
    if(kindFilter!=="all"&&record.kind!==kindFilter)return false;
    const needle=query.trim().toLowerCase();
    if(!needle)return true;
    const haystack=`${record.configId||""} ${record.origins?.[0]?.path||""}`.toLowerCase();
    return haystack.includes(needle);
  });
  async function handlePick(record){
    setPickingHash(record.hash);
    try{await onPick(record);}
    finally{setPickingHash(null);}
  }
  return (
    <div className="lib-overlay" onClick={onClose}>
      <div className="lib-modal" onClick={event=>event.stopPropagation()}>
        <div className="lib-head">
          <div className="title">From library</div>
          <button className="lib-close" onClick={onClose}>×</button>
        </div>
        <div className="lib-filters">
          <div className="lib-kinds">
            <button className={`btn btn-small ${kindFilter==="all"?"btn-soft":""}`} onClick={()=>setKindFilter("all")}>All</button>
            <button className={`btn btn-small ${kindFilter==="render"?"btn-soft":""}`} onClick={()=>setKindFilter("render")}>Renders</button>
            <button className={`btn btn-small ${kindFilter==="photo"?"btn-soft":""}`} onClick={()=>setKindFilter("photo")}>Photos</button>
          </div>
          <input className="input lib-search" placeholder="Filter by config id or path…" value={query} onChange={event=>setQuery(event.target.value)}/>
        </div>
        <div className="lib-body">
          {status==="loading"&&<div className="lib-empty">Loading library…</div>}
          {status==="unavailable"&&<div className="lib-empty">The Library is switched off. Open a source image from your computer instead.</div>}
          {status==="ready"&&!filtered.length&&<div className="lib-empty">No assets match this filter.</div>}
          {status==="ready"&&Boolean(filtered.length)&&(
            <div className="lib-grid">
              {filtered.map(record=>(
                <button key={record.hash} type="button" className="lib-item" disabled={pickingHash===record.hash} onClick={()=>handlePick(record)}>
                  <div className="lib-thumb"><img src={window.DamClient.thumbUrl(record.hash)} alt={record.configId||record.hash}/></div>
                  <div className="lib-label">
                    <div className="name">{record.configId||record.origins?.[0]?.path||record.hash.slice(0,10)}</div>
                    <div className="kind">{pickingHash===record.hash?"Loading…":record.kind}</div>
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function FlowSourceCard({source,onView,onScale,onSkipScale,onDelete}){
  return (
    <div className="flow-card source-card">
      <div className="card-title">
        <div>
          <span>Source</span>
          <div className="card-sub">{source.width} x {source.height}</div>
        </div>
      </div>
      <div className={`thumb ${source.dataUrl?"clickable":""}`} onClick={source.dataUrl?onView:undefined}>
        {source.dataUrl?<img src={source.dataUrl} alt="Source"/>:<div className="placeholder">Metadata only</div>}
      </div>
      <div className="card-actions">
        <button className="btn btn-small" onClick={onView}>View</button>
        <button className="btn btn-small btn-soft" onClick={onScale}>Set scale</button>
        <button className="btn btn-small" onClick={onSkipScale}>Skip scale</button>
        <button className="btn btn-small btn-danger" onClick={onDelete}>Delete</button>
      </div>
    </div>
  );
}

function GeneratedFlowCard({title,subtitle,image,filename,placeholder,onGenerate,disableGenerate,onRetry,onRefine,onReplace,onDelete,onUndo,onRedo,onView}){
  const replaceRef=useRef(null);
  const ready=Boolean(image?.dataUrl);
  const status=image?.status;
  const statusText=status==="running"?"running":status==="queued"?"queued":status==="manual"?"manually replaced":subtitle;
  const historyIndex=image?.historyIndex??(Array.isArray(image?.history)?image.history.length-1:0);
  const hasHistory=Array.isArray(image?.history)&&image.history.length>1;
  const busy=status==="running"||status==="queued";
  async function handleReplace(event){
    const file=event.target.files?.[0];
    event.target.value="";
    if(file&&onReplace)await onReplace(file);
  }
  return (
    <div className="flow-card">
      <div className="card-title">
        <div>
          <span>{title}</span>
          <div className="card-sub">{statusText}</div>
        </div>
        <button className="btn btn-small" onClick={()=>downloadDataUrl(image.dataUrl,filename)} disabled={!ready}>Save</button>
      </div>
      <div className={`thumb ${ready?"clickable":""}`} onClick={ready&&onView?onView:undefined}>
        {ready?<img src={image.dataUrl} alt={title}/>:<div className="placeholder">{status==="running"?"Running":status==="queued"?"Queued":placeholder}</div>}
      </div>
      <div className="history-row">
        <button className="btn btn-small" onClick={onUndo} disabled={!hasHistory||historyIndex<=0}>Undo</button>
        <button className="btn btn-small" onClick={onRedo} disabled={!hasHistory||historyIndex>=image.history.length-1}>Redo</button>
        {hasHistory&&<span className="card-sub">{historyIndex+1} / {image.history.length}</span>}
      </div>
      <div className="card-actions">
        {!ready&&onGenerate&&<button className="btn btn-small btn-primary" onClick={onGenerate} disabled={disableGenerate}>Generate</button>}
        {ready&&<button className="btn btn-small btn-soft" onClick={onRetry} disabled={busy}>{status==="running"?"Running":status==="queued"?"Queued":"Retry + note"}</button>}
        {ready&&onRefine&&<button className="btn btn-small btn-soft" onClick={onRefine} disabled={busy}>Refine</button>}
        {onReplace&&<>
          <button className="btn btn-small" onClick={()=>replaceRef.current?.click()}>Replace</button>
          <input ref={replaceRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleReplace}/>
        </>}
        <button className="btn btn-small btn-danger" onClick={onDelete}>Delete</button>
      </div>
    </div>
  );
}

function RowMetaCard({source,onChange,onAutoMeta}){
  // Filling from the design code is a network call, so it gets a busy state and
  // says what it did -- silently changing three fields would be worse than not
  // changing them.
  const [codeBusy,setCodeBusy]=React.useState(false);
  const [codeNote,setCodeNote]=React.useState(null);
  const onFillFromCode=async()=>{
    const code=(source?.meta?.designCode||"").toUpperCase();
    setCodeBusy(true);setCodeNote(null);
    try{
      const facts=await factsFromDesignCode(code);
      if(!facts){setCodeNote({ok:false,text:`No design called ${code}. Check the seven characters on the share image.`});return;}
      const filled=[];
      if(facts.priceValue){onChange(source.id,"priceValue",String(facts.priceValue));filled.push("price");}
      onChange(source.id,"designerUrl",facts.designerUrl);filled.push("designer link");
      if(facts.sizeCm){
        onChange(source.id,"sizeCm",facts.sizeCm);
        filled.push(`size ${facts.sizeCm.w}×${facts.sizeCm.d}×${facts.sizeCm.h} cm`);
      }
      setCodeNote({ok:true,text:`From design ${code}: ${filled.join(", ")}.`});
    }catch(error){
      setCodeNote({ok:false,text:safeMsg(error)});
    }finally{setCodeBusy(false);}
  };

  const meta=normalizedRowMeta(source);
  const manifest=rowImageManifest(source);
  const pricePreview=formatKshPrice(meta.priceValue,meta.price);
  return (
    <div className="flow-card meta-card">
      <div className="title">Row export</div>
      <div className="sub">{source.metaStatus||"Product JSON and file names are generated from the file ID."}</div>
      <div className="meta-grid">
        <div className="field">
          <label>File ID</label>
          <input className="input" value={meta.id} onChange={event=>onChange(source.id,"id",filenameInputSafe(event.target.value))}/>
        </div>
        <div className="field">
          <label>Title</label>
          <input className="input" value={meta.title} onChange={event=>onChange(source.id,"title",event.target.value)}/>
        </div>
        <div className="field">
          <label>Price (Ksh)</label>
          <input className="input" inputMode="numeric" value={meta.priceValue} onChange={event=>onChange(source.id,"priceValue",event.target.value.replace(/[^\d.]/g,""))}/>
        </div>
        <div className="field">
          <label>Export price</label>
          <input className="input" value={pricePreview} readOnly/>
        </div>
        <div className="field">
          <label>Size (from the design)</label>
          <input className="input" readOnly
            value={meta.sizeCm?`${meta.sizeCm.w} × ${meta.sizeCm.d} × ${meta.sizeCm.h} cm`:""}
            placeholder="Fill from the design code"/>
        </div>
        <div className="field">
          <label>Design code</label>
          <div style={{display:"flex",gap:6}}>
            <input className="input" placeholder="1Y3MK7P" maxLength={7}
              style={{textTransform:"uppercase",letterSpacing:".08em"}}
              value={meta.designCode||""}
              onChange={event=>onChange(source.id,"designCode",event.target.value.toUpperCase().replace(/[^0-9A-Z]/g,"").slice(0,7))}/>
            <button className="btn btn-small btn-soft" style={{whiteSpace:"nowrap"}}
              disabled={!/^[0-9A-Z]{7}$/.test(meta.designCode||"")||codeBusy}
              title="Fill the price, size and designer link from the design this code names"
              onClick={onFillFromCode}>{codeBusy?"…":"Fill"}</button>
          </div>
          {codeNote&&<div style={{fontSize:11,color:codeNote.ok?"#7fd1a0":"#e0a94a",marginTop:4}}>{codeNote.text}</div>}
        </div>
        <div className="field full">
          <label>Description</label>
          <textarea className="textarea" value={meta.description} onChange={event=>onChange(source.id,"description",event.target.value)}/>
        </div>
        <div className="field full">
          <label>Designer URL</label>
          <input className="input" value={meta.designerUrl} onChange={event=>onChange(source.id,"designerUrl",event.target.value)}/>
        </div>
        <div className="field full">
          <label>Gemini row note</label>
          <textarea className="textarea" placeholder="optional naming/copy direction" value={meta.aiNote||""} onChange={event=>onChange(source.id,"aiNote",event.target.value)}/>
        </div>
      </div>
      <div className="card-actions" style={{padding:"8px 0 0",borderTop:0,minHeight:0}}>
        <button className="btn btn-small btn-soft" onClick={onAutoMeta} disabled={!source.filled?.dataUrl||source.metaStatus==="generating row copy"}>Auto-fill from populated</button>
      </div>
      <div className="meta-filenames">
        {manifest.map(item=><div className="meta-file" key={item.key}>{item.name}{item.json?"":" (reference only)"}</div>)}
        <div className="meta-file">{filenameSafe(meta.id)}.json</div>
      </div>
    </div>
  );
}

  return (

      <div className="add-inner">
        <div>
          <div className="title">+ Add from emptied</div>
          <div className="sub">Uses the current displayed emptied image only.</div>
        </div>
        <div className="menu-grid">
          <button className="btn btn-small btn-primary" onClick={onAngle}>Angled</button>

            <button className="btn btn-small" onClick={()=>onDetail(detail.id)} key={detail.id}>{detail.shortLabel}</button>
          ))}
          <button className="btn btn-small btn-soft" onClick={onCustom}>Custom…</button>
        </div>
      </div>
    </div>
  );
}
