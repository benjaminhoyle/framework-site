<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Framework — Funnel Monitor</title>
  <link rel="stylesheet" href="/css/gate.css">
  <script src="/js/gate.js"></script>
  <style>
    :root {
      --bg:#0f1115; --card:#171a21; --line:#262b36; --line-soft:#1e222b;
      --ink:#e6e9ef; --dim:#9aa4b2; --muted:#6b7480;
      /* Status palette — fixed, never reused for series identity. */
      --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
      /* Ordinal funnel ramp (one hue, light→dark) — validated on this surface. */
      /* Funnel ramp, one hue, stepped for THIS surface rather than flipped from a
         light one. It runs dark→light as depth increases: on a dark card the
         light end is the loud end, and the deepest stage — the WhatsApp handoff —
         is a two-pixel sliver that has to survive being the most important mark
         on the row. Arrivals are the largest area and can afford to recede.
         Validated ordinal: monotone L, adjacent ΔL >= .06, single hue, and
         adjacent CVD separation ΔE 13.8 protan / 15.2 normal. */
      --f1:#2b5c8f; --f2:#3987e5; --f3:#86b6ef; --f4:#cde2fb;
      --o1:#9ec5f4; --o2:#3987e5; --o3:#184f95;
      /* Categorical series (trend chart) — validated pair. */
      --s1:#3987e5; --s2:#199e70;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
      font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    a { color:inherit; }

    header { padding:18px 28px; border-bottom:1px solid var(--line); display:flex;
      align-items:baseline; gap:16px; flex-wrap:wrap; }
    h1 { margin:0; font-size:17px; letter-spacing:-.01em; }
    .nav { font-size:13px; color:var(--dim); text-decoration:none; }
    .nav:hover { color:var(--ink); }
    .freshness { margin-left:auto; font-size:12.5px; }

    main { padding:24px 28px 72px; max-width:1280px; margin:0 auto; }
    section { margin-bottom:34px; }
    .sec-head { display:flex; align-items:baseline; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
    h2 { font-size:14px; margin:0; letter-spacing:.01em; }
    .sec-note { font-size:12.5px; color:var(--muted); }
    .sec-head .right { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    /* Three control groups plus a search box overflow a phone; let them stack
       rather than push the page into a horizontal scroll. The table keeps its own
       scroll container — the body never scrolls sideways. */
    @media (max-width:760px) {
      .sec-head .right { width:100%; margin-left:0; }
      .sec-head .right input[type=search] { flex:1 1 100%; }
      .seg { flex:0 1 auto; }
    }

    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; }
    .pad { padding:18px 20px; }

    /* The verdict banner ("Live — working / not working") used to sit here, above
       the alerts. Removed 2026-08-07: its headline was driven by `live.sales30`,
       which counts only sales on conversations carrying a Meta Ad ID — so it read
       "not working" through a week that produced three sales, because those sales
       arrived through the site bridge and organic reach rather than through an
       ad we could join on. It was measuring attribution coverage and printing it
       as a business verdict. The day-by-day rows below say the same thing without
       having to be right about attribution first. */

    /* Alerts */
    .alert { border-radius:10px; padding:13px 16px; margin-bottom:12px; border:1px solid;
      display:flex; gap:11px; align-items:flex-start; font-size:13.5px; }
    .alert .ic { flex:0 0 auto; font-size:14px; line-height:1.35; }
    .alert b { display:block; margin-bottom:2px; }
    .alert.critical { border-color:var(--critical); background:rgba(208,59,59,.10); }
    .alert.warn { border-color:var(--warning); background:rgba(250,178,25,.09); }
    .alert.info { border-color:var(--line); background:var(--card); }

    /* Flags that are real checks but have a standing explanation — the unread
       streak fires because the inbox is cleared by hand before a run, so a zero
       is the intended state rather than a broken selector. Demoted to a corner
       mark (full text on hover) instead of silenced: a check nobody can see is a
       check nobody notices breaking, and the streak would still mean something
       if the habit ever changed. */
    .minor { font-size:11px; color:var(--muted); display:flex; gap:8px; align-items:baseline; }
    .minor span { border:1px solid var(--line); border-radius:999px; padding:2px 8px;
      cursor:help; white-space:nowrap; }

    /* Controls */
    .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    .seg button { background:transparent; border:0; color:var(--dim); padding:6px 12px;
      font-size:12.5px; cursor:pointer; font-family:inherit; }
    .seg button + button { border-left:1px solid var(--line); }
    .seg button.on { background:#212734; color:var(--ink); }
    input[type=search], select { background:var(--bg); color:var(--ink); border:1px solid var(--line);
      border-radius:8px; padding:6px 10px; font-size:12.5px; font-family:inherit; }
    input[type=search]::placeholder { color:var(--muted); }

    /* Table */
    .tablewrap { overflow-x:auto; }
    table { border-collapse:collapse; width:100%; font-size:13px; }
    th, td { text-align:right; padding:9px 12px; white-space:nowrap; }
    th:first-child, td:first-child { text-align:left; position:sticky; left:0; background:var(--card); }
    thead th { color:var(--muted); font-weight:500; font-size:11.5px; text-transform:uppercase;
      letter-spacing:.04em; cursor:pointer; user-select:none; border-bottom:1px solid var(--line); }
    thead th:hover { color:var(--ink); }
    thead th .arrow { opacity:.45; font-size:9px; }
    tbody tr { border-bottom:1px solid var(--line-soft); }
    tbody tr:hover td { background:#1c212b; }
    tbody tr:hover td:first-child { background:#1c212b; }
    td.num { font-variant-numeric:tabular-nums; }
    .adname { font-weight:500; }
    .adsub { font-size:11.5px; color:var(--muted); margin-top:1px; }
    .lead { color:var(--ink); font-weight:600; }
    .zero { color:var(--muted); }
    /* Ad / campaign / ad set names are long; keep the row scannable and put the
       full text in the title attribute rather than wrapping the table out of shape. */
    td.text { text-align:left; color:var(--dim); max-width:150px; overflow:hidden;
      text-overflow:ellipsis; font-size:12.5px; }
    th.text { text-align:left; }
    /* Truncate the NAME, never the status pill or the ad count — those are the
       parts that change what the row means. */
    td:first-child { max-width:240px; }
    td:first-child .adname { display:flex; align-items:center; gap:7px; }
    td:first-child .adname .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
    td:first-child .adname .pill, td:first-child .adname .gcount { flex:0 0 auto; }
    tbody tr.grouprow td:first-child { font-weight:600; }
    .gcount { color:var(--muted); font-weight:400; font-size:11.5px; }

    .pill { display:inline-block; padding:1.5px 8px; border-radius:20px; font-size:11px;
      border:1px solid var(--line); color:var(--dim); }
    .pill.ACTIVE { color:var(--good); border-color:rgba(12,163,12,.45); }

    /* nowrap: chips stacking inside a narrow column gave rows three different
       heights, which reads as a broken table rather than as information. */
    .chips { display:flex; gap:4px; flex-wrap:nowrap; justify-content:flex-end; }
    .chip { font-size:10.5px; padding:1.5px 7px; border-radius:5px; border:1px solid; white-space:nowrap; }
    .chip.warning { color:var(--warning); border-color:rgba(250,178,25,.4); }
    .chip.serious { color:var(--serious); border-color:rgba(236,131,90,.4); }
    .chip.info { color:var(--dim); border-color:var(--line); }
    .chip.ok { color:var(--good); border-color:rgba(12,163,12,.35); }
    .chip.more { color:var(--muted); border-color:var(--line); }
    .chips[title] { cursor:help; }

    /* Funnel */
    .funnels { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media (max-width:860px) { .funnels { grid-template-columns:1fr; } }
    .fn-title { font-size:12.5px; color:var(--ink); margin-bottom:2px; }
    .fn-sub { font-size:11.5px; color:var(--muted); margin-bottom:14px; }
    .stage { margin-bottom:11px; }
    .stage .row1 { display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; margin-bottom:4px; }
    .stage .nm { color:var(--dim); }
    .stage .val { font-variant-numeric:tabular-nums; }
    .stage .val b { font-size:14px; }
    .stage .pct { color:var(--muted); font-size:11.5px; margin-left:6px; }
    .bar { height:9px; border-radius:4px; background:#0d1017; overflow:hidden; }
    .bar span { display:block; height:100%; border-radius:4px; }

    /* Day-by-day monitor.
       Placement hues are categorical slots 1 + 6 (blue/orange) — a pair validated
       for CVD separation (ΔE 26.8 protan). Audience Network deliberately wears
       --warning instead of a categorical hue: for this account it is not another
       platform, it is a fault state, and it ships with a ⚠ in the legend so the
       colour never carries the meaning alone. */
    :root { --p-ig:#3987e5; --p-fb:#d95926; --p-other:#4a5261; }
    /* Message volume gets its own two hues rather than borrowing the funnel
       ramp: a row about who is doing the talking is not a funnel stage. Violet
       is unused elsewhere, so the client's half of an exchange can never be
       confused with a placement, a funnel depth or a chat source; slate reads as
       our own effort without competing for attention. */
    :root { --m-in:#8b5cf6; --m-out:#9aa4b2; }
    #dailysvg .rl { fill:var(--ink); font-size:12px; }
    #dailysvg .rmax { fill:var(--muted); font-size:10.5px; font-variant-numeric:tabular-nums; }
    #dailysvg .lg { fill:var(--dim); font-size:10.5px; }
    /* Headers sit above the hit targets in paint order; without this their
       glyphs would punch dead spots into the hover strip. */
    #dailysvg .hdr { pointer-events:none; }
    /* On a phone the viewBox would scale three bands down to ~90px tall and the
       labels to a few pixels. Hold a legible floor and let the chart scroll
       inside its own box — the page body still never scrolls sideways. */
    .chartwrap { overflow-x:auto; }
    .chartwrap svg { display:block; min-width:720px; }
    .daily-note { font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.6; }
    svg .rhit:hover { fill:rgba(255,255,255,.04); }
    /* The hovered segment brightens; everything else in that bar dims, so the
       cell being described is unmistakable without adding a stroke (ink that
       isn't data). */
    /* `fill-opacity` as well as `opacity`: it is the SVG-native property and is
       the one guaranteed to apply to a <path>, so the dim state never depends on
       filter support. Brightening the hovered cell is the secondary cue. */
    .sg { transition:fill-opacity .08s ease, filter .08s ease; }
    .sg.on { filter:brightness(1.45); }
    .sg.off { fill-opacity:.3; opacity:.3; }
    svg .colsep { stroke:var(--line-soft); stroke-width:1; }

    /* Trend chart */
    .legend { display:flex; gap:16px; font-size:12px; color:var(--dim); margin-bottom:10px; }
    .legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
    svg text { fill:var(--muted); font-size:10.5px; font-variant-numeric:tabular-nums; }
    .tip { position:fixed; pointer-events:none; background:#0b0d12; border:1px solid var(--line);
      border-radius:8px; padding:8px 11px; font-size:12px; z-index:50; opacity:0;
      transition:opacity .09s; box-shadow:0 6px 22px rgba(0,0,0,.5); }
    .tip .t { color:var(--muted); font-size:11px; margin-bottom:3px; }
    .tip .r { display:flex; gap:14px; justify-content:space-between; margin-top:3px; }
    .tip .r small { font-size:10.5px; }
    .tip .sub { color:var(--muted); font-size:10.5px; margin:1px 0 4px; max-width:270px; }
    .tip .r span:last-child { font-variant-numeric:tabular-nums; }
    /* The hovered order's own value. In a tooltip the number leads and the label
       follows — the reader already knows which mark they are pointing at. */
    .tip .lead { font-size:19px; font-variant-numeric:tabular-nums; margin:2px 0 1px; }
    /* The hovered cell lifts rather than gaining a border: a stroke would add
       data-weight ink around a mark whose whole job is to be one flat quantity. */
    .ocell { transition:filter .08s ease; }
    .ocell.on { filter:brightness(1.45); }

    details { border-top:1px solid var(--line); padding-top:14px; margin-top:8px; }
    details summary { cursor:pointer; font-size:13px; color:var(--dim); list-style:none; }
    details summary::-webkit-details-marker { display:none; }
    details summary:before { content:"▸ "; color:var(--muted); }
    details[open] summary:before { content:"▾ "; }
    details .inner { padding:14px 2px 4px; line-height:1.75; max-width:820px; }
    code, .mono { font-family:ui-monospace,Menlo,monospace; }
    .copyrow { display:flex; gap:8px; margin-top:6px; }
    .copyrow textarea { flex:1; min-width:0; background:var(--bg); color:var(--ink);
      border:1px solid var(--line); border-radius:7px; padding:8px; font-family:ui-monospace,Menlo,monospace;
      font-size:11.5px; resize:none; }
    .btn { background:var(--card); color:var(--ink); border:1px solid var(--line);
      border-radius:7px; padding:6px 13px; cursor:pointer; font-size:12.5px; font-family:inherit; }
    .btn:hover { border-color:var(--dim); }
    .msg { padding:70px 24px; text-align:center; color:var(--dim); }
    .msg code { background:var(--card); padding:2px 6px; border-radius:5px; color:var(--ink); }
    .empty { color:var(--muted); font-size:12.5px; padding:16px 2px; }
  </style>
</head>
<body>
  <header>
    <h1>Framework — Funnel Monitor</h1>
    <a class="nav" id="navCatalog" href="#">→ Catalog Manager</a>
    <div class="freshness" id="fresh"></div>
    <div class="minor" id="minor"></div>
  </header>
  <main id="main"><div class="msg">Loading…</div></main>
  <div class="tip" id="tip"></div>

  <script>
  (function () {
    // The key comes from the shared gate, not the URL. See js/gate.js.
    var esc = function (s) { return String(s==null?'':s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
    var kes = function (n) { return 'KSh ' + Math.round(Number(n)||0).toLocaleString('en-US'); };
    var num = function (n) { return (Number(n)||0).toLocaleString('en-US'); };
    var show = function (h) { document.getElementById('main').innerHTML = h; };
    var D = null, view = { filter:'spending', group:'ad', win:'30d', sort:'spend30', dir:-1, q:'', month:null, trendTable:false, grain:'day', spendCut:'placement' };

    document.getElementById('navCatalog').href = '/catalog.html';

    // Nothing is fetched until the gate has a key the server accepts.
    FrameworkGate.ready()
      .then(function () { return FrameworkGate.fetch('/api/dashboard'); })
      .then(function (r) {
        if (r.status === 401) throw new Error('Unauthorized — check your key.');
        if (r.status === 404) throw new Error('No data yet. Run the sync (double-click sync.command) to publish the first snapshot.');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) { D = d; boot(); })
      .catch(function (e) { show('<div class="msg">' + esc(e.message) + '</div>'); });

    // ---- flag presentation: short label + severity, never colour alone ----
    // Severity ranks by "is this costing me money right now", because only one
    // flag per row is shown and it should be the one that decides what you do.
    // serious = money leaving with nothing coming back; warning = plumbing that
    // will cost you later; info = worth fixing, not urgent.
    var FLAGS = {
      delivery_stalled:        { s:'serious', t:'not delivering', d:'Reads ACTIVE but spent nothing in 3 days — check the account spend cap or schedule.' },
      spend_no_conversations:  { s:'serious', t:'no conversations', d:'Spend > 0 in 30d with zero conversations started.' },
      audience_network_on:     { s:'serious', t:'audience network', d:'Audience Network is taking spend right now (last 7 days) — off-platform junk inventory. Historic Audience Network spend inside the 30-day window no longer raises this; only live delivery does.' },
      missing_url_tags:        { s:'warning', t:'no url_tags', d:'No url_tags, so conversations cannot be traced back to this ad.' },
      no_catalog_anchor:       { s:'warning', t:'stale product', d:'Deep-links to a product no longer in the live catalog.' },
      frequency_fatigue:       { s:'warning', t:'fatigue', d:'Frequency above 3.5 — the same people keep seeing it.' },
      destination_not_deeplink:{ s:'info',    t:'no deep-link', d:'Lands on the bare catalog instead of a specific product.' }
    };

    function boot() {
      var months = (D.cohorts||[]).map(function (c) { return c.month; });
      var withSite = (D.cohorts||[]).filter(function (c) { return c.arrive > 0; });
      view.month = withSite.length ? withSite[withSite.length-1].month : (months[months.length-1] || null);
      render();
    }

    function render() {
      var gen = new Date(D.generatedAt);
      var days = Math.floor((Date.now() - gen.getTime()) / 86400000);
      var lbl = days <= 0 ? 'Synced today' : days === 1 ? 'Synced yesterday' : 'Synced ' + days + ' days ago';
      var col = days <= 2 ? 'var(--good)' : days <= 7 ? 'var(--warning)' : 'var(--critical)';
      document.getElementById('fresh').innerHTML =
        '<span style="color:' + col + '">● ' + lbl + '</span>' +
        '<span style="color:var(--muted)"> · ' + gen.toLocaleString() + '</span>';

      var h = alerts() + dailyChart() + adTable() + audienceTable() + funnels() + trend() + footerPanels();
      show(h);
      wire();
    }

    // ---------- alerts ----------
    // Codes that keep firing for a reason we already know. They stay in
    // dashboard.json and stay on the page, but as a corner mark rather than a
    // banner: `unread_detection_suspect` counts scrapes that found nothing
    // unread, and the inbox is deliberately cleared by hand before a run, so the
    // zero streak is the expected outcome. Hover gives the full text.
    var MINOR = { unread_detection_suspect: 'unread check' };

    function alerts() {
      var a = D.alerts || [];
      var minor = a.filter(function (x) { return MINOR[x.code]; });
      document.getElementById('minor').innerHTML = minor.map(function (x) {
        var streak = (D.unread && D.unread.zeroStreak) || 0;
        return '<span title="' + esc(String(x.code).replace(/_/g,' ') + x.message) + '">⚑ ' +
          esc(MINOR[x.code]) + (streak ? ' · ' + num(streak) + ' clear' : '') + '</span>';
      }).join('');
      a = a.filter(function (x) { return !MINOR[x.code]; });
      if (!a.length) return '';
      return a.map(function (x) {
        var cls = x.level === 'critical' ? 'critical' : x.level === 'warn' ? 'warn' : 'info';
        var ic  = x.level === 'critical' ? '⛔' : x.level === 'warn' ? '⚠' : 'ⓘ';
        return '<div class="alert ' + cls + '"><span class="ic">' + ic + '</span><span><b>' +
          esc(String(x.code).replace(/_/g,' ')) + '</b>' + esc(x.message) + '</span></div>';
      }).join('');
    }

    // The verdict banner, the money chain and the Meta-vs-site trust check lived
    // here. Removed 2026-08-07 with the CSS above; `dashboard.json` still carries
    // `live`, so this can be restored from git if the headline is ever wanted
    // back. The runway number it showed is not lost — it is the `budget_runway`
    // alert, which renders above.

    // ---------- day by day (the daily check-in) ----------
    // Three measures that share an x-axis but NOT a y-scale, drawn as aligned
    // small multiples. Stacking KES on top of session counts would sum to
    // nothing real, and a second y-axis is the one chart mistake never worth
    // making — so each row keeps its own scale and the days stay in register.
    //
    // Every stack here is a true part-to-whole: placements sum to that day's
    // spend, depth segments sum to that day's sessions.

    // Fixed order, never cycled. Anything Meta reports that isn't Instagram,
    // Facebook or Audience Network folds into "Other" rather than earning a new
    // hue — a generated 5th hue would be indistinguishable under CVD.
    var PLACEMENTS = [
      { k:'instagram',        l:'Instagram',        c:'var(--p-ig)' },
      { k:'facebook',         l:'Facebook',         c:'var(--p-fb)' },
      { k:'other',            l:'Other',            c:'var(--p-other)' },
      { k:'audience_network', l:'Audience Network', c:'var(--warning)', warn:1 }
    ];
    // Ordinal: one hue, light → dark, deepest on top. Reuses the funnel ramp
    // already validated on this surface.
    // Where a conversation came from. Two routes we can prove plus everything we
    // can't — the blue family because these are chats, neutral slate for unknown
    // so a large unknown share reads as absence of evidence, not as a category.
    // Blue for the site route (matching the visitors row above it, which is the
    // traffic those chats came out of), WhatsApp green for the ad route, slate
    // for unknown so a large unknown share reads as absence of evidence rather
    // than as a third category worth celebrating. Two blues were tried first and
    // were indistinguishable at bar width — which defeated the whole point,
    // since site-vs-ad is the comparison this row exists to make.
    var SOURCES = [
      { k:'site',        l:'From the site',  c:'var(--f2)' },
      { k:'whatsapp_ad', l:'From a WA ad',   c:'var(--s2)' },
      { k:'unknown',     l:'Unknown source', c:'var(--p-other)' }
    ];
    // Who is doing the talking. Not a funnel: a message from us and a message
    // from a client are two sides of one exchange, so they stack to that period's
    // total traffic.
    var MSGDIRS = [
      { k:'in',  l:'From clients', c:'var(--m-in)' },
      { k:'out', l:'From us',      c:'var(--m-out)' }
    ];
    var DEPTHS = [
      { k:'arrive',  l:'Arrived only',     c:'var(--f1)' },
      { k:'product', l:'Saw a product',    c:'var(--f2)' },
      { k:'engage',  l:'Engaged',          c:'var(--f3)' },
      { k:'handoff', l:'WhatsApp handoff', c:'var(--f4)' }
    ];

    function foldPlacement(p) {
      var out = { instagram:0, facebook:0, other:0, audience_network:0 };
      for (var k in (p||{})) {
        if (k === 'instagram' || k === 'facebook' || k === 'audience_network') out[k] += p[k];
        else out.other += p[k];
      }
      return out;
    }
    // Spend, re-sliced. Placement, ad and audience are three cuts of the SAME
    // money, so they share one row rather than earning three of identical height
    // — the bar never changes, only what it is made of.
    //
    // "Audience" means ad set. Meta publishes no audience breakdown, and in this
    // account an ad set IS an audience (A3 is the corridor, A8 the self-server).
    // Saying "Audience" while grouping by ad set is the honest label for that,
    // and it is what the ad table's own grouping already means.
    //
    // Placement keeps its fixed hues because those four slots are permanent and
    // Audience Network wearing --warning is a fault state, not a category. Ads
    // and ad sets are open sets, so they get ranked instead: the top three by
    // spend across the visible window keep a hue, everything else folds into
    // Other. Same rule the placement row already follows, and for the same
    // reason — a generated 4th+ categorical hue is indistinguishable under CVD.
    var CUTS = { placement:'Placement', byAd:'Ad', byAdset:'Audience' };

      [0, 1, 2, 3].forEach(function (ri) {
        ds.forEach(function (d, i) {
          svg.push('<rect class="rhit" data-ri="' + ri + '" data-di="' + i + '" x="' + (L + col*i) +
                   '" y="' + R[ri].y + '" width="' + col + '" height="' + R[ri].h + '" fill="transparent"/>');
        });
      });

      // Row header: name, peak, then the legend. A legend is present for every
      // multi-series row so identity is never carried by colour alone.
      var rowHead = function (band, label, max, unit, items) {
        var y = band.y - 8;
        var out = ['<text class="rl" x="' + L + '" y="' + y + '">' + esc(label) + '</text>',
                   '<text class="rmax" x="' + (L + label.length * 6.6 + 10) + '" y="' + y + '">peak ' +
                   esc(unit === 'kes' ? kes(max) : num(max)) + '</text>'];
        var x = 250;
        items.forEach(function (s) {
          if (s.warn) { out.push('<text class="lg" x="' + x + '" y="' + y + '">⚠</text>'); x += 12; }
          out.push('<rect x="' + x + '" y="' + (y - 7) + '" width="8" height="8" rx="2" fill="' + s.c + '"/>');
          out.push('<text class="lg" x="' + (x + 12) + '" y="' + y + '">' + esc(s.l) + '</text>');
          x += 12 + s.l.length * 5.6 + 18;
        });
        svg.push('<g class="hdr">' + out.join('') + '</g>');
      };
      rowHead(R[0], 'Spend', maxSpend, 'kes', SPEND.items);
      rowHead(R[1], 'Visitors', maxSess, 'num', DEPTHS);
      rowHead(R[2], 'New chats', maxChat, 'num', SOURCES.concat([{ l:'Sale', c:'var(--good)' }]));
      rowHead(R[3], 'Messages', maxMsg, 'num', MSGDIRS);
      // No legend: one series, so the row label already names what is plotted and
      // a single-swatch box would just restate it.
      rowHead(R[4], 'Paid', maxPaid, 'kes', []);

      // Notes only where a row genuinely cannot speak — not decoration.
      var notes = [];
      if (cov.siteFrom > 0) notes.push('Visitor tracking began ' + fmtDay(D2.siteEventsFrom) + ' — earlier ' + G.unit + ' were not measured, not empty.');
      if (cov.convThru < n - 1) notes.push('Conversations pulled through ' + fmtDay(D2.conversationsThrough) + ' — run <b>run.command</b> to fill in the rest.');
      // Message counts come from scraped transcripts, so they only exist for
      // periods a run actually covered. Hatching says WHERE; this says why, and
      // that the gap is ours rather than the inbox's.
      var msgGaps = ds.filter(function (d) { return !d.msgDays; }).length;
      var msgPart = ds.filter(function (d) { return d.msgDays > 0 && d.msgDays < d.dayCount; }).length;
      if (msgGaps) {
        notes.push('<b>' + msgGaps + ' ' + (msgGaps === 1 ? G.one : G.unit) + ' with no message data</b> — ' +
          'nobody ran <b>run.command</b> near ' + (msgGaps === 1 ? 'it' : 'them') + ', so the hatched ' +
          (msgGaps === 1 ? 'bar is' : 'bars are') + ' uncollected, not silent.');
      } else if (msgPart) {
        // At week and month grain almost every bucket is partial, so counting
        // them ("12 months only part-covered") is noise dressed as precision.
        // Say the rule once and let the tooltip give the numbers per bucket.
        notes.push('Messages count only the days a run covered — hover any ' + G.one + ' for how many.');
      }
      // Unread conversations are deliberately not opened — reading one would clear
      // the flag before the team sees it. That makes them invisible here unless
      // said, and they are the ones with someone still waiting.
      if (D.unread && D.unread.count > 0) {
        notes.push('<b>' + num(D.unread.count) + ' conversation' + (D.unread.count === 1 ? '' : 's') +
          ' not reviewed because unread</b> — left unread for your team' +
          (D.unread.observedOn ? ', as of ' + fmtDay(D.unread.observedOn) : '') + '.');
      }
      // The newest bar is a period still running. At day grain that is obvious;
      // across a month it reads as a collapse unless it is said.
      if (grain !== 'day' && n) {
        notes.push('This ' + G.one + ' is still in progress (' + ds[n-1].dayCount + ' of its days so far) — it is not a drop.');
      }
      // A part-covered bucket at the boundary reports only the days it can see.
      if (cutEmpty) {
        notes.push('No ' + (CUTS[view.spendCut] || '').toLowerCase() + ' breakdown in this snapshot — showing placement. ' +
                   'Run the sync to collect it.');
      }
      if (grain !== 'day' && cov.siteFrom < n && D2.siteEventsFrom && (ds[cov.siteFrom].first || '') < D2.siteEventsFrom) {
        notes.push('The ' + G.one + ' beginning ' + fmtDay(ds[cov.siteFrom].first) + ' is only part-tracked — visitors are counted from ' + fmtDay(D2.siteEventsFrom) + '.');
      }

      return '<section><div class="sec-head"><h2>' + esc(G.one.charAt(0).toUpperCase() + G.one.slice(1)) +
        ' by ' + esc(G.one) + '</h2>' +
        '<span class="sec-note">last ' + n + ' ' + G.unit + ' · hover any ' + G.one + '</span>' +
        '<span class="right">' +
          '<span class="seg">' + cutbtn('placement','Placement') + cutbtn('byAd','Ad') + cutbtn('byAdset','Audience') + '</span>' +
          '<span class="seg">' + grainbtn('day','Day') + grainbtn('week','Week') + grainbtn('month','Month') + '</span>' +
        '</span></div>' +
        '<div class="card pad">' +
          '<div class="chartwrap"><svg id="dailysvg" viewBox="0 0 ' + W + ' ' + H +
          '" width="100%" preserveAspectRatio="xMinYMin meet">' + svg.join('') + '</svg></div>' +
          (notes.length ? '<div class="daily-note">' + notes.join('<br>') + '</div>' : '') +
        '</div></section>';
    }

    // ---------- per-ad economics (the decision surface) ----------
    // Campaign / ad set / ad are columns, and any of the three can be the row
    // identity. Every metric column names its own window in the header, because
    // 30d spend and lifetime revenue in one row is otherwise a trap.
    var MEASURES = ['spend30','spendLife','convosMeta30','ourConversations','sales','sales30','revenue','revenue30'];

    // One window at a time, chosen explicitly — rather than 30-day spend sitting
    // next to lifetime revenue in the same row, which reads as a ratio and isn't
    // one. Switching to Lifetime is also how the paused boosted posts become
    // comparable: they have no 30-day anything, and all the revenue.
    var WIN = {
      '30d':  { spend:'spend30',   convos:'convosMeta30',     cpc:'costPerConvo30',
                sales:'sales30',   revenue:'revenue30',
                l:{ spend:'Spend 30d', convos:'Convos 30d', cpc:'Cost/convo', sales:'Sales 30d', revenue:'Revenue 30d' },
                hint:{ convos:'Conversations started in the last 30 days, as counted by Meta.',
                       cpc:'30-day spend ÷ 30-day conversations. Same window both sides.' } },
      'life': { spend:'spendLife', convos:'ourConversations', cpc:'costPerConvoLife',
                sales:'sales',     revenue:'revenue',
                l:{ spend:'Spend life', convos:'Attributed', cpc:'Cost/convo', sales:'Sales', revenue:'Revenue' },
                hint:{ convos:'Every conversation in Airtable carrying this Meta Ad ID, all time — Meta has no lifetime messaging data for boosted posts, our attribution does.',
                       cpc:'Lifetime spend ÷ lifetime attributed conversations.' } }
    };
    function cols() {
      var g = view.group, w = WIN[view.win];
      var c = [{ k:'name', l: g==='campaign' ? 'Campaign' : g==='adset' ? 'Ad set' : 'Ad', t:1 }];
      if (g === 'ad')    c.push({ k:'campaign', l:'Campaign', x:1 }, { k:'adset', l:'Ad set', x:1 });
      if (g === 'adset') c.push({ k:'campaign', l:'Campaign', x:1 });
      return c.concat([
        { k:w.spend,   l:w.l.spend,   m:1 },
        { k:w.convos,  l:w.l.convos },
        { k:w.cpc,     l:w.l.cpc,     m:1, lead:1 },
        { k:w.sales,   l:w.l.sales },
        { k:w.revenue, l:w.l.revenue, m:1 },
        { k:'flags',   l:'Flags',     t:1 }
      ]);
    }

    // Roll a set of ads up onto one row. Ratios are recomputed from the summed
    // parts (never averaged), and a group counts as ACTIVE if anything in it is.
    function aggregate(ads, keyOf, nameOf) {
      var m = new Map(), order = [];
      ads.forEach(function (a) {
        var k = String(keyOf(a) || '—'), g = m.get(k);
        if (!g) {
          g = { key:k, name:nameOf(a) || '—', campaign:a.campaign, adset:a.adset, n:0, status:'PAUSED', flags:[] };
          MEASURES.forEach(function (f) { g[f] = 0; });
          m.set(k, g); order.push(g);
        }
        g.n++;
        MEASURES.forEach(function (f) { g[f] += Number(a[f]) || 0; });
        if (a.status === 'ACTIVE') g.status = 'ACTIVE';
        (a.flags||[]).forEach(function (f) { if (g.flags.indexOf(f) < 0) g.flags.push(f); });
      });
      order.forEach(function (g) {
        ['spend30','spendLife','revenue','revenue30'].forEach(function (f) { g[f] = Math.round(g[f]*100)/100; });
        // Recomputed from the summed parts, never averaged — and each ratio keeps
        // both of its sides inside one window.
        g.costPerConvo30   = g.convosMeta30     ? Math.round(g.spend30/g.convosMeta30*100)/100     : null;
        g.costPerConvoLife = g.ourConversations ? Math.round(g.spendLife/g.ourConversations*100)/100 : null;
      });
      return order;
    }

    function visibleRows() {
      var ads = (D.perAd || []).slice();
      if (view.filter === 'spending') ads = ads.filter(function (p) { return (p.spend30||0) > 0; });
      else if (view.filter === 'active') ads = ads.filter(function (p) { return p.status === 'ACTIVE'; });
      if (view.q) {
        var q = view.q.toLowerCase();
        ads = ads.filter(function (p) {
          return ((p.name||'') + ' ' + (p.campaign||'') + ' ' + (p.adset||'')).toLowerCase().indexOf(q) >= 0;
        });
      }
      var rows = view.group === 'campaign'
          ? aggregate(ads, function(a){return a.campaignId||a.campaign;}, function(a){return a.campaign;})
        : view.group === 'adset'
          ? aggregate(ads, function(a){return a.adsetId||a.adset;}, function(a){return a.adset;})
        : ads;

      var k = view.sort, dir = view.dir;
      rows.sort(function (a,b) {
        var x = a[k], y = b[k];
        if (k === 'flags') { x = (a.flags||[]).length; y = (b.flags||[]).length; }
        if (typeof x === 'string' || typeof y === 'string') { x = String(x==null?'':x).toLowerCase(); y = String(y==null?'':y).toLowerCase(); return x>y?dir:x<y?-dir:0; }
        x = x == null ? -1 : x; y = y == null ? -1 : y;
        return (x-y) * dir;
      });
      return rows;
    }

    // Audiences. Small on purpose: three things Ads Manager makes you click
    // through for — how big, will it deliver, and is anything using it.
    //
    // Size is stated qualitatively whenever Meta refuses a real one. It floors
    // `approximate_count_lower_bound` at 1000, so a 150-record customer list and
    // a 900-record one report identically. Printing "1,000" for both would be a
    // fabricated number in the one place someone is trying to judge whether a
    // pool has grown, so the payload sends null and this prints the state.
    //
    // RETIRED rows are folded away rather than dropped: they still hold spend
    // history and are still referenced by a paused ad set, so a list that
    // silently omitted them would misrepresent the account.
    function audienceTable() {
      var A = D.audiences; if (!A || !A.length) return '';
      var live = A.filter(function (a) { return !a.retired; });
      var retired = A.filter(function (a) { return a.retired; });
      var row = function (a) {
        var use = [];
        if (a.targetedBy.length) use.push('<span class="chip ok">targeted ×' + a.targetedBy.length + '</span>');
        if (a.excludedBy.length) use.push('<span class="chip">excluded ×' + a.excludedBy.length + '</span>');
        if (!use.length) use.push('<span class="chip" style="opacity:.55">unused</span>');
        var size = a.size != null ? num(a.size)
          : '<span style="color:var(--muted)">' + esc(a.sizeNote || 'unknown') + '</span>';
        return '<tr' + (a.retired ? ' style="opacity:.5"' : '') + '>' +
          '<td style="text-align:left">' + esc(a.name) + '</td>' +
          '<td>' + size + '</td>' +
          '<td style="text-align:left">' + use.join(' ') + '</td></tr>';
      };
      return '<section><div class="sec-head"><h2>Audiences</h2>' +
        '<span class="sec-note">size, and whether anything is using it</span></div>' +
        '<div class="card"><div class="tablewrap"><table>' +
        '<thead><tr><th style="text-align:left">Audience</th><th>Size</th>' +
        '<th style="text-align:left">Used by ad sets</th></tr></thead><tbody>' +
        live.map(row).join('') +
        (retired.length ? '<tr><td colspan="3" style="text-align:left;padding-top:14px">' +
          '<span class="sec-note">' + retired.length + ' retired — superseded, do not attach</span></td></tr>' +
          retired.map(row).join('') : '') +
        '</tbody></table></div>' +
        '<div class="sec-note" style="padding:10px 12px 12px">Meta will not report a size under 1,000, ' +
        'so a small pool shows its state rather than a count. A lookalike needs roughly 1,000 before its ' +
        'seed is worth modelling.</div></div></section>';
    }

    function adTable() {
      var rows = visibleRows(), C = cols();
      var counts = {
        spending: (D.perAd||[]).filter(function(p){return (p.spend30||0)>0;}).length,
        active:   (D.perAd||[]).filter(function(p){return p.status==='ACTIVE';}).length,
        all:      (D.perAd||[]).length
      };
      var w = WIN[view.win];
      var head = '<section><div class="sec-head"><h2>Per-ad economics</h2>' +
        '<span class="sec-note">where the money went, and what it bought</span>' +
        '<span class="right">' +
          '<input type="search" id="adq" placeholder="Filter…" value="' + esc(view.q) + '">' +
          '<span class="seg">' + winbtn('30d','30 days') + winbtn('life','Lifetime') + '</span>' +
          '<span class="seg">' + grpbtn('ad','By ad') + grpbtn('adset','By ad set') + grpbtn('campaign','By campaign') + '</span>' +
          '<span class="seg">' +
            segbtn('spending','Spending (' + counts.spending + ')') +
            segbtn('active','Active (' + counts.active + ')') +
            segbtn('all','All (' + counts.all + ')') +
          '</span>' +
        '</span></div>';

      if (!rows.length) return head + '<div class="card pad"><div class="empty">Nothing matches this view.</div></div></section>';

      var HINTS = {
        spend30: 'Meta spend in the last 30 days.',
        spendLife: 'Everything this ad has ever spent.',
        revenue: 'All-time revenue from orders on conversations attributed here.',
        revenue30: 'Revenue from conversations that started in the last 30 days. Sales close slowly, so this lags spend.',
        sales30: 'Sales from conversations that started in the last 30 days.'
      };
      HINTS[w.convos] = w.hint.convos;
      HINTS[w.cpc] = w.hint.cpc;
      var th = C.map(function (c) {
        var on = view.sort === c.k;
        return '<th data-k="' + c.k + '"' + (c.x ? ' class="text"' : '') +
          (HINTS[c.k] ? ' title="' + esc(HINTS[c.k]) + '"' : '') + '>' + esc(c.l) +
          (on ? ' <span class="arrow">' + (view.dir < 0 ? '▼' : '▲') + '</span>' : '') + '</th>';
      }).join('');

      var grouped = view.group !== 'ad';
      var body = rows.map(function (p) {
        return '<tr' + (grouped ? ' class="grouprow"' : '') + '>' + C.map(function (c) {
          if (c.k === 'name') {
            return '<td title="' + esc(p.name || '') + '"><div class="adname">' +
              '<span class="nm">' + esc(p.name || '—') + '</span>' +
              '<span class="pill ' + esc(p.status) + '">' + esc(p.status) + '</span>' +
              (grouped ? '<span class="gcount">' + num(p.n) + ' ad' + (p.n===1?'':'s') + '</span>' : '') +
              '</div></td>';
          }
          if (c.x) { var t = p[c.k] || '—'; return '<td class="text" title="' + esc(t) + '">' + esc(t) + '</td>'; }
          if (c.k === 'flags') return '<td>' + flagCell(p.flags || []) + '</td>';
          var v = p[c.k];
          var cls = 'num' + (c.lead ? ' lead' : '') + ((v == null || v === 0) ? ' zero' : '');
          return '<td class="' + cls + '">' + (v == null ? '—' : (c.m ? kes(v) : num(v))) + '</td>';
        }).join('') + '</tr>';
      }).join('');

      return head + '<div class="card"><div class="tablewrap"><table id="adtable"><thead><tr>' + th +
        '</tr></thead><tbody>' + body + '</tbody></table></div></div></section>';
    }
    // One chip per row: the worst thing wrong, plus a count of the rest. Three
    // stacked chips per row was three lines of small print competing with the
    // numbers — and the row's worst problem is the one that decides what you do.
    // The full list stays one hover away.
    var SEV = { serious:0, warning:1, info:2 };
    function flagCell(f) {
      if (!f.length) return '<span class="chips"><span class="chip ok">clean</span></span>';
      var metas = f.map(function (code) {
        return FLAGS[code] || { s:'info', t:code.replace(/_/g,' '), d:code };
      }).sort(function (a,b) { return (SEV[a.s]==null?9:SEV[a.s]) - (SEV[b.s]==null?9:SEV[b.s]); });
      var all = metas.map(function (m) { return '• ' + m.t + ' — ' + m.d; }).join('\n');
      var top = metas[0], rest = metas.length - 1;
      return '<span class="chips" title="' + esc(all) + '">' +
        '<span class="chip ' + top.s + '">' + esc(top.t) + '</span>' +
        (rest ? '<span class="chip more">+' + rest + '</span>' : '') +
      '</span>';
    }

    function segbtn(v, l) {
      return '<button data-filter="' + v + '" class="' + (view.filter===v?'on':'') + '">' + esc(l) + '</button>';
    }
    function grpbtn(v, l) {
      return '<button data-group="' + v + '" class="' + (view.group===v?'on':'') + '">' + esc(l) + '</button>';
    }
    function winbtn(v, l) {
      return '<button data-win="' + v + '" class="' + (view.win===v?'on':'') + '">' + esc(l) + '</button>';
    }

    // ---------- funnels ----------
    function cohortFor(month) {
      var cs = D.cohorts || [];
      if (month === '__all') {
        return cs.reduce(function (a,c) {
          ['arrive','product_view','engage','wa_handoff','conversation','quoted','sale','revenue'].forEach(function (k) { a[k] = (a[k]||0) + (c[k]||0); });
          return a;
        }, { month:'__all' });
      }
      return cs.find(function (c) { return c.month === month; }) || {};
    }
    function funnels() {
      var c = cohortFor(view.month);
      var opts = (D.cohorts||[]).map(function (x) {
        return '<option value="' + x.month + '"' + (x.month===view.month?' selected':'') + '>' + x.month + '</option>';
      }).join('') + '<option value="__all"' + (view.month==='__all'?' selected':'') + '>All time</option>';

      var site = [
        { k:'arrive',       l:'Arrived',        c:'var(--f1)' },
        { k:'product_view', l:'Saw a product',  c:'var(--f2)' },
        { k:'engage',       l:'Engaged',        c:'var(--f3)' },
        { k:'wa_handoff',   l:'WhatsApp handoff', c:'var(--f4)' }
      ];
      var out = [
        { k:'conversation', l:'Conversation', c:'var(--o1)' },
        { k:'quoted',       l:'Quoted',       c:'var(--o2)' },
        { k:'sale',         l:'Sale',         c:'var(--o3)' }
      ];

      // The seam between the two panels above: tapping WhatsApp is the last thing
      // the site can see, and the first message is the first thing we can. Three
      // numbers, not a chart — at this volume a chart would dress up an n of 19.
      function handoffSeam() {
        var H = D.handoffSeam; if (!H || !H.handoffs) return '';
        var missing = H.handoffs - H.codesArrived;
        var pct = H.handoffs ? Math.round(100 * H.codesArrived / H.handoffs) : 0;
        var cell = function (v, l, dim) {
          return '<div style="flex:1 1 0;min-width:120px">' +
            '<div style="font-size:22px;font-variant-numeric:tabular-nums' + (dim ? ';color:var(--muted)' : '') + '">' + v + '</div>' +
            '<div class="fn-sub" style="margin:2px 0 0">' + l + '</div></div>';
        };
        // Which explanation the gap supports is computable, so compute it rather
        // than leave the reader to guess between two very different problems.
        var verdict = H.conversations < H.handoffs
          ? 'Only <b>' + num(H.conversations) + '</b> conversation' + (H.conversations === 1 ? '' : 's') +
            ' started at all in this period, from every source — so most of that gap is people not sending, ' +
            'not codes being cleared.'
          : 'Conversations started outnumber handoffs here, so the missing codes are mostly cleared prefills ' +
            'rather than people dropping out.';
        return '<div class="card pad" style="margin-top:12px">' +
          '<div class="fn-title">Site → WhatsApp</div>' +
          '<div class="fn-sub">The handoff seam, since ' + fmtDay(H.since) + '. Tapping WhatsApp is the last thing the site sees.</div>' +
          '<div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:12px">' +
            cell(num(H.handoffs), 'tapped through to WhatsApp') +
            cell(num(H.codesArrived), 'arrived with their code · ' + pct + '%') +
            cell(num(missing), 'no code reached us', true) +
          '</div>' +
          '<div class="sec-note" style="margin-top:10px">A code goes missing either because the person never sent the ' +
            'prefilled message, or because they cleared it — indistinguishable from here. ' + verdict + '</div>' +
        '</div>';
      }

      return '<section><div class="sec-head"><h2>Funnel</h2>' +
        '<span class="sec-note">how far people get</span>' +
        '<span class="right"><select id="fmonth">' + opts + '</select></span></div>' +
        '<div class="funnels">' +
          '<div class="card pad">' +
            '<div class="fn-title">On-site journey</div>' +
            '<div class="fn-sub">Tracked sessions on framework.co.ke.</div>' +
            stages(site, c, c.arrive || 0, 'arrivals') +
          '</div>' +
          '<div class="card pad">' +
            '<div class="fn-title">Conversation outcomes</div>' +
            '<div class="fn-sub">From Airtable — <b>all</b> conversations this month, not only tracked ones.</div>' +
            stages(out, c, c.conversation || 0, 'conversations') +
            (c.revenue ? '<div class="stage" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">' +
              '<div class="row1"><span class="nm">Revenue</span><span class="val"><b>' + kes(c.revenue) + '</b></span></div></div>' : '') +
          '</div>' +
        '</div>' +
        handoffSeam() +
        '<div class="sec-note" style="margin-top:9px">Percentages are a share of the base, not of the stage above — ' +
          'these milestones are not nested (someone can tap WhatsApp straight from arrival). ' +
          'The two panels are separate populations until ref codes join them: the left is only sessions we tracked, ' +
          'the right is every conversation from any source.</div>' +
      '</section>';
    }
    // Every stage is shown as a share of the BASE (arrivals / conversations), not
    // of the previous stage. These milestones are not strictly nested — someone can
    // tap WhatsApp straight from arrival without ever "engaging" (we record
    // handoff_depth=arrived) — so "% of previous" can exceed 100% and implies a
    // funnel shape the data doesn't have.
    function stages(defs, c, base, baseLabel) {
      if (!base) return '<div class="empty">Nothing recorded in this period.</div>';
      return defs.map(function (s, i) {
        var v = c[s.k] || 0;
        var pct = base ? (100*v/base) : 0;
        var lab = i === 0 ? 'all ' + esc(baseLabel) : Math.round(pct) + '% of ' + esc(baseLabel);
        return '<div class="stage"><div class="row1"><span class="nm">' + esc(s.l) + '</span>' +
          '<span class="val"><b>' + num(v) + '</b><span class="pct">' + lab + '</span></span></div>' +
          '<div class="bar"><span style="width:' + Math.max(Math.min(pct,100),0.8) + '%;background:' + s.c + '"></span></div></div>';
      }).join('');
    }

    // ---------- monthly trend ----------
    function trend() {
      var cs = (D.cohorts || []).slice(-12);
      var head = '<section><div class="sec-head"><h2>Monthly trend</h2>' +
        '<span class="sec-note">conversations and sales over time</span>' +
        '<span class="right"><span class="seg">' +
          '<button data-trend="chart" class="' + (view.trendTable?'':'on') + '">Chart</button>' +
          '<button data-trend="table" class="' + (view.trendTable?'on':'') + '">Table</button>' +
        '</span></span></div>';
      if (!cs.length) return head + '<div class="card pad"><div class="empty">No monthly data yet.</div></div></section>';

      if (view.trendTable) {
        var rows = cs.slice().reverse().map(function (c) {
          return '<tr><td>' + esc(c.month) + '</td><td class="num">' + num(c.arrive) + '</td><td class="num">' + num(c.wa_handoff) +
            '</td><td class="num">' + num(c.conversation) + '</td><td class="num">' + num(c.quoted) + '</td><td class="num">' + num(c.sale) +
            '</td><td class="num">' + kes(c.revenue) + '</td></tr>';
        }).join('');
        return head + '<div class="card"><div class="tablewrap"><table><thead><tr><th>Month</th><th>Arrived</th>' +
          '<th>Handoffs</th><th>Conversations</th><th>Quoted</th><th>Sales</th><th>Revenue</th></tr></thead><tbody>' +
          rows + '</tbody></table></div></div></section>';
      }

      var W = 980, H = 210, padL = 34, padB = 26, padT = 8;
      var max = Math.max.apply(null, cs.map(function (c) { return Math.max(c.conversation||0, c.sale||0); }).concat([1]));
      var plotH = H - padB - padT, step = (W - padL) / cs.length;
      var bw = Math.min(16, step * 0.30);
      var g = '';
      for (var i = 0; i <= 3; i++) {
        var y = padT + plotH * i/3, val = Math.round(max * (3-i)/3);
        g += '<line x1="' + padL + '" y1="' + y + '" x2="' + W + '" y2="' + y + '" stroke="#262b36" stroke-width="1"/>' +
             '<text x="' + (padL-8) + '" y="' + (y+3.5) + '" text-anchor="end">' + val + '</text>';
      }
      var bars = cs.map(function (c, i) {
        var x = padL + i*step + step/2;
        var h1 = plotH * (c.conversation||0) / max, h2 = plotH * (c.sale||0) / max;
        // 2px surface gap between the adjacent pair
        var b = '<rect class="hit" x="' + (x - step/2) + '" y="' + padT + '" width="' + step + '" height="' + plotH +
                '" fill="transparent" data-i="' + i + '"/>';
        b += '<rect x="' + (x - bw - 1) + '" y="' + (padT + plotH - h1) + '" width="' + bw + '" height="' + Math.max(h1,0) +
             '" rx="3" fill="var(--s1)" pointer-events="none"/>';
        b += '<rect x="' + (x + 1) + '" y="' + (padT + plotH - h2) + '" width="' + bw + '" height="' + Math.max(h2,0) +
             '" rx="3" fill="var(--s2)" pointer-events="none"/>';
        b += '<text x="' + x + '" y="' + (H - padB + 15) + '" text-anchor="middle">' + esc(c.month.slice(2)) + '</text>';
        return b;
      }).join('');
      return head + '<div class="card pad">' +
        '<div class="legend"><span><i style="background:var(--s1)"></i>Conversations</span>' +
        '<span><i style="background:var(--s2)"></i>Sales</span></div>' +
        '<svg id="trendsvg" viewBox="0 0 ' + W + ' ' + H + '" width="100%" preserveAspectRatio="xMinYMin meet">' +
        g + bars + '</svg></div></section>';
    }

    // ---------- reference + refresh ----------
    function footerPanels() {
      var r = D.reference || {};
      var opts = (r.catalogIds||[]).map(function (id) { return '<option value="' + esc(id) + '">' + esc(id) + '</option>'; }).join('');
      return '<section>' +
        '<details><summary>Making a new ad — the two things every ad needs</summary><div class="inner">' +
          '<p><b>1 · URL parameters</b> — paste into the ad’s “URL parameters” field. Stamps the ad’s identity so conversations trace back to it. Same string for every ad.</p>' +
          copyrow(r.urlTags || '', 'urltags') +
          '<p style="margin-top:16px"><b>2 · Destination link</b> — point at a specific product, not the bare catalog.</p>' +
          '<div style="margin:6px 0"><select id="cfgpick">' + opts + '</select></div>' +
          copyrow('', 'deeplink') +
        '</div></details>' +
        '<details><summary>Refreshing this page</summary><div class="inner">' +
          '<p>This is a snapshot. To pull the latest numbers:</p><ol>' +
          '<li>On the Mac: Finder → <b>code</b> → <b>framework</b> → <b>framework-ops</b>.</li>' +
          '<li>Double-click <b>sync.command</b> (about 30 seconds), then press Enter when it finishes.</li>' +
          '<li>Reload this page — the badge up top should read “Synced today”.</li>' +
          '</ol><p style="color:var(--muted)">To also pull new WhatsApp conversations, double-click <b>run.command</b> instead and press <b>y</b> when it asks.</p>' +
        '</div></details></section>';
    }
    function copyrow(t, id) {
      return '<div class="copyrow"><textarea id="cp_' + id + '" rows="2" readonly>' + esc(t) + '</textarea>' +
        '<button class="btn" data-copy="' + id + '">Copy</button></div>';
    }

    // ---------- wiring ----------
    function resetSort() { view.sort = WIN[view.win].spend; view.dir = -1; }
    function wire() {
      var q = document.getElementById('adq');
      if (q) q.oninput = function () { view.q = q.value; var s = q.selectionStart; render();
        var n = document.getElementById('adq'); if (n) { n.focus(); n.setSelectionRange(s,s); } };
      document.querySelectorAll('[data-filter]').forEach(function (b) {
        b.onclick = function () { view.filter = b.getAttribute('data-filter'); render(); };
      });
      document.querySelectorAll('[data-group]').forEach(function (b) {
        b.onclick = function () {
          view.group = b.getAttribute('data-group');
          // Sorting by a column the new grouping doesn't have would silently
          // scramble the order — fall back to the window's spend column.
          if (view.sort === 'campaign' || view.sort === 'adset') resetSort();
          render();
        };
      });
      document.querySelectorAll('[data-win]').forEach(function (b) {
        b.onclick = function () {
          var prev = WIN[view.win];
          view.win = b.getAttribute('data-win');
          // Carry the sort across to the equivalent column in the new window, so
          // switching windows doesn't silently reorder the table under you.
          var role = null;
          ['spend','convos','cpc','sales','revenue'].forEach(function (r) { if (prev[r] === view.sort) role = r; });
          if (role) view.sort = WIN[view.win][role];
          else if (view.sort !== 'name' && view.sort !== 'flags' && view.sort !== 'campaign' && view.sort !== 'adset') resetSort();
          render();
        };
      });
      document.querySelectorAll('#adtable thead th').forEach(function (th) {
        th.onclick = function () {
          var k = th.getAttribute('data-k');
          if (view.sort === k) view.dir = -view.dir; else { view.sort = k; view.dir = -1; }
          render();
        };
      });
      var fm = document.getElementById('fmonth');
      if (fm) fm.onchange = function () { view.month = fm.value; render(); };
      document.querySelectorAll('[data-trend]').forEach(function (b) {
        b.onclick = function () { view.trendTable = b.getAttribute('data-trend') === 'table'; render(); };
      });
      document.querySelectorAll('[data-grain]').forEach(function (b) {
        b.onclick = function () { view.grain = b.getAttribute('data-grain'); render(); };
      });
      document.querySelectorAll('[data-spendcut]').forEach(function (b) {
        b.onclick = function () { view.spendCut = b.getAttribute('data-spendcut'); render(); };
      });
      document.querySelectorAll('[data-copy]').forEach(function (b) {
        b.onclick = function () {
          var el = document.getElementById('cp_' + b.getAttribute('data-copy'));
          el.select(); try { navigator.clipboard.writeText(el.value); } catch (e) { document.execCommand('copy'); }
          var o = b.textContent; b.textContent = 'Copied ✓'; setTimeout(function(){ b.textContent = o; }, 1200);
        };
      });
      var pick = document.getElementById('cfgpick'), dl = document.getElementById('cp_deeplink');
      if (pick && dl) { var upd = function () { dl.value = (D.reference.deeplinkBase||'') + pick.value; }; pick.onchange = upd; upd(); }
      trendHover();
      dailyHover();
    }

    // One tooltip for all three rows: the rows are aligned so they can be read
    // as one day, so hovering reports the whole day rather than one measure.
    // Each figure carries its change against the mean of the 7 days before it —
    // that comparison is the entire point of checking this daily.
    function dailyHover() {
      var svg = document.getElementById('dailysvg'); if (!svg) return;
      var D2 = D.daily, series = dailySeries(); if (!series) return;
      var ds = series.ds, n = ds.length, grain = series.grain, G = GRAINS[grain];
      var cut = activeCut(), SPEND = spendSeries(ds, cut);
      var tip = document.getElementById('tip');
      var cov = dailyCoverage(D2, ds, n);

      // Today is still in progress. Comparing a few hours against a run of whole
      // days would show a scary minus every morning and mean nothing, so today
      // gets no delta at all — it gets said out loud instead.
      var delta = function (i, get, covered) {
        if (!covered || i === n - 1) return '';
        var prev = [], j = i - 1;
        while (j >= 0 && prev.length < 7) { if (covered(j)) prev.push(get(ds[j])); j--; }
        if (prev.length < 3) return ''; // too little history to compare honestly
        var base = prev.reduce(function (a, b) { return a + b; }, 0) / prev.length;
        var v = get(ds[i]);
        if (base === 0) return v > 0 ? '<span style="color:var(--good)">new</span>' : '';
        var pct = Math.round(((v - base) / base) * 100);
        if (pct === 0) return '<span style="color:var(--muted)">flat</span>';
        // Percentages off a near-zero base run to the thousands and stop meaning
        // anything; cap the display rather than print noise.
        var shown = Math.abs(pct) > 999 ? (pct > 0 ? '+999%+' : '-99%') : (pct > 0 ? '+' : '') + pct + '%';
        return '<span style="color:' + (pct > 0 ? 'var(--good)' : 'var(--dim)') + '">' + shown + '</span>';
      };
      var rowLine = function (label, value, d) {
        return '<div class="r"><span>' + label + '</span><span>' + value +
               (d ? ' <small>' + d + '</small>' : '') + '</span></div>';
      };

      // Per-order hover on the Paid row. The cells sit inside the day-wide hit
      // rect, so they are wired first and stop the event reaching it — otherwise
      // pointing at one order reports the whole day and the cell you aimed at is
      // the one thing the tooltip never mentions.
      var place = function (e) {
        tip.style.opacity = 1;
        var x = e.clientX + 16, y = e.clientY - 10;
        if (x + 290 > window.innerWidth) x = e.clientX - 290;
        if (y + 300 > window.innerHeight) y = window.innerHeight - 310;
        tip.style.left = x + 'px'; tip.style.top = Math.max(8, y) + 'px';
      };
      var lit = null;
      var unlight = function () { if (lit) { lit.classList.remove('on'); lit = null; } };
      svg.querySelectorAll('.ohit').forEach(function (r) {
        r.style.cursor = 'default';
        r.addEventListener('mousemove', function (e) {
          e.stopPropagation();
          var i = Number(r.getAttribute('data-di')), j = Number(r.getAttribute('data-oi')), d = ds[i];
          if (!d || !d.orderValues || !d.orderValues[j]) return;
          unlight();
          lit = svg.querySelector('.ocell[data-oc="' + r.getAttribute('data-oc') + '"]');
          if (lit) lit.classList.add('on');
          var vals = d.orderValues, v = vals[j];
          var others = vals.filter(function (_, k) { return k !== j; });
          var ttl = grain === 'day' ? DOW[new Date(d.day + 'T12:00:00Z').getUTCDay()] + ' ' + fmtDay(d.day)
                  : grain === 'week' ? 'Week of ' + fmtDay(d.first)
                  : MONFULL[new Date(d.first + 'T12:00:00Z').getUTCMonth()] + ' ' + d.first.slice(0, 4);
          var h = '<div class="t">' + esc(ttl) + '</div>' +
                  '<div class="lead" style="color:var(--good)">' + kes(v) + '</div>' +
                  '<div class="sub">one order · ' + num(j + 1) + ' of ' + num(vals.length) +
                  ' paid this ' + G.one + '</div>';
          if (others.length) {
            h += rowLine(others.length === 1 ? 'The other order' : 'The other ' + num(others.length) + ' orders',
                         others.map(function (o) { return kes(o); }).join(' · '), '');
          }
          h += rowLine('<b>' + G.one.charAt(0).toUpperCase() + G.one.slice(1) + ' total</b>',
                       '<b>' + kes(d.revenue) + '</b>', '');
          tip.innerHTML = h;
          place(e);
        });
        r.addEventListener('mouseleave', function () { unlight(); tip.style.opacity = 0; });
      });

      // Row-scoped hover, replacing the day-wide panel.
      //
      // Reporting every measure at once made the tooltip long enough that nobody
      // read to the bottom, and it could never say which segment the pointer was
      // actually over. These resolve the exact cell, brighten it, dim the rest of
      // that bar, and report that one number with the bucket total for context.
      var ROWMETA = [
        { l:'Spend', unit:'kes', get:function (d) { return d.spend || 0; },
          ok:function () { return true; } },
        { l:'Visitors', unit:'num', get:function (d) { return d.sessions || 0; },
          ok:function (i) { return i >= cov.siteFrom; }, absent:'not tracked yet' },
        { l:'New chats', unit:'num', get:function (d) { return d.newChats || 0; },
          ok:function (i) { return i <= cov.convThru; }, absent:'not counted yet' },
        { l:'Messages', unit:'num',
          get:function (d) { return d.messages ? (d.messages.in || 0) + (d.messages.out || 0) : 0; },
          ok:function (i) { return ds[i].msgDays > 0 || !!ds[i].messagesCovered; },
          absent:'no run covered this' }
      ];
      var SEGS = DAILY_SEGS;
      var fmtv = function (unit, v) { return unit === 'kes' ? kes(v) : num(v); };
      var dimAll = function () {
        svg.querySelectorAll('.sg.on,.sg.off').forEach(function (e) { e.classList.remove('on'); e.classList.remove('off'); });
      };
      // Client pixels to viewBox units. The SVG scales with its container, so a
      // raw event offset is in the wrong space and picks the wrong segment at
      // every width but one.
      var toSvgY = function (evt) {
        var m = svg.getScreenCTM(); if (!m) return null;
        var pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
        return pt.matrixTransform(m.inverse()).y;
      };
      svg.querySelectorAll('.rhit').forEach(function (r) {
        r.style.cursor = 'default';
        r.addEventListener('mousemove', function (e) {
          var ri = Number(r.getAttribute('data-ri')), i = Number(r.getAttribute('data-di'));
          var d = ds[i], meta = ROWMETA[ri]; if (!d || !meta) return;
          unlight(); dimAll();

          var title = grain === 'day' ? DOW[new Date(d.day + 'T12:00:00Z').getUTCDay()] + ' ' + fmtDay(d.day)
                    : grain === 'week' ? 'Week of ' + fmtDay(d.first)
                    : MONFULL[new Date(d.first + 'T12:00:00Z').getUTCMonth()] + ' ' + d.first.slice(0, 4);
          var h = '<div class="t">' + esc(title) +
                  (i === n - 1 ? ' <span style="color:var(--dim)">· so far</span>' : '') + '</div>';

          if (!meta.ok(i)) {
            h += '<div class="sub">' + esc(meta.l) + ' — ' + esc(meta.absent || 'not available') + '</div>';
            tip.innerHTML = h; place(e); return;
          }

          // Nearest cell wins, so a two-pixel sliver stays reachable rather than
          // being technically present and impossible to point at.
          var parts = (SEGS[ri] && SEGS[ri][i]) || [];
          var y = toSvgY(e), hit = null;
          if (y != null && parts.length) {
            for (var k = 0; k < parts.length; k++) {
              if (y >= parts[k].top - 1 && y <= parts[k].bot + 1) { hit = parts[k]; break; }
            }
            if (!hit) {
              var best = Infinity;
              parts.forEach(function (pp) {
                var dist = y < pp.top ? pp.top - y : (y > pp.bot ? y - pp.bot : 0);
                if (dist < best) { best = dist; hit = pp; }
              });
            }
          }
          var total = meta.get(d);
          if (hit) {
            var idx = parts.indexOf(hit);
            svg.querySelectorAll('.sg[data-sg^="' + ri + '-' + i + '-"]').forEach(function (e2) {
              e2.classList.add(Number(e2.getAttribute('data-sg').split('-')[2]) === idx ? 'on' : 'off');
            });
            h += '<div class="sub" style="color:' + hit.c + '">' + esc(meta.l) + ' · ' + esc(hit.l || '') + '</div>' +
                 '<div class="lead">' + fmtv(meta.unit, hit.v) + '</div>';
            if (parts.length > 1 && total) {
              h += '<div class="sub">' + Math.round(100 * hit.v / total) + '% of ' + fmtv(meta.unit, total) + '</div>';
            }
          } else {
            h += '<div class="sub">' + esc(meta.l) + '</div><div class="lead">' + fmtv(meta.unit, total) + '</div>';
          }
          var dl = delta(i, meta.get, meta.ok);
          if (dl) h += '<div class="sub">' + dl + ' vs the prior 7</div>';
          if (ri === 3 && d.msgDays != null && d.dayCount && d.msgDays < d.dayCount) {
            h += '<div class="sub" style="color:var(--muted)">covers ' + d.msgDays + ' of ' + d.dayCount + ' days</div>';
          }
          // Audience Network is a fault state, not a category, so its warning
          // follows the reader into the Ad and Audience cuts, where the placement
          // split is not on screen to be noticed.
          if (ri === 0 && d.spend > 0) {
            // What the spend bought, in the terms this account actually sells in.
            // This used to read "Meta counted N clicks · X% reached the site",
            // which was meaningless twice over: the numerator counted sessions
            // from every source including organic, the denominator counted every
            // click including profile taps, and since the only live ad is
            // click-to-WhatsApp its clicks are not supposed to reach the site at
            // all. Clicks against conversations started is the funnel that exists.
            if (d.metaClicks) {
              h += '<div class="sub">' + num(d.metaClicks) + ' clicks · ' +
                   num(d.metaConvos || 0) + ' conversation' + ((d.metaConvos || 0) === 1 ? '' : 's') +
                   (d.metaConvos ? ' · ' + kes(Math.round(d.spend / d.metaConvos)) + ' each' : '') + '</div>';
            }
            var anp = Math.round(100 * ((foldPlacement(d.placement).audience_network) || 0) / d.spend);
            if (anp >= 15) h += '<div class="sub" style="color:var(--warning)">⚠ ' + anp + '% went to Audience Network</div>';
          }
          tip.innerHTML = h; place(e);
        });
        r.addEventListener('mouseleave', function () { dimAll(); tip.style.opacity = 0; });
      });
    }

    function trendHover() {
      var svg = document.getElementById('trendsvg'); if (!svg) return;
      var cs = (D.cohorts || []).slice(-12), tip = document.getElementById('tip');
      svg.querySelectorAll('.hit').forEach(function (r) {
        r.style.cursor = 'default';
        r.addEventListener('mousemove', function (e) {
          var c = cs[Number(r.getAttribute('data-i'))]; if (!c) return;
          tip.innerHTML = '<div class="t">' + esc(c.month) + '</div>' +
            '<div class="r"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--s1);margin-right:6px"></i>Conversations</span><span>' + num(c.conversation) + '</span></div>' +
            '<div class="r"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--s2);margin-right:6px"></i>Sales</span><span>' + num(c.sale) + '</span></div>' +
            (c.revenue ? '<div class="r"><span>Revenue</span><span>' + kes(c.revenue) + '</span></div>' : '') +
            (c.arrive ? '<div class="r"><span>Tracked arrivals</span><span>' + num(c.arrive) + '</span></div>' : '');
          tip.style.opacity = 1;
          var x = e.clientX + 14, y = e.clientY - 10;
          if (x + 210 > window.innerWidth) x = e.clientX - 210;
          tip.style.left = x + 'px'; tip.style.top = y + 'px';
        });
        r.addEventListener('mouseleave', function () { tip.style.opacity = 0; });
      });
    }
  })();
  </script>
</body>
</html>
