<script type="text/babel">
const {useState,useRef,useCallback,useEffect,useMemo} = React;

// ─── UTILITIES ──────────────────────────────────────────────────────────────
const pick=a=>a[Math.floor(Math.random()*a.length)];
const pickN=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,Math.min(n,a.length));
const optionIds=(key,exclude=["auto"])=>CONFIG[key].map(o=>o.id).filter(id=>!exclude.includes(id));
function getOpts(p){return CONFIG[p.cfgKey]||[];}
function parseJsonObject(text){
  const cleaned=String(text||"").replace(/```json\s*/g,"").replace(/```\s*/g,"").trim();
  const start=cleaned.indexOf("{"),end=cleaned.lastIndexOf("}");
  if(start<0||end<start)throw new Error("No JSON object returned");
  return JSON.parse(cleaned.slice(start,end+1));
}

function resize(file,max){return new Promise(r=>{const i=new Image();i.onload=()=>{let{width:w,height:h}=i;if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(i,0,0,w,h);const d=c.toDataURL("image/jpeg",.85);URL.revokeObjectURL(i.src);r({base64:d.split(",")[1],width:w,height:h,dataUrl:d})};i.src=URL.createObjectURL(file)})}
function resizeDataUrl(du,max){return new Promise(r=>{const i=new Image();i.onload=()=>{let{width:w,height:h}=i;if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(i,0,0,w,h);const d=c.toDataURL("image/jpeg",.85);r({base64:d.split(",")[1],width:w,height:h,dataUrl:d})};i.src=du})}
function cropImg(du,rect){return new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");const sx=Math.round(rect.x*i.naturalWidth),sy=Math.round(rect.y*i.naturalHeight),sw=Math.round(rect.w*i.naturalWidth),sh=Math.round(rect.h*i.naturalHeight);c.width=sw;c.height=sh;c.getContext("2d").drawImage(i,sx,sy,sw,sh,0,0,sw,sh);const d=c.toDataURL("image/jpeg",.9);r({base64:d.split(",")[1],width:sw,height:sh,dataUrl:d})};i.src=du})}
const fmtBytes=n=>n>1_000_000?`${(n/1_000_000).toFixed(2)} MB`:n>1_000?`${(n/1_000).toFixed(1)} KB`:`${n} B`;
const safeMsg=e=>String(e?.message||e||"Unknown error").replace(/\s+/g," ").slice(0,500);
const logStep=(logger,type,msg)=>{if(typeof logger==="function")logger(type,msg)};
function dataUrlMime(dataUrl){return String(dataUrl||"").match(/^data:([^;,]+)[;,]/)?.[1]||null}
const AIRTABLE_IMAGE_MAX_BYTES=4.2*1024*1024;
function base64ToBlob(base64,mimeType="image/jpeg"){
  const binary=atob(base64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return new Blob([bytes],{type:mimeType});
}
function cleanDownloadName(name,fallback="framework-scene.jpg"){
  return String(name||fallback).split(/[\\/]/).pop().replace(/[^\w .()@+-]+/g,"-").slice(0,120)||fallback;
}
function jpegName(name,fallback="framework-scene.jpg"){
  return cleanDownloadName(name,fallback).replace(/\.[^.]*$/,"")+".jpg";
}
function newSubmissionId(){
  const bytes=new Uint8Array(12);
  crypto.getRandomValues(bytes);
  return `ss_${Date.now().toString(36)}_${[...bytes].map(b=>b.toString(36).padStart(2,"0")).join("").slice(0,18)}`;
}
function sourceMetaFromFilename(filename){
  const N=window.FrameworkNames;
  const strict=N?.parse?.(filename||"");
  const loose=strict||N?.parseLoose?.(filename||"");
  return {
    filename:filename||"",
    designCode:loose?.code||null,
    isBlenderRender:strict?.stage==="render"
  };
}
const AIRTABLE_IMAGE_TARGET_BYTES=4*1024*1024;
function imageBlobForAirtable(img,filename){
  return new Promise((resolve,reject)=>{
    if(!img?.dataUrl)return reject(new Error("No image to upload."));
    const image=new Image();
    image.onload=async()=>{
      const render=async(scale,quality)=>{
        const w=Math.max(1,Math.round(image.naturalWidth*scale));
        const h=Math.max(1,Math.round(image.naturalHeight*scale));
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(image,0,0,w,h);
        const blob=await new Promise(res=>canvas.toBlob(res,"image/jpeg",quality));
        return blob?{blob,filename:jpegName(filename),width:w,height:h,quality,scale}:null;
      };
      const scales=[1,.96,.92,.88,.84,.8,.76,.72,.68,.64,.6,.55,.5,.45,.4];
      for(const scale of scales){
        const lowProbe=await render(scale,.82);
        if(!lowProbe||lowProbe.blob.size>AIRTABLE_IMAGE_TARGET_BYTES)continue;
        let best=lowProbe,lo=.82,hi=.98;
        for(let step=0;step<8;step++){
          const q=(lo+hi)/2;
          const candidate=await render(scale,q);
          if(candidate&&candidate.blob.size<=AIRTABLE_IMAGE_TARGET_BYTES){
            best=candidate;lo=q;
          }else hi=q;
        }
        if(best.blob.size<=AIRTABLE_IMAGE_TARGET_BYTES){
          resolve(best);
          return;
        }
      }
      reject(new Error("That image is still too large for Airtable after compression."));
    };
    image.onerror=()=>reject(new Error("Could not prepare image for Airtable."));
    image.src=img.dataUrl;
  });
}
function dataUrlBlobForAirtable(img,filename){
  const mime=img?.mimeType||dataUrlMime(img?.dataUrl)||"image/jpeg";
  const base64=img?.base64||String(img?.dataUrl||"").split(",")[1]||"";
  if(!base64)return null;
  const blob=base64ToBlob(base64,mime);
  return blob.size<=AIRTABLE_IMAGE_MAX_BYTES
    ?{blob,filename:cleanDownloadName(filename),width:img?.width||0,height:img?.height||0}
    :null;
}
async function bestBlobForAirtable(img,filename,originalFile=null){
  if(originalFile?.size&&originalFile.size<=AIRTABLE_IMAGE_MAX_BYTES&&/^image\/(jpeg|jpg|png|webp)$/i.test(originalFile.type||"")){
    return {blob:originalFile,filename:cleanDownloadName(originalFile.name||filename),width:img?.width||0,height:img?.height||0};
  }
  return dataUrlBlobForAirtable(img,filename)||await imageBlobForAirtable(img,filename);
}
function openAIImageSize(aspect,model){
  if(aspect==="1:1")return"1024x1024";
  if(aspect==="4:5"||aspect==="9:16")return"1024x1536";
  return"1536x1024";
}
function targetOutputSize(provider,aspect){
  if(provider==="openai"){
    const [width,height]=openAIImageSize(aspect,"gpt-image-2").split("x").map(Number);
    return {width,height,label:`${width}x${height}`};
  }
  const ratios={"1:1":[1,1],"4:5":[4,5],"9:16":[9,16],"16:9":[16,9],"4:3":[4,3]};
  const [rw,rh]=ratios[aspect]||ratios["4:3"];
  const scale=2048/Math.max(rw,rh);
  const width=Math.round(rw*scale),height=Math.round(rh*scale);
  return {width,height,label:`${width}x${height}`};
}
function upscaleInfo(img,provider,aspect){
  const target=targetOutputSize(provider,aspect);
  const needed=(img?.width||0)<target.width||(img?.height||0)<target.height;
  return {needed,width:img?.width||0,height:img?.height||0,targetWidth:target.width,targetHeight:target.height,targetLabel:target.label,mode:needed?"with-refine":null};
}
function geminiGenerationConfig(model,options={}){
  const image={aspectRatio:options.aspect||"4:3"};
  if(model==="gemini-3-pro-image-preview"||model==="gemini-3.1-flash-image-preview")image.imageSize=options.imageSize||"2K";
  return {
    responseModalities:["TEXT","IMAGE"],
    imageConfig:image
  };
}
function shouldTryNextOpenAI(error){
  const retryStatuses=new Set([400,404,408,409,429,500,502,503,504]);
  if(retryStatuses.has(error?.status)){
    return /model|not found|does not exist|unsupported|invalid|rate|limit|busy|overload|capacity|timeout|deadline|unavailable/i.test(shortErr(error));
  }
  return /model|not found|does not exist|unsupported|rate|limit|busy|overload|capacity|timeout|deadline|unavailable/i.test(shortErr(error));
}
async function fetchWithContext(url,options,label){
  // Everything this page asks of /api goes through the gate, which attaches the
  // access key as a header. The endpoints hold the provider key and spend real
  // money, so they refuse anything without it.
  const send=String(url).startsWith("/api/")?window.FrameworkGate.fetch:fetch;
  try{return await send(url,options)}
  catch(error){
    const err=new Error(`${label}: network request failed (${safeMsg(error)}). The browser could not complete this request; check connection, function timeout, or CORS/provider availability.`);
    err.originalError=error;
    throw err;
  }
}

async function callOpenAIText(key,model,input,logger){
  logStep(logger,"debug",`OpenAI text request: ${model}`);
  const content = Array.isArray(input)
    ? input.map(part => part.inlineData
      ? {type:"input_image",image_url:`data:${part.inlineData.mimeType};base64,${part.inlineData.data}`}
      : {type:"input_text",text:part.text || ""})
    : [{type:"input_text",text:String(input || "")}];

  const r = await fetchWithContext(`${OPENAI_API}/responses`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":`Bearer ${key}`
    },
    body:JSON.stringify({
      model,
      input:[{role:"user",content}]
    })
  },`OpenAI text request (${model})`);

  if(!r.ok){
    const e = await r.text();
    throw new Error(`API ${r.status}: ${e.substring(0,500)}`);
  }

  return r.json();
}


async function callOpenAIImageApi(key,model,prompt,imageBase64=null,logger,imageBase64s=null,options={}){
  const images=(Array.isArray(imageBase64s)&&imageBase64s.length?imageBase64s:[imageBase64]).filter(Boolean);
  const size=openAIImageSize(options.aspect,model);
  const quality=options.quality||"high";
  const outputFormat=options.outputFormat||"jpeg";
  logStep(logger,"debug",`OpenAI ${model} image edit: prompt ${prompt.length} chars, ${size}, ${quality}${images.length?`, ${images.length} image(s) ${fmtBytes(images.reduce((sum,img)=>sum+img.length*.75,0))}`:""}`);

  let r;
  if(images.length){
    const form=new FormData();
    form.append("model",model);
    form.append("prompt",prompt);
    form.append("size",size);
    form.append("quality",quality);
    form.append("output_format",outputFormat);
    if(model!=="gpt-image-2")form.append("input_fidelity","high");
    images.forEach((img,i)=>{
      const mime=options.imageMimeTypes?.[i]||"image/jpeg";
      const ext=mime.includes("png")?"png":"jpg";
      form.append("image[]",base64ToBlob(img,mime),`reference-${i+1}.${ext}`);
    });
    r = await fetchWithContext(`${OPENAI_API}/images/edits`,{
      method:"POST",
      headers:{"Authorization":`Bearer ${key}`},
      body:form
    },`OpenAI ${model} image edit`);
  }else{
    r = await fetchWithContext(`${OPENAI_API}/images/generations`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":`Bearer ${key}`
      },
      body:JSON.stringify({model,prompt,size,quality,output_format:outputFormat})
    },`OpenAI ${model} image generation`);
  }

  if(!r.ok){
    const e = await r.text();
    const err=new Error(`OpenAI ${model} ${r.status}: ${e.substring(0,500)}`);
    err.status=r.status;
    err.model=model;
    throw err;
  }

  return r.json();
}

async function callGemini(key,model,contents,wantImg=false,logger,options={}){
  logStep(logger,"debug",`Gemini ${wantImg?"image":"text"} request: ${model}`);
  const u=`${GEMINI_API_BASE}/${model}:generateContent?key=${key}`;
  const b={contents,generationConfig:{}};
  if(wantImg)b.generationConfig=geminiGenerationConfig(model,options);
  const timeoutMs=wantImg?GEMINI_IMAGE_TIMEOUT_MS:GEMINI_TEXT_TIMEOUT_MS;
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),timeoutMs);
  let r;
  try{
    r=await fetchWithContext(u,{method:"POST",headers:{"Content-Type":"application/json"},signal:controller.signal,body:JSON.stringify(b)},`Gemini ${model} ${wantImg?"image":"text"} request`);
  }catch(error){
    const err=new Error(`Gemini ${model} ${wantImg?"image":"text"} request failed: ${error?.originalError?.name==="AbortError"?`timed out after ${Math.round(timeoutMs/1000)}s`:safeMsg(error)}`);
    err.status=error?.originalError?.name==="AbortError"?504:503;
    err.model=model;
    throw err;
  }finally{
    clearTimeout(timeout);
  }
  if(!r.ok){
    const body=await r.text();
    const err=new Error(`Gemini ${model} ${r.status}: ${body.substring(0,500)}`);
    err.status=r.status;
    err.model=model;
    throw err;
  }
  return r.json();
}

function modelCandidates(cfg,listKey,singleKey){
  const list=Array.isArray(cfg?.[listKey])?cfg[listKey].filter(Boolean):[];
  if(list.length)return list;
  return cfg?.[singleKey]?[cfg[singleKey]]:[];
}
function shortErr(error){return safeMsg(error).slice(0,220)}
function shouldTryNextGemini(error){
  const retryStatuses=new Set([404,408,409,429,500,502,503,504]);
  if(retryStatuses.has(error?.status))return true;
  return /fetch failed|network|overloaded|busy|capacity|unavailable|resource_exhausted|deadline|timeout|timed out|not found|model/i.test(shortErr(error));
}
async function callGeminiImageWithFallback(key,cfg,contents,logger,options={}){
  const models=modelCandidates(cfg,"generateModels","generateModel");
  const errors=[];
  for(let i=0;i<models.length;i++){
    const model=models[i];
    try{
      logStep(logger,"info",`Gemini image model ${i+1}/${models.length}: ${model}`);
      const modelOptions={...options,imageSize:model==="gemini-2.5-flash-image"?null:(options.imageSize||"2K")};
      const resp=await callGemini(key,model,contents,true,logger,modelOptions);
      const res=extract(resp);
      if(!res.images.length){
        const err=new Error(`No image from ${model}: ${res.text||res.finish||"empty response"}`);
        err.status=502;
        throw err;
      }
      logStep(logger,"success",`Gemini image model succeeded: ${model}${i>0?" (fallback)":""}`);
      return {...res,modelUsed:model,fallbackUsed:i>0,fallbackErrors:i>0?[...errors]:[]};
    }catch(error){
      errors.push(`${model}: ${shortErr(error)}`);
      logStep(logger,i===models.length-1||!shouldTryNextGemini(error)?"error":"info",`Gemini ${model} failed: ${shortErr(error)}${i<models.length-1&&shouldTryNextGemini(error)?" — trying fallback":""}`);
      if(i===models.length-1||!shouldTryNextGemini(error)){
        throw new Error(errors.length>1?`Gemini fallback failed: ${errors.join(" | ")}`:shortErr(error));
      }
    }
  }
  throw new Error("No Gemini image models configured");
}
async function callGeminiTextWithFallback(key,cfg,contents,logger){
  const models=modelCandidates(cfg,"validateModels","validateModel");
  const errors=[];
  for(let i=0;i<models.length;i++){
    const model=models[i];
    try{
      logStep(logger,"debug",`Gemini text model ${i+1}/${models.length}: ${model}`);
      const res=extract(await callGemini(key,model,contents,false,logger));
      return {...res,modelUsed:model,fallbackUsed:i>0,fallbackErrors:i>0?[...errors]:[]};
    }catch(error){
      errors.push(`${model}: ${shortErr(error)}`);
      logStep(logger,i===models.length-1||!shouldTryNextGemini(error)?"error":"info",`Gemini text ${model} failed: ${shortErr(error)}${i<models.length-1&&shouldTryNextGemini(error)?" — trying fallback":""}`);
      if(i===models.length-1||!shouldTryNextGemini(error)){
        throw new Error(errors.length>1?`Gemini text fallback failed: ${errors.join(" | ")}`:shortErr(error));
      }
    }
  }
  throw new Error("No Gemini text models configured");
}
async function callOpenAIImageWithFallback(key,cfg,prompt,imageBase64,logger,imageBase64s=null,options={}){
  const models=modelCandidates(cfg,"imageModels","generateModel");
  const errors=[];
  for(let i=0;i<models.length;i++){
    const model=models[i];
    try{
      logStep(logger,"info",`OpenAI image model ${i+1}/${models.length}: ${model}`);

      logStep(logger,"success",`OpenAI image model succeeded: ${model}${i>0?" (fallback)":""}`);
      return {...res,modelUsed:model,fallbackUsed:i>0,fallbackErrors:i>0?[...errors]:[]};
    }catch(error){
      errors.push(`${model}: ${shortErr(error)}`);
      logStep(logger,i===models.length-1||!shouldTryNextOpenAI(error)?"error":"info",`OpenAI ${model} failed: ${shortErr(error)}${i<models.length-1&&shouldTryNextOpenAI(error)?" — trying fallback":""}`);
      if(i===models.length-1||!shouldTryNextOpenAI(error)){
        throw new Error(errors.length>1?`OpenAI image fallback failed: ${errors.join(" | ")}`:shortErr(error));
      }
    }
  }
  throw new Error("No OpenAI image models configured");
}

const wait=ms=>new Promise(r=>setTimeout(r,ms));
function makeJobId(){return `job_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,12)}`}
async function startImageJob(provider,prompt,imageBase64,geminiContents,logger,imageBase64s=null,onJobStart=null,openaiOptions=null,geminiOptions=null){
  const jobId=makeJobId();
  const payload={jobId,action:"image",provider,prompt};
  if(provider==="openai"){
    payload.imageBase64=imageBase64;
    if(Array.isArray(imageBase64s)&&imageBase64s.length)payload.imageBase64s=imageBase64s;
    if(openaiOptions)payload.openaiOptions=openaiOptions;
  }
  else{
    payload.geminiContents=geminiContents;
    if(geminiOptions)payload.geminiOptions=geminiOptions;
  }
  const requestBody=JSON.stringify(payload);
  logStep(logger,"info",`Starting Netlify background job ${jobId} (${fmtBytes(requestBody.length)} request)`);
  if(requestBody.length>5_500_000)throw new Error(`Background job request is too large (${(requestBody.length/1_000_000).toFixed(1)} MB). Try a smaller reference crop or browser API key.`);
  const r=await fetchWithContext("/api/ai-start",{method:"POST",headers:{"Content-Type":"application/json"},body:requestBody},"Netlify ai-start");
  if(![200,202].includes(r.status)){
    const raw=await r.text();
    throw new Error(`Could not start background job (${r.status}): ${raw.slice(0,220)}`);
  }
  logStep(logger,"success",`Background job queued: ${jobId}`);
  if(typeof onJobStart==="function")onJobStart(jobId);
  return jobId;
}
async function pollImageJob(jobId,logger){
  const started=Date.now();
  let interval=1800;
  let lastState="";
  let lastHeartbeat=0;
  let pollFailures=0;
  while(Date.now()-started<14*60*1000){
    await wait(interval);
    interval=Math.min(4500,interval+350);
    let r;
    try{
      r=await fetchWithContext(`/api/ai-result?id=${encodeURIComponent(jobId)}&t=${Date.now()}`,{headers:{"Accept":"application/json"}},`Netlify ai-result poll (${jobId})`);
      pollFailures=0;
    }catch(error){
      pollFailures+=1;
      logStep(logger,pollFailures>=8?"error":"info",`Poll ${pollFailures}/8 failed after ${Math.round((Date.now()-started)/1000)}s: ${safeMsg(error)}`);
      if(pollFailures>=8){
        const err=new Error(`Lost connection while checking background job ${jobId}. The job may still finish on Netlify; use Resume job instead of starting over.`);
        err.originalError=error;
        err.jobId=jobId;
        throw err;
      }
      continue;
    }
    const raw=await r.text();
    let body;
    try{body=JSON.parse(raw)}catch{throw new Error(`Job poll ${r.status} non-JSON: ${raw.slice(0,220)}`)}
    const elapsed=Math.round((Date.now()-started)/1000);
    if(body.state!==lastState){
      lastState=body.state;
      logStep(logger,"info",`Background job ${jobId}: ${body.state}${elapsed?` after ${elapsed}s`:""}`);
    }else if(elapsed-lastHeartbeat>=20){
      lastHeartbeat=elapsed;
      logStep(logger,"debug",`Still ${body.state||"waiting"} (${elapsed}s elapsed)`);
    }
    if(body.state==="pending"||body.state==="queued"||body.state==="processing")continue;
    if(body.state==="error")throw new Error(`Background generation failed (${jobId}): ${body.error||"Unknown error"}`);
    if(body.state==="done"){
      const result=body.result||{};
      if(result.images)result.images=await Promise.all(result.images.map(async img=>{
        if(img.dataUrl||img.base64){
          logStep(logger,"success",`Generated image returned inline (${fmtBytes((img.base64||"").length*0.75)}, ${img.mimeType||"image/png"})`);
          return {...img,dataUrl:img.dataUrl||`data:${img.mimeType||"image/png"};base64,${img.base64}`};
        }
        if(img.url){
          logStep(logger,"info",`Downloading generated image for ${jobId}`);
          let downloadedImage;
          for(let attempt=1;attempt<=5;attempt++){
            try{
              const imageResponse=await fetchWithContext(`${img.url}${img.url.includes("?")?"&":"?"}t=${Date.now()}`,undefined,`Generated image download (${jobId})`);
              if(!imageResponse.ok)throw new Error(`Generated image fetch failed (${imageResponse.status})`);
              const blob=await imageResponse.blob();
              const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob)});
              logStep(logger,"success",`Generated image downloaded (${fmtBytes(blob.size)}, ${blob.type||img.mimeType||"image/png"})`);
              downloadedImage={...img,mimeType:blob.type||img.mimeType||"image/png",dataUrl,base64:String(dataUrl).split(",")[1]};
              break;
            }catch(error){
              logStep(logger,attempt===5?"error":"info",`Generated image download/read attempt ${attempt}/5 failed: ${safeMsg(error)}`);
              if(attempt===5)throw error;
              await wait(1000*attempt);
            }
          }
          return downloadedImage;
        }
        return img;
      }));
      logStep(logger,"success",`Background job complete: ${result.images?.length||0} image(s)`);
      return result;
    }
  }
  throw new Error("Background generation did not finish within 14 minutes");
}

async function callProviderImage(provider,key,prompt,imageBase64,geminiContents,logger,imageBase64s=null,onJobStart=null,openaiOptions=null,geminiOptions=null){

async function callProviderText(provider,key,partsOrText,logger){
  const cfg=PROVIDERS[provider];
  if(!key){
    const normalizedParts=Array.isArray(partsOrText)?partsOrText:[{text:String(partsOrText||"")}];
    const requestBody=JSON.stringify({action:"text",provider,partsOrText:normalizedParts});
    logStep(logger,"debug",`${cfg.label} text via Netlify (${fmtBytes(requestBody.length)} request)`);
    const r=await fetchWithContext("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:requestBody},"Netlify ai text");
    const raw=await r.text();
    let parsed;
    try{parsed=JSON.parse(raw)}catch{const trimmed=raw.trim();throw new Error(trimmed?`Function ${r.status} non-JSON: ${trimmed.slice(0,220)}`:"Function ended before returning JSON. Netlify likely timed out during image generation; try again, or enter a browser API key for this run.")}
    if(!r.ok||parsed.status>=400)throw new Error(parsed.error||`Function ${parsed.status||r.status}`);
    return parsed;
  }
  if(provider==="openai"){
    return extractOpenAIText(await callOpenAIText(key,cfg.validateModel,partsOrText,logger));
  }
  const contents=Array.isArray(partsOrText)?[{parts:partsOrText}]:[{parts:[{text:String(partsOrText||"")}]}];
  return callGeminiTextWithFallback(key,cfg,contents,logger);
}

/**
 * The scale record out of a saved session, old shape or new.
 *
 * Sessions written before the flow moved into js/studio/scale.js carry six loose
 * fields instead of one record. They are still on people's machines and in saved
 * .json files, so they are read rather than dropped — a restore that silently
 * loses the scale is worse than the migration.
 */
function scaleFromSession(saved){
  if(!saved)return FrameworkScale.UNSET;
  if(saved.status)return saved;
  if(!saved.scaleOK)return FrameworkScale.UNSET;
  return {status:"set",shelfH:saved.shelfH??null,pxCm:saved.pxCm??null,
    expandFrame:Boolean(saved.expandF),fx:saved.scaleFx??null,fy:saved.scaleFy??null,
    expandedSide:null,offsetX:0};
}

// Compute diff between two param sets
function paramDiff(base,curr){
  const d={};
  for(const p of PARAMS){
    const k=p.id,bv=base[k],cv=curr[k];
    if(p.type==="multi"){
      const bs=new Set(bv||[]),cs=new Set(cv||[]);
      if(bs.size!==cs.size||[...cs].some(x=>!bs.has(x))) d[k]={from:bv,to:cv};
    } else if(bv!==cv) d[k]={from:bv,to:cv};
  }
  if((base.customNotes||"")!==(curr.customNotes||"")) d.customNotes={from:base.customNotes,to:curr.customNotes};
  if(base.aspect!==curr.aspect) d.aspect={from:base.aspect,to:curr.aspect};
  return Object.keys(d).length?d:null;
}

  // The design code arrives in the filename of whatever is dropped in -- a

  // generated from it inherits it, so a scene that ends up in a chat still says
  // which shelf it is of. Nothing else carries that: the node tree knows the
  // lineage, and the node tree does not leave this page.
  const acceptBaseImage=async f=>{
    if(!f)return;
    if(!/^image\//.test(f.type||"")){addLog("error",`${f.name||"That file"} is not an image.`);return;}
    try{
      const img=await resize(f,Math.max(MAX_DIM,UPLOAD_MAX_DIM));
      const meta=sourceMetaFromFilename(f.name||"");
      setPendingUpload({img,name:f.name||"uploaded image",meta,file:f,ts:Date.now()});
      setDesignCode(meta.designCode||null);
      clearReview();
      addLog("info",`Base image uploaded: ${img.width}×${img.height}`);
      if(meta.designCode)addLog("success",`Design code ${meta.designCode} — generated images will carry it.${meta.isBlenderRender?" Source will be flagged as a Blender render.":""}`);
      else addLog("info",`No design code in "${f.name||"that file"}" — type one in the header, or re-download the render from the console, which names it fw-<CODE>-r-….png`);
    }catch(err){addLog("error",safeMsg(err));}
  };
  const handleBaseUpload=async e=>{
    await acceptBaseImage(e.target.files[0]);
    e.target.value="";
  };
  const usePendingAsSource=()=>{
    if(!pendingUpload?.img)return;
    const r=pendingUpload.img;
    setSourceMeta(pendingUpload.meta||null);
    setSourceOriginalFile(pendingUpload.file||null);
    setRefImage(r);
    setScale(FrameworkScale.UNSET);setAugImg(null);
    const refNode={id:"ref",type:"ref",parentId:null,img:r,params:null,history:null,ts:Date.now()};
    setNodes([refNode]);setSelId("ref");setBaseParams(null);setMode("refine");
    setRefAdj({...DEFAULT_REFINE});setRefineFB("");setPromptEditorOpen(false);setPromptEditorContext(null);setPendingUpload(null);
    addLog("success",`Source product photo set: ${r.width}×${r.height}`);
  };
  const usePendingAsRefine=()=>{
    if(!pendingUpload?.img)return;
    const r=pendingUpload.img;
    const gp=normalizeParams(params);
    const parentId=refImage?(genSource?.id||"ref"):"ref";
    const upscale=upscaleInfo(r,provider,gp.aspect);
    const genNode={id:mkId(),type:"gen",parentId,img:r,params:{...gp},history:null,source:"uploaded-refine",upscale,ts:Date.now()};
    if(refImage){
      setNodes(p=>[...p,genNode]);
    }else{
      setRefImage(r);
      setSourceMeta(pendingUpload.meta||null);
      setSourceOriginalFile(pendingUpload.file||null);
      setScale(FrameworkScale.UNSET);setAugImg(null);
      const refNode={id:"ref",type:"ref",parentId:null,img:r,params:null,history:null,ts:Date.now()};
      setNodes([refNode,genNode]);
    }
    setSelId(genNode.id);
    setParams(gp);
    setBaseParams(gp);
    setMode("refine");
    setRefAdj({...DEFAULT_REFINE});
    setRefineFB("");
    setPromptEditorOpen(false);setPromptEditorContext(null);
    setPendingUpload(null);
    clearReview();
    addLog("success",`Existing image ready to refine: ${r.width}×${r.height}${upscale.needed?` — below ${upscale.targetLabel}, upscale queued`:""}`);
  };

  // ─── Scale ─────────────────────────────────────────────────────
  // The measuring, the figure and the drag are FrameworkScale's. All this page
  // adds is where the result goes: the composited reference becomes the
  // `ref-scale` node, so it appears in the pipeline like any other image and is
  // what a generation reads instead of the bare reference.
  const scaleTool=FrameworkScale.useScaleTool({
    targetId:refImage?"ref":null,
    image:refImage,
    scale,
    imgRef,
    log:addLog,
    onPlaced:(record,composited)=>{
      setScale(record);
      setAugImg(composited);
      setNodes(p=>[...p.filter(n=>n.id!=="ref-scale"),{
        id:"ref-scale",type:"ref-scale",parentId:"ref",
        img:{dataUrl:composited.dataUrl,base64:composited.base64,width:composited.width,height:composited.height},
        params:null,history:null,ts:Date.now()
      }]);
      setSelId("ref-scale");
    },
    onReset:()=>{
      setScale(FrameworkScale.UNSET);
      setAugImg(null);
      setNodes(p=>p.filter(n=>n.id!=="ref-scale"));
      if(selId==="ref-scale")setSelId("ref");
    }
  });

  // ─── Prompt ────────────────────────────────────────────────────
  const buildPrompt=(p)=>{
    const gp=(k,id)=>id==="auto"?"":CONFIG[k]?.find(o=>o.id===id)?.prompt||"";
    const camP=gp("camera",p.camera),frmP=gp("framing",p.framing),litP=gp("light",p.light);
    let photo="";if(camP)photo+=camP+"\n";if(frmP)photo+=frmP+"\n";if(litP)photo+=litP+"\n";
    let scaleLine="";
    if(FrameworkScale.isSet(scale)){const h=scale.shelfH;let rel=h<80?"desk height":h<120?"chest height":h<160?"shoulder height":"taller than most adults";
      scaleLine=`\nSCALE: Shelf is EXACTLY ${h}cm tall (${rel}).${FrameworkScale.figureNote(scale)}`;}
    let notes="";if(p.customNotes?.trim())notes=`\nADDITIONAL NOTES: ${p.customNotes.trim()}`;
    const productTruth=`${CONFIG.referenceRolePrompt}\n\n${CONFIG.preservationPrompt}`;

    if(p.shotType==="clean"){
      const bg=CONFIG.productBackgrounds.find(o=>o.id===p.productBackground)?.prompt||CONFIG.productBackgrounds[0]?.prompt||"A simple neutral background.";
      return `You are a professional product photographer creating product imagery for Framework Designs, a modular steel shelving company in Nairobi, Kenya.\n\nTASK: Using the attached reference photo, generate a CLEAN PRODUCT SHOT of this EXACT shelf.\n\n${productTruth}\n\nBACKGROUND: ${bg}\n\nSHELF CONTENTS: Keep the shelf empty unless objects are already present in the reference photo. Do not add lifestyle props.\n\n${CONFIG.negativePrompt}\n${photo?`\n${photo}`:""}\nAspect ratio: ${p.aspect}.${scaleLine}${notes}`;
    }

    // ── In-use scene: narrative structure. THE PLACE (one coherent paragraph,
    // from an archetype when set) → THE SHELF IN THE PLACE → THE PHOTOGRAPH
    // (explicitly overrides mood implied by the place) → AUTHENTICITY →
    // PHOTOGRAPHIC FLOOR → constraints. A described *place* beats a checklist.
    const scn=CONFIG.scenes.find(s=>s.id===p.scene)?.prompt||"";
    const wallP=gp("walls",p.wall),floorP=gp("floors",p.floor),rugP=gp("rugs",p.rug);
    const furnP=gp("furniture",p.furniture),winP=gp("windowView",p.windowView),moodP=gp("colourMood",p.colourMood);
    const per=CONFIG.persona.find(x=>x.id===p.persona);
    const contents=per&&per.contents?per.contents:"items appropriate for the room type";
    const full=CONFIG.fullness.find(x=>x.id===p.fullness)?.prompt||"moderate";
    const lived=CONFIG.livedIn.find(x=>x.id===p.livedIn)?.prompt||"lived-in";
    const dets=(p.details||[]).map(id=>CONFIG.details.find(d=>d.id===id)?.prompt).filter(Boolean).map(s=>"- "+s).join("\n");
    const traces=(p.humanTraces||[]).map(id=>CONFIG.humanTraces.find(d=>d.id===id)?.prompt).filter(Boolean).map(s=>"- "+s).join("\n");
    const shelfVisibility=["full","packed"].includes(p.fullness)||p.persona!=="auto"
      ?"\nSHELF VISIBILITY: Objects can sit on the shelf, but must not cover, replace, thicken, or redraw the structural tubes, shelf edges, legs, bolt points, or tier gaps."
      :"";

    const arch=(CONFIG.archetypes||[]).find(a=>a.id===p.archetype);
    let placeBlock="";
    if(arch){
      // The archetype narrative is the place; user changes become explicit adjustments.
      const adj=[];
      const adjKeys=[["wall","walls","WALLS"],["floor","floors","FLOOR"],["rug","rugs","RUG"],["furniture","furniture","FURNITURE"],["windowView","windowView","WINDOW VIEW"],["colourMood","colourMood","COLOUR MOOD"]];
      for(const[key,cfgKey,label]of adjKeys){
        if(p[key]!==arch.params[key]&&p[key]!=="auto"){const t=gp(cfgKey,p[key]);if(t)adj.push(`- ${label}: ${t}`);}
      }
      if(p.scene!==arch.params.scene&&scn)adj.push(`- ROOM: ${scn}`);
      placeBlock=`THE PLACE:\n${arch.place}`+(adj.length?`\n\nADJUST THE PLACE AS FOLLOWS (these override the paragraph above):\n${adj.join("\n")}`:"");
    }else{
      let sur="";if(wallP)sur+=`- Walls: ${wallP}\n`;if(floorP)sur+=`- Floor: ${floorP}\n`;if(rugP)sur+=`- Rug: ${rugP}\n`;if(furnP)sur+=`- Furniture: ${furnP}\n`;if(winP)sur+=`- Window view: ${winP}\n`;
      placeBlock=`THE PLACE:\n${scn}.\n${sur}${moodP?moodP+"\n":""}`.trim();
    }
    const shelfBlock=`THE SHELF IN THIS PLACE:\n- The shelf stands against a wall of this room, naturally placed as real furniture.${scaleLine?`\n- ${scaleLine.trim()}`:""}\n- Contents: ${contents}. Fill level: ${full}.\n- Condition of the room: ${lived}.${shelfVisibility}`;

    const photoBlock=`THE PHOTOGRAPH:\n${photo?photo.trim():"Natural, competent photography appropriate to the place."}\n- If the light or mood described here conflicts with the place description above, THIS section wins.`;

    const authBlock=`${CONFIG.nairobiTruthPrompt||""}${dets?`\nGROUNDING DETAILS (include naturally, not as a checklist):\n${dets}`:""}${traces?`\nTRACES OF PEOPLE (subtle, at most as described):\n${traces}`:""}`;

    return `You are a location photographer shooting real interiors for Framework Designs, a modular steel shelving company in Nairobi, Kenya. Your photographs must feel like actual Nairobi spaces that happen to be beautifully shot — never like showroom renders.\n\nTASK: Using the attached reference photo, generate a NEW photorealistic image placing this EXACT shelf in the space described below.\n\n${productTruth}\n\n${placeBlock}\n\n${shelfBlock}\n\n${photoBlock}\n\n${authBlock}\n\n${CONFIG.craftFloorPrompt||""}\n\n${CONFIG.negativePrompt}\n\nAspect ratio: ${p.aspect}.${notes}`;
  };
	  const refineAdjustmentText=(cat,val)=>{
	    if(val===0)return null;
	    const meta=REFINE_CATS.find(c=>c.id===cat);
	    const dir=Math.abs(val)>1?"dramatically":"slightly";
	    const q=val<0?(REFINE_QUAL[cat]?.[val<-1?"n2":"n1"]||REFINE_QUAL[cat]?.n):REFINE_QUAL[cat]?.p;
	    if(!q)return null;
	    const label=(meta?.label||cat).toLowerCase();
	    const sentence=q.length>90?`${dir==="dramatically"?"Strongly":"Subtly"} ${q.charAt(0).toLowerCase()+q.slice(1)}`:`Make ${label} ${dir} ${q}`;
	    return sentence.endsWith(".")?sentence:sentence+".";
	  };
	  const buildRefinePrompt=()=>{
	    const adjs=Object.entries(refAdj).map(([cat,val])=>refineAdjustmentText(cat,val)).filter(Boolean);
	    const productReferenceLine=usesCurrentImageAsProductRef
	      ?"2. Product reference/current image: no separate product reference was provided, so this may duplicate the current image. Use it to preserve the shelf exactly as shown."
	      :"2. Original product reference: use this only as the truth source for the shelf product's geometry, colour, material, scale, and joint details.";
	    let refinePrompt=`Refine the CURRENT IMAGE. This is a surgical edit to the existing image, not a new scene from scratch.\n\nIMAGE ORDER:\n1. Current image: use this as the base image to edit.\n${productReferenceLine}\n\nPRODUCT LOCK:\n- Product fidelity has priority over every requested edit.\n- Do not redraw, redesign, reinterpret, resize, crop, or restage the shelf.\n- Preserve the shelf geometry, proportions, tier count, shelf spacing, frame colour, powder-coat finish, shelf material, scale, and bolt/joint details exactly.\n- If a requested edit might alter the shelf shape, shelves, tubes, legs, proportions, colour, or material, skip that part of the edit.\n- Do not add or remove shelves, brackets, lights, drawers, doors, glass, wood, logos, wall panels, or decorative features.\n- Do not attach any lamp or lighting to the shelf.\n- Do not show open books. Any book lying on a shelf, sofa, table, or floor must be closed.\n- Books must obey simple physics: vertical books need support from a shelf side, a post, bookends, a heavy object, or a horizontal stack; no unsupported freestanding books.\n- Pendant lights should have a simple shade over the bulb. Do not show bare-bulb pendant lights unless the user explicitly asks for one.\n- Keep the current room, camera angle, perspective, crop, and overall setting unless the requested edits explicitly change them.\n- Apply refinements mostly to lighting, background, surrounding room, surface clutter, and photographic finish, while leaving the shelf itself stable.\n- Maintain believable Nairobi/Kenya realism already present in the image.\n`;
	    if(selectedUpscale?.needed&&selectedUpscale.mode){
	      refinePrompt+=`\nUPSCALE REQUIREMENT:\n- The uploaded image is ${selectedUpscale.width}x${selectedUpscale.height}, below the current target output of ${selectedUpscale.targetLabel}.\n- Upscale to the target output resolution for the selected aspect ratio.\n- Reconstruct and sharpen plausible real photographic detail; do not merely enlarge or blur/interpolate pixels.\n- Keep edges, shelf tubes, textural detail, lighting direction, camera angle, crop, and composition natural.\n`;
	      if(selectedUpscale.mode==="only")refinePrompt+=`- This is an upscale-only pass: do not intentionally change styling, objects, composition, colours, lighting, or scene content except what is necessary for high-quality detail restoration.\n`;
	      else refinePrompt+=`- Apply this upscale as part of the requested refinement edits.\n`;
	    }
	    if(adjs.length)refinePrompt+=`\nREQUESTED EDITS:\n${adjs.map(a=>"- "+a).join("\n")}`;
	    if(refineFB.trim())refinePrompt+=`\n\nUSER FEEDBACK:\n${refineFB.trim()}`;
	    refinePrompt+=`\n\nOUTPUT: Return one refined photorealistic image. Make only the requested changes and keep everything else stable.`;
	    return refinePrompt;
	  };
	  const promptForProvider=(prompt,isRefineRun)=>{
	    if(provider==="openai"){
	      const modeText=isRefineRun
	        ?"OPENAI IMAGE EDIT MODE:\n- Edit input image 1 in place. Use input image 2 as the exact shelf product reference when available.\n- If input image 2 duplicates input image 1, preserve the shelf as shown in the current image.\n- Change only the requested refinements; leave product geometry, material, colour, scale, and scene identity stable."
	        :"OPENAI IMAGE EDIT MODE:\n- Use the attached shelf photo as the exact product reference for an image edit/reference workflow.\n- Do not invent a similar shelf from memory. Preserve the reference product before following scene, styling, or photography instructions.";
	      return `${modeText}\n\n${prompt}`;
	    }
	    if(provider==="gemini"){
	      const modeText=isRefineRun
	        ?"GEMINI NATIVE IMAGE EDIT MODE:\n- This is iterative text-and-image-to-image editing. Edit input image 1 in place.\n- Use input image 2 as the high-fidelity product truth for shelf geometry, colour, material, and joints when available.\n- If input image 2 duplicates input image 1, preserve the shelf as shown in the current image.\n- Make small requested changes and keep the product and camera perspective stable."
	        :"GEMINI NATIVE IMAGE COMPOSITION MODE:\n- Use the attached shelf photo as the high-fidelity product reference in a text-and-image-to-image workflow.\n- Preserve the exact shelf before following scene, styling, or photography instructions.\n- Do not create a generic or redesigned shelf.";
	      return `${modeText}\n\n${prompt}`;
	    }
	    return prompt;
	  };
	  const livePrompt=useMemo(()=>buildPrompt(params),[params,scale]);
	  const isLiveRefineRun=isGen&&mode==="refine";
	  const editableRunPrompt=useMemo(()=>{
	    return isLiveRefineRun?buildRefinePrompt():livePrompt;
	  },[livePrompt,isLiveRefineRun,selNode?.id,selNode?.source,usesCurrentImageAsProductRef,selectedUpscale?.needed,selectedUpscale?.mode,selectedUpscale?.targetLabel,refAdj,refineFB]);

  // ─── Generate / Refine ─────────────────────────────────────────
  const handleRun=async(promptOverride="")=>{
    if(!refImage)return;
    const editedPrompt=String(promptOverride||"").trim();
    setProcessing(true);setProcMsg("Generating...");clearReview();
    const runId=Date.now().toString(36).slice(-5).toUpperCase();
    const runLog=(type,msg)=>addLog(type,`#${runId} ${msg}`);
    try{
      const gp={...params};
      let parentId, parentNode, isRefine=false;

      if(isGen&&mode==="refine"){
        // Refine: apply changes to selected image
        parentId=selNode.id; parentNode=selNode; isRefine=true;
      } else if(isGen&&mode==="regenerate"){
        // Regenerate: branch from selected node's parent
        parentId=selNode.parentId; parentNode=nodes.find(n=>n.id===selNode.parentId);
      } else {
        // Fresh generation from ref source
        parentId=genSource?.id; parentNode=genSource;
      }
      if(!parentId){addLog("error","No source node");return}

      const promptModeMatches=!editedPrompt||(
        promptEditorContext?.basePrompt===editableRunPrompt&&(
          (isRefine&&promptEditorContext?.mode==="refine"&&promptEditorContext?.selId===selNode?.id)||
          (!isRefine&&promptEditorContext?.mode==="generate")
        )
      );
      if(!promptModeMatches)throw new Error("Prompt editor is out of date for the current mode or selected image. Reset the prompt editor and try again.");

      const rawPrompt=editedPrompt||(isRefine?buildRefinePrompt():buildPrompt(gp));
      const prompt=promptForProvider(rawPrompt,isRefine);
      runLog("info",`${isRefine?"Refine":"Generate"} start / ${providerCfg.label}`);
      runLog("info",`Prompt: ${prompt.length} chars${editedPrompt?" (edited)":""}; aspect ${gp.aspect}; selected ${selNode?.id||parentId}`);
      setProcMsg("Preparing source image...");
      const sourceImg=isRefine?(croppedImg||parentNode.img):(augImg||refImage);
      const apiImg=!apiKey&&sourceImg?.dataUrl?await resizeDataUrl(sourceImg.dataUrl,SERVER_MAX_DIM):sourceImg;
      runLog("info",`Source image: ${sourceImg?.width||"?"}x${sourceImg?.height||"?"}${apiImg!==sourceImg?` -> API ${apiImg.width}x${apiImg.height}`:""} (${fmtBytes((apiImg.base64||"").length*0.75)})`);
      const productRefImg=isRefine&&refImage?.dataUrl?(!apiKey?await resizeDataUrl(refImage.dataUrl,SERVER_MAX_DIM):refImage):null;
      if(productRefImg)runLog("info",`Product reference lock image: ${productRefImg.width||"?"}x${productRefImg.height||"?"} (${fmtBytes((productRefImg.base64||"").length*0.75)})`);
      const openaiOptions=provider==="openai"?{
        aspect:gp.aspect,
        quality:"high",
        outputFormat:"jpeg",
        imageMimeTypes:[dataUrlMime(apiImg.dataUrl)||"image/jpeg",...(productRefImg?[dataUrlMime(productRefImg.dataUrl)||"image/jpeg"]:[])]
      }:null;
      const geminiOptions=provider==="gemini"?{
        aspect:gp.aspect,
        imageSize:"2K"
      }:null;
      if(openaiOptions)runLog("info",`OpenAI mode: Image API edits / target ${openAIImageSize(gp.aspect,"gpt-image-2")} / ${openaiOptions.quality} quality / ${openaiOptions.outputFormat}`);
      if(geminiOptions)runLog("info",`Gemini mode: native image edit / aspect ${geminiOptions.aspect} / 2K where supported`);
      setProcMsg("Generating — 15-30s...");
      const parts=[{text:prompt},{inlineData:{mimeType:"image/jpeg",data:apiImg.base64}}];
      let contents=[{parts}];
      let finalPrompt=prompt;
      let imageBase64s=[apiImg.base64];

      if(isRefine){
        const refinePrompt=prompt;
        finalPrompt=refinePrompt;
        runLog("info",`Refine prompt: ${refinePrompt.length} chars; crop ${croppedImg?"yes":"no"}; product reference ${productRefImg?"yes":"no"}`);
        const rParts=[
          {text:refinePrompt},
          {text:"CURRENT IMAGE - edit this image in place:"},
          {inlineData:{mimeType:"image/jpeg",data:apiImg.base64}},
        ];
        if(productRefImg){
          rParts.push({text:usesCurrentImageAsProductRef
            ?"PRODUCT REFERENCE / CURRENT IMAGE DUPLICATE - no separate product reference was provided; preserve the shelf exactly as shown:"
            :"ORIGINAL PRODUCT REFERENCE - use only to lock shelf geometry, colour, material, scale, and joints:"});
          rParts.push({inlineData:{mimeType:"image/jpeg",data:productRefImg.base64}});
          imageBase64s=[apiImg.base64,productRefImg.base64];
        }
        contents=[{parts:rParts}];
      }

      const refinementMeta=isRefine&&(hasRefAdj||hasRefineText||hasUpscaleIntent)?{...refAdj,feedback:refineFB,upscale:hasUpscaleIntent?selectedUpscale:null}:null;
      const activeMeta={provider,parentId,isRefine,params:{...gp},refinements:refinementMeta,promptChars:finalPrompt.length,ts:Date.now()};
      const rememberJob=jobId=>saveActiveJob({...activeMeta,id:jobId});
      if(!apiKey)setProcMsg("Generating — background job...");
      const res = await callProviderImage(provider,apiKey,finalPrompt,apiImg.base64,isRefine?contents:[{parts}],runLog,imageBase64s,rememberJob,openaiOptions,geminiOptions);
      if(!res.images.length) throw new Error("No image returned");

      const nn={id:mkId(),type:"gen",parentId,img:{dataUrl:res.images[0].dataUrl,base64:res.images[0].base64,mimeType:res.images[0].mimeType},
        params:{...gp}, refinements:refinementMeta,
        modelUsed:res.modelUsed||null, fallbackUsed:!!res.fallbackUsed, fallbackErrors:res.fallbackErrors||[],
        history:apiKey&&isRefine&&parentNode?.history
          ?[...parentNode.history,{role:"user",parts:[{text:"refine"}]},{role:"model",parts:res.allParts}]
          :[{parts:compactHistoryParts(parts)},{role:"model",parts:compactHistoryParts(res.allParts)}],
        ts:Date.now()};
      setNodes(p=>[...p,nn]);setSelId(nn.id);setBaseParams({...gp});
      setRefAdj({...DEFAULT_REFINE});setRefineFB("");setCroppedImg(null);setMode("refine");
      setPromptEditorOpen(false);setPromptEditorContext(null);
      clearActiveJob();
      setTotalCost(p=>p+providerCfg.imageCost);runLog("cost",`~$${providerCfg.imageCost.toFixed(3)}`);

      // Variations: re-run the same fresh-generation prompt for extra takes.
      const wantRuns=!isRefine?Math.max(1,Math.min(6,Number(variations)||1)):1;
      for(let vi=1;vi<wantRuns;vi++){
        try{
          setProcMsg(`Variation ${vi+1}/${wantRuns}…`);
          runLog("info",`Variation ${vi+1}/${wantRuns}`);
          const resV=await callProviderImage(provider,apiKey,finalPrompt,apiImg.base64,[{parts}],runLog,[apiImg.base64],rememberJob,openaiOptions,geminiOptions);
          if(!resV.images.length){runLog("error",`Variation ${vi+1}: no image`);continue;}
          const nv={id:mkId(),type:"gen",parentId,img:{dataUrl:resV.images[0].dataUrl,base64:resV.images[0].base64,mimeType:resV.images[0].mimeType},
            params:{...gp},refinements:null,modelUsed:resV.modelUsed||null,fallbackUsed:!!resV.fallbackUsed,fallbackErrors:resV.fallbackErrors||[],
            history:[{parts:compactHistoryParts(parts)},{role:"model",parts:compactHistoryParts(resV.allParts)}],ts:Date.now()};
          setNodes(p=>[...p,nv]);
          clearActiveJob();
          setTotalCost(p=>p+providerCfg.imageCost);runLog("cost",`~$${providerCfg.imageCost.toFixed(3)}`);
        }catch(errV){runLog("error",`Variation ${vi+1} failed: ${safeMsg(errV)}`);}
      }
      if(res.fallbackUsed)runLog("warning",`Fallback image model used (${res.modelUsed||"unknown"}). Inspect product geometry before using this shot.${res.fallbackErrors?.length?` Earlier failure: ${res.fallbackErrors[0]}`:""}`);
      if(res.revisedPrompt)runLog("debug",`OpenAI revised prompt: ${res.revisedPrompt.slice(0,500)}`);
      runLog("success",`${isRefine?"Refined":"Generated"} with ${providerCfg.label}${res.modelUsed?` (${res.modelUsed}${res.fallbackUsed?", fallback":""})`:""}`);
    }catch(e){runLog("error",safeMsg(e))}finally{setProcessing(false);setProcMsg("")}
  };

  const resumeActiveJob=async()=>{
    if(!activeJob?.id)return;
    setProcessing(true);setProcMsg("Resuming job...");clearReview();
    const runId=Date.now().toString(36).slice(-5).toUpperCase();
    const runLog=(type,msg)=>addLog(type,`#${runId} ${msg}`);
    try{
      const parentId=activeJob.parentId||genSource?.id;
      if(!parentId||!nodes.some(n=>n.id===parentId))throw new Error("Cannot resume job because its source image is not loaded in this session.");
      const jobProvider=activeJob.provider||provider;
      const jobCfg=PROVIDERS[jobProvider]||providerCfg;
      runLog("info",`Resuming Netlify job ${activeJob.id} (${jobCfg.label})`);
      const res=await pollImageJob(activeJob.id,runLog);
      if(!res.images?.length)throw new Error("Background job finished without an image");
      const nn={id:mkId(),type:"gen",parentId,img:{dataUrl:res.images[0].dataUrl,base64:res.images[0].base64,mimeType:res.images[0].mimeType},
        params:normalizeParams(activeJob.params||params),
        refinements:activeJob.refinements||null,
        modelUsed:res.modelUsed||null, fallbackUsed:!!res.fallbackUsed, fallbackErrors:res.fallbackErrors||[],

  const loadHandoff=useCallback(async (id,fresh)=>{
    try{
      const record=await FrameworkHandoff.get(id);
      if(!record||record.status!=="open"){FrameworkHandoff.forget();return}
      // A reload is not an arrival. The workspace is already the row's; all that
      // is needed is the banner back, and the autosave restores the rest.
      if(!fresh){setHandoff(record);return}
      const img=record.image;
      setRefImage(img);
      const refNode={id:"ref",type:"ref",parentId:null,img,params:null,history:null,ts:Date.now()};
