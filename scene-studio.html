  const currentPromptContext=()=>isGen&&mode==="refine"?{mode:"refine",selId:selNode?.id,basePrompt:editableRunPrompt}:{mode:"generate",selId:selNode?.id||genSource?.id||null,basePrompt:editableRunPrompt};
  const openPromptEditor=()=>{setEditablePrompt(editableRunPrompt);setPromptEditorContext(currentPromptContext());setPromptEditorOpen(true)};
  const switchMode=nextMode=>{setMode(nextMode);setPromptEditorOpen(false);setPromptEditorContext(null)};
  const optionName=(param,o)=>o[param.nameKey||"label"]||o.label||o.name||o.id;
  const renderParamControl=param=>{
    const opts=optionsForParam(param);
    const value=params[param.id];
    const isChanged=changedKeys.has(param.id);
    const isCard=["shotType","productBackground","scene"].includes(param.id);
    if(param.type==="multi"){
      const selected=new Set(value||[]);
      return(<div key={param.id} style={{marginBottom:10}}>
        <div style={{fontSize:10,color:isChanged?"#f6bd64":"#8d887c",fontWeight:800,marginBottom:5}}>{param.label}{isChanged?" *":""}</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:5,maxHeight:132,overflowY:"auto",paddingRight:2}}>
          {opts.map(o=>{
            const on=selected.has(o.id);
            return <button key={o.id} onClick={()=>toggleMulti(param.id,o.id)} style={{...S.pill,...(on?S.pillOn:{}),whiteSpace:"normal",lineHeight:1.15,textAlign:"left"}}>{on?"On: ":""}{optionName(param,o)}</button>;
          })}
        </div>
      </div>);
    }
    return(<div key={param.id} style={{marginBottom:10}}>
      <div style={{fontSize:10,color:isChanged?"#f6bd64":"#8d887c",fontWeight:800,marginBottom:5}}>{param.label}{isChanged?" *":""}</div>
      <div style={isCard?{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:7,maxHeight:param.id==="scene"?190:"none",overflowY:param.id==="scene"?"auto":"visible",paddingRight:2}:{display:"flex",flexWrap:"wrap",gap:5}}>
        {opts.map(o=>{
          const on=value===o.id;
          const label=optionName(param,o);
          if(isCard){
            return <button key={o.id} onClick={()=>updateSingle(param.id,o.id)} style={{...S.preset,minHeight:param.id==="shotType"?82:44,padding:"8px 9px",fontFamily:"inherit",textAlign:"left",border:on?"1px solid #d88a26":"1px solid #302e27",background:on?"#2b1d0d":"#11100d"}}>
              <div style={{fontSize:12,fontWeight:800,color:on?"#ffd08d":"#fffaf0",lineHeight:1.15}}>{label}</div>
              {(param.id==="shotType"||param.id==="productBackground")&&o.prompt?<div style={{fontSize:10,color:"#9b9487",lineHeight:1.25,marginTop:4}}>{o.prompt}</div>:null}
            </button>;
          }
          return <button key={o.id} onClick={()=>updateSingle(param.id,o.id)} style={{...S.pill,...(on?S.pillOn:{}),whiteSpace:"normal",lineHeight:1.15}}>{label}</button>;
        })}
      </div>
    </div>);
  };
  const renderRecipeGroup=group=>(<div key={group.id} style={{background:"#11100d",border:"1px solid #302e27",borderRadius:8,padding:"10px 10px 8px",minWidth:0}}>
    <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"center",marginBottom:8}}>
      <div>
        <div style={{fontSize:11,fontWeight:900,color:"#fffaf0",textTransform:"uppercase",letterSpacing:".04em"}}>{group.label}</div>
        <div style={{fontSize:9,color:"#8d887c"}}>{group.kind==="multi"?"choose several":"one choice per row"}</div>
      </div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"flex-end"}}>
        {group.id==="shot"?<button className="btn btn-small" onClick={surpriseScene} disabled={processing}>Surprise scene</button>:null}
        {group.id==="shot"&&params.shotType==="use"?<button className="btn btn-small" onClick={()=>setShowAllScenes(v=>!v)} disabled={processing}>{showAllScenes?"Filtered rooms":"All rooms"}</button>:null}
        {group.id==="details"?<button className="btn btn-small" onClick={suggestDetails} disabled={params.shotType==="clean"||processing}>Suggest details</button>:null}
      </div>
    </div>
    {group.controls.map(renderParamControl)}
    {group.id==="photo"?(<div style={{marginBottom:4}}>
      <div style={{fontSize:10,color:changedKeys.has("aspect")?"#f6bd64":"#8d887c",fontWeight:800,marginBottom:5}}>Aspect{changedKeys.has("aspect")?" *":""}</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
        {ASPECTS.map(a=><button key={a.id} onClick={()=>setP("aspect",a.id)} style={{...S.pill,...(params.aspect===a.id?S.pillOn:{})}}>{a.l}</button>)}
      </div>
    </div>):null}
  </div>);

  // ─── Pipeline rendering ────────────────────────────────────────
  function renderChain(nodeId,depth=0){
    const node=nodes.find(n=>n.id===nodeId);if(!node)return null;
    const children=nodes.filter(n=>n.parentId===nodeId);
    const isSel=selId===nodeId;
    const borderColor=isSel?"#d97706":node.type==="ref"||node.type==="ref-scale"?"#3b82f6":"#333";
    const badge=node.type==="ref"?"REF":node.type==="ref-scale"?"SCALE":node.id;
    const badgeBg=node.type==="ref"||node.type==="ref-scale"?"rgba(59,130,246,.85)":node.refinements?"rgba(139,92,246,.85)":"rgba(217,119,6,.85)";
    return(
      <div style={{display:"flex",alignItems:"flex-start"}}>
        <div onClick={()=>handleSelect(nodeId)} style={{flexShrink:0,position:"relative",cursor:"pointer"}}>
          <div style={{width:52,height:52,borderRadius:6,overflow:"hidden",border:`2px solid ${borderColor}`,transition:"border-color .15s"}}>
            {node.img?<img src={node.img.dataUrl} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:"100%",height:"100%",background:"#1a1a1a"}}/>}
          </div>
          <div style={{position:"absolute",bottom:1,left:1,right:1,fontSize:7,background:badgeBg,color:"#fff",textAlign:"center",borderRadius:"0 0 4px 4px",padding:"1px 0"}}>{badge}</div>
        </div>
        {children.length>0&&(<div style={{display:"flex",flexDirection:"column"}}>
          {children.map((ch,i)=>(<div key={ch.id} style={{display:"flex",alignItems:"center",marginTop:i>0?4:0}}>
            <div style={{width:20,height:0,borderTop:"2px solid #404040",margin:"0 2px"}}/>
            <div style={{width:0,height:0,borderLeft:"5px solid #404040",borderTop:"3px solid transparent",borderBottom:"3px solid transparent"}}/>
            {renderChain(ch.id,depth+1)}
          </div>))}
        </div>)}
      </div>
    );
  }

  // ─── RENDER ────────────────────────────────────────────────────
  return(
    <div style={S.page}
      onDragEnter={e=>{if(e.dataTransfer?.types?.includes("Files")){e.preventDefault();setDropDepth(d=>d+1);}}}
      onDragOver={e=>{if(e.dataTransfer?.types?.includes("Files"))e.preventDefault();}}
      onDragLeave={()=>setDropDepth(d=>Math.max(0,d-1))}
      onDrop={e=>{
        setDropDepth(0);
        if(!e.dataTransfer?.files?.length)return;
        e.preventDefault();
        acceptBaseImage(e.dataTransfer.files[0]);
      }}>
      {dropDepth>0&&(
        <div style={{position:"fixed",inset:0,zIndex:60,display:"flex",alignItems:"center",justifyContent:"center",
                     background:"rgba(16,16,14,.86)",border:"2px dashed #d88a26",pointerEvents:"none"}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:17,fontWeight:800,color:"#f6bd64"}}>Drop the render here</div>
            <div style={{fontSize:12,color:"#a09a8e",marginTop:6}}>
              Its filename sets the design code, so the images you make carry it
            </div>
          </div>
        </div>)}
      <header className="top">
        <div>
          <div className="eyebrow">Framework Designs</div>
          <h1>Scene Studio</h1>
          {/* Whether what leaves this page will still say which shelf it is of.
              Editable, because the filename is only the usual way it arrives --
              a renamed file, a session reloaded, an image that came from
              somewhere else entirely, and it has to be settable by hand. */}
          {(nodes.length>0||pendingUpload)&&(
            <div style={{display:"flex",alignItems:"center",gap:6,marginTop:2}}>
              <span style={{fontSize:10,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"#8a8a82"}}>Design</span>
              <input
                value={designCode||""}
                onChange={e=>setDesignCode(e.target.value.toUpperCase().replace(/[^0-9A-Z]/g,"").slice(0,7)||null)}
                placeholder="1Y3MK7P"
                maxLength={7}
                title="The seven characters from the share image. Exports carry it, so the picture says which shelf it is of."
                style={{width:96,padding:"2px 6px",borderRadius:5,border:`1px solid ${designCode?"#2f6f4a":"#5a4a1e"}`,
                        background:designCode?"#16241c":"#231d0e",color:designCode?"#7fd1a0":"#e8c46a",
                        font:"700 12px ui-monospace,Menlo,monospace",letterSpacing:".1em"}}/>
              <span style={{fontSize:11,fontWeight:600,color:designCode?"#7fd1a0":"#c9a227"}}>
                {designCode?"carried into every export":"without one, exports will not link back to a shelf"}
              </span>
            </div>)}
        </div>
        <div className="top-actions">
          <select className="select select-small" value={provider} onChange={e=>updateProvider(e.target.value)} style={{width:120}}>
            {Object.entries(PROVIDERS).map(([id,cfg])=><option key={id} value={id}>{cfg.label}</option>)}
          </select>
          <span style={{background:"#252017",border:"1px solid #4a3822",padding:"5px 10px",borderRadius:6,fontSize:11,fontWeight:800,color:"#f6bd64"}}>${totalCost.toFixed(3)}</span>
          <input ref={baseUploadRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleBaseUpload}/>
          <input ref={sessionRef} type="file" accept=".json,application/json" style={{display:"none"}} onChange={handleLoad}/>
          <button className="btn btn-small" onClick={()=>sessionRef.current?.click()}>Load session</button>
          <button className="btn btn-small" onClick={handleSave} disabled={!nodes.length}>Save session</button>
        </div>
      </header>

      {/* Where this session came from and where its result is going. Standing
          above everything else because it changes what the Download button on a
          finished shot is for. */}
      {handoff&&(
        <div style={{background:"#182523",border:"1px solid #375247",borderRadius:8,padding:"8px 12px",marginBottom:10,display:"flex",gap:10,alignItems:"center",justifyContent:"space-between",flexWrap:"wrap"}}>
          <span style={{fontSize:11,color:"#d9f0e4",fontWeight:700}}>
            Scene for <strong>{handoff.rowTitle||"a catalogue row"}</strong>
            {handoff.imageKind?` — from its ${handoff.imageKind}`:""}. Generate, then
            press <strong>Send to row</strong> on the one you want.
          </span>
          <div style={{display:"flex",gap:6}}>
            <button className="btn btn-small" onClick={()=>{
              if(!window.confirm("Leave without sending a shot back?\n\nThe row keeps waiting for this session — you can resume it from the row."))return;
              window.location.href="/catalog-studio";
            }}>Leave without sending</button>
          </div>
        </div>
      )}

      {restoreAvailable&&!nodes.length&&(
        <div style={{background:"#1a2030",border:"1px solid #315271",borderRadius:8,padding:"8px 12px",marginBottom:10,display:"flex",gap:10,alignItems:"center",justifyContent:"space-between",flexWrap:"wrap"}}>
          <span style={{fontSize:11,color:"#d7ecff",fontWeight:700}}>A previous session was autosaved.</span>
          <div style={{display:"flex",gap:6}}>
            <button className="btn btn-small btn-primary" onClick={restoreAutosave}>Restore</button>
            <button className="btn btn-small" onClick={()=>setRestoreAvailable(false)}>Dismiss</button>
          </div>
        </div>
      )}

      {libOpen&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.78)",zIndex:60,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>setLibOpen(false)}>
          <div style={{background:"#14130f",border:"1px solid #3a3830",borderRadius:10,width:"min(880px,94vw)",maxHeight:"84vh",display:"flex",flexDirection:"column",padding:14}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div>
                <div style={{fontWeight:900,fontSize:13,color:"#fffaf0"}}>Choose a source from the Library</div>
                <div style={{fontSize:10,color:"#8d887c",marginTop:2}}>Renders arrive here automatically from the 3D Builder — with product identity and true scale attached.</div>
              </div>
              <button className="btn btn-small" onClick={()=>setLibOpen(false)}>Close</button>
            </div>
            <div style={{overflowY:"auto",minHeight:120}}>
              {!libAssets?<div style={{color:"#8d887c",fontSize:12,padding:20}}>Loading…</div>
              :libAssets.error?<div style={{color:"#f6bd64",fontSize:12,padding:20}}>The Library is switched off.</div>
              :!libAssets.records.length?<div style={{color:"#8d887c",fontSize:12,padding:20}}>Nothing in the working set yet. Render a design in the 3D Builder — it lands here automatically.</div>
              :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:8}}>
                {libAssets.records.map(r=>(
                  <div key={r.hash} onClick={()=>pickFromLibrary(r)} style={{cursor:"pointer",border:"1px solid #2d2a23",borderRadius:8,overflow:"hidden",background:"#0f0e0b"}}>
                    <img src={window.DamClient.thumbUrl(r.hash)} loading="lazy" style={{width:"100%",aspectRatio:"1",objectFit:"cover",display:"block",background:"#0a0a08"}}/>
                    <div style={{padding:"5px 7px"}}>
                      <div style={{fontSize:10,fontWeight:800,color:"#e8e2d4",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.configId||r.origins?.[0]?.path||r.hash.slice(0,10)}</div>
                      <div style={{fontSize:9,color:"#8d887c"}}>{r.kind}{r.unitHeightMm>0?` · ${Math.round(r.unitHeightMm/10)}cm`:""}{r.variant?` · ${r.variant}`:""}</div>
                    </div>
                  </div>
                ))}
              </div>}
            </div>
          </div>
        </div>
      )}

      <div style={S.workspace} className="studio-grid">
        <section style={S.left} className="sticky-pane">
          <div className="panel">
            <div className="panel-title">
              <div>
                <div className="title">Product source</div>
                <div className="sub">{refImage?"Reference loaded. Product lock stays strict.":"Upload one image, then choose how to use it."}</div>
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
                <button className="btn btn-small btn-primary" onClick={()=>baseUploadRef.current?.click()} disabled={processing}>Upload base image</button>
                {window.DamClient?.enabled&&<button className="btn btn-small" onClick={openLibrary} disabled={processing}>From library</button>}
              </div>
            </div>
            {pendingUpload?(
              <div style={{background:"#11100d",border:"1px solid #3a3830",borderRadius:8,padding:12,marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",gap:10,alignItems:"flex-start",flexWrap:"wrap"}}>
                  <div>
                    <div style={{fontSize:12,fontWeight:900,color:"#fffaf0"}}>What is this image?</div>
                    <div style={{fontSize:10,color:"#8d887c",lineHeight:1.35,marginTop:3}}>
                      {pendingUpload.name} / {pendingUpload.img.width}x{pendingUpload.img.height}
                    </div>
                  </div>
                  <button className="btn btn-small" onClick={()=>setPendingUpload(null)}>Cancel</button>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:8,marginTop:10}}>
                  <button style={{...S.preset,minHeight:72,textAlign:"left",fontFamily:"inherit"}} onClick={usePendingAsSource}>
                    <div style={S.presetTitle}>Source product photo</div>
                    <div style={S.presetDesc}>Use this as the product reference, then create fresh images from it.</div>
                  </button>
                  <button style={{...S.preset,minHeight:72,textAlign:"left",fontFamily:"inherit"}} onClick={usePendingAsRefine}>
                    <div style={S.presetTitle}>Existing AI image</div>
                    <div style={S.presetDesc}>Start in refine mode from this already-made shot.</div>
                  </button>
                </div>
              </div>
            ):!selNode?(
              <div style={{width:"100%",minHeight:140,border:"1px solid #302e27",background:"#11100d",borderRadius:8,color:"#8d887c",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,textAlign:"center",padding:18}}>No base image loaded.</div>
            ):cropMode?(
              <CropTool src={selNode.img.dataUrl} onApply={handleCrop} onCancel={()=>setCropMode(false)}/>
            ):(
              <div>
                {(()=>{
                  const onRef=selNode.type==="ref"||selNode.type==="ref-scale";
                  const scaleProps=onRef?scaleTool.imageProps:{};
                  return <img ref={imgRef} src={croppedImg?croppedImg.dataUrl:(selNode.type==="ref"&&augImg?augImg.dataUrl:selNode.img?.dataUrl)} alt=""
                    onClick={scaleProps.onClick} onMouseDown={scaleProps.onMouseDown}
                    style={{width:"100%",maxHeight:520,objectFit:"contain",borderRadius:8,border:"1px solid #343129",background:"#0b0b09",...(scaleProps.style||{})}}/>;
                })()}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",marginTop:9}}>
                  <div style={{fontSize:11,color:"#9f9789"}}>
                    {selNode.type==="ref"?"Reference":selNode.type==="ref-scale"?"Reference + scale":selNode.source==="uploaded-refine"?"Uploaded shot":selNode.refinements?"Refined shot":"Generated shot"}
                    {selNode.ts&&selNode.type==="gen"?` / ${new Date(selNode.ts).toLocaleTimeString()}`:""}
                    {selNode.type==="gen"&&selNode.modelUsed?<span style={{color:selNode.fallbackUsed?"#f6bd64":"#8bd17c",marginLeft:8}}>{selNode.modelUsed}{selNode.fallbackUsed?" fallback":""}</span>:null}
                    {scaleOK&&selNode.type==="ref"?<span style={{color:"#8bd17c",marginLeft:8}}>Scale set</span>:null}
                  </div>
                  <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                    {isGen&&handoff&&<button className="btn btn-small btn-primary" onClick={sendToRow}>Send to row</button>}
                    {isGen&&(<>
                      <button className={`btn btn-small ${handoff?"":"btn-primary"}`} onClick={()=>dl(croppedImg||selNode.img,exportName(selNode))}>Download</button>
                      <button className="btn btn-small" onClick={postToAirtable} disabled={!!airtablePost||processing||!/^[0-9A-Z]{7}$/.test(designCode||"")}>
                        {airtablePost?airtablePost.status==="preparing"?"Preparing":airtablePost.status==="uploading"?"Uploading":"Posting":"Post to Airtable"}
                      </button>
                      <button className="btn btn-small" onClick={()=>{setCropMode(true);setCroppedImg(null)}}>Crop</button>
                      <button className="btn btn-small" onClick={handleValidate} disabled={processing}>Check</button>
                      {window.DamClient?.enabled&&selNode?.type==="gen"&&<button className="btn btn-small" onClick={saveToLibrary} disabled={processing}>Save to library</button>}
                      <button className="btn btn-small" onClick={handleCaption} disabled={capLoading}>{capLoading?"Writing":"Captions"}</button>
                      {genNodes.length>1&&<button className="btn btn-small" onClick={handleExport}>Export all</button>}
                    </>)}
                  </div>
                </div>

                {(selNode.type==="ref"||selNode.type==="ref-scale")&&(
                  <FrameworkScale.Panel {...scaleTool.panelProps} canSkip={false}/>
                )}
                {croppedImg&&<div style={{fontSize:10,color:"#8bd17c",marginTop:6,padding:"4px 8px",background:"#122214",borderRadius:5}}>Cropped {croppedImg.width}x{croppedImg.height} <span style={{color:"#cbe8c5",cursor:"pointer",textDecoration:"underline"}} onClick={()=>setCroppedImg(null)}>Undo</span></div>}
                {valResult&&(<div style={{background:"#0e0e0c",border:"1px solid #2d2a23",borderRadius:8,padding:9,marginTop:8}}>
                  <span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:valResult.overall_pass?"#56c46e":"#e06457",marginRight:6}}/>
                  <span style={{fontSize:12,fontWeight:800,color:valResult.overall_pass?"#88d596":"#f0a09a"}}>{valResult.overall_pass?"Passed":"Needs work"}</span>
                  {valResult.issues?.length>0&&<div style={{fontSize:10,color:"#d9a09a",marginTop:5}}>{valResult.issues.join("; ")}</div>}
                </div>)}
                {captions?.length>0&&(<div style={{background:"#0e0e0c",border:"1px solid #2d2a23",borderRadius:8,padding:9,marginTop:8}}>
                  {captions.map((c,i)=>(<div key={i} style={{padding:"5px 7px",background:"#181712",borderRadius:5,marginBottom:4,cursor:"pointer",border:"1px solid #2d2a23"}} onClick={()=>{navigator.clipboard.writeText(c.text);addLog("info","Copied")}}>
                    <span style={{fontSize:11,color:"#ece7dd"}}>{c.text}</span><span style={{fontSize:8,color:"#8d887c",marginLeft:6}}>{c.angle} / copy</span>
                  </div>))}
                </div>)}
              </div>
            )}
          </div>

          <div className="panel-tight">
            <div className="panel-title" style={{marginBottom:6}}>
              <div>
                <div className="title">Shot map</div>
                <div className="sub">{genNodes.length} generated</div>
              </div>
              {selId&&<button className="btn btn-small" onClick={()=>{setSelId(null);setBaseParams(null);setPromptEditorOpen(false);setPromptEditorContext(null);clearReview()}}>Deselect</button>}
            </div>
            <div style={{overflowX:"auto",padding:"4px 0"}}>
              {nodes.length===0?<span style={{fontSize:11,color:"#8d887c"}}>No source yet.</span>:<div style={{display:"inline-flex",alignItems:"flex-start"}}>{renderChain("ref")}</div>}
            </div>
          </div>

          <div className="panel-tight">
            <FrameworkStudio.ActivityLog entries={log} onClear={()=>setLog([])} onCopied={()=>addLog("info","Log copied")}/>
          </div>
        </section>

        <section style={{minWidth:0,display:"flex",flexDirection:"column",gap:10}}>
          <div className="panel">
            <div className="panel-title">
              <div>
                <div className="title">{isGen&&mode==="refine"?"Improve selected shot":"Plan product shot"}</div>
                <div className="sub">{isGen&&mode==="refine"?"Text edits and reality dials are enough for most revisions.":"Choose clean product or shelf in use, then tune the recipe."}</div>
              </div>
              {isGen&&(<div style={{display:"flex",borderRadius:7,overflow:"hidden",border:"1px solid #3a3830"}}>
                <button onClick={()=>switchMode("refine")} style={{padding:"7px 12px",fontSize:11,fontWeight:800,border:"none",cursor:"pointer",fontFamily:"inherit",background:mode==="refine"?"#d88a26":"#24231e",color:mode==="refine"?"#14110a":"#bdb6a7"}}>Refine</button>
                <button onClick={()=>switchMode("regenerate")} style={{padding:"7px 12px",fontSize:11,fontWeight:800,border:"none",cursor:"pointer",fontFamily:"inherit",background:mode==="regenerate"?"#d88a26":"#24231e",color:mode==="regenerate"?"#14110a":"#bdb6a7"}}>New version</button>
              </div>)}
            </div>

            <div style={{background:"#0f120f",border:"1px solid #2f3b2b",borderRadius:8,padding:10,marginBottom:10}}>
              <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginBottom:fidelityWarnings.length?6:0}}>
                <span style={{fontSize:11,fontWeight:900,color:"#dcefd7",textTransform:"uppercase",letterSpacing:".04em"}}>Product lock</span>
                <span style={{...S.chip,border:"1px solid #42613d",background:"#152015",color:"#a9e6a5"}}>Strict</span>
                <span style={S.chip}>{apiKey?"Browser ref":"Server ref"} {apiKey?"full detail":`${SERVER_MAX_DIM}px`}</span>
                {provider==="openai"?<span style={S.chip}>GPT Image 2 high</span>:null}
                {provider==="gemini"?<span style={S.chip}>Gemini native 2K</span>:null}
                <span style={{...S.chip,color:scaleOK?"#a9e6a5":"#f6bd64"}}>{scaleOK?"Scale set":"Scale unset"}</span>
                {damSource&&<span style={{...S.chip,color:"#a9c6e6"}}>Library: {damSource.configId||damSource.hash.slice(0,8)}</span>}
              </div>
              {fidelityWarnings.length?(
                <div style={{display:"grid",gap:4}}>
                  {fidelityWarnings.map((w,i)=><div key={i} style={{fontSize:10,color:"#d6c39a",lineHeight:1.35}}>- {w}</div>)}
                </div>
              ):null}
            </div>

            {isGen&&mode==="refine"?(
              <div>
                {selectedUpscale?.needed&&(
                  <div style={{background:"#171d24",border:"1px solid #315271",borderRadius:8,padding:10,marginBottom:10}}>
                    <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"flex-start",flexWrap:"wrap"}}>
                      <div>
                        <div style={{fontSize:11,fontWeight:900,color:"#d7ecff",textTransform:"uppercase",letterSpacing:".04em"}}>Upscale recommended</div>
                        <div style={{fontSize:10,color:"#a9bed0",lineHeight:1.35,marginTop:3}}>
                          Uploaded {selectedUpscale.width}x{selectedUpscale.height}; target {selectedUpscale.targetLabel}. The next refine run will restore detail while upscaling.
                        </div>
                      </div>
                      <div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"flex-end"}}>
                        <button className={`btn btn-small ${selectedUpscale.mode==="only"?"btn-primary":""}`} onClick={()=>setSelectedUpscaleMode("only")}>Upscale only</button>
                        <button className={`btn btn-small ${selectedUpscale.mode==="with-refine"?"btn-primary":""}`} onClick={()=>setSelectedUpscaleMode("with-refine")}>With edits</button>
                        <button className="btn btn-small" onClick={()=>setSelectedUpscaleMode(null)}>Skip</button>
                      </div>
                    </div>
                  </div>
                )}
                <div style={S.miniGrid}>
                  {REFINE_PRESETS.map(p=><button key={p.id} style={{...S.preset,textAlign:"left",fontFamily:"inherit"}} onClick={()=>applyRefinePreset(p)}>
                    <div style={S.presetTitle}>{p.label}</div>
                    <div style={S.presetDesc}>{p.feedback.slice(0,95)}</div>
                  </button>)}
                </div>
                <textarea value={refineFB} onChange={e=>setRefineFB(e.target.value)} placeholder="What should change?" className="textarea" style={{minHeight:86,marginTop:10}}/>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(96px,1fr))",gap:7,marginTop:10}}>
                  {REFINE_CATS.map(cat=>(<div key={cat.id}>
                    <div style={{fontSize:9,color:"#8d887c",marginBottom:3}}>{cat.label}</div>
                    <div style={{display:"flex",gap:2}}>{REFINE_LVLS.map(lv=>(<span key={lv.v} onClick={()=>setRefAdj(p=>({...p,[cat.id]:lv.v}))} style={{padding:"3px 0",borderRadius:4,fontSize:9,cursor:"pointer",flex:1,textAlign:"center",fontWeight:800,
                      background:refAdj[cat.id]===lv.v?(lv.v<0?"#182a20":lv.v>0?"#2b1d0d":"#24231e"):"#11100d",
                      border:`1px solid ${refAdj[cat.id]===lv.v?(lv.v<0?"#356c4b":lv.v>0?"#d88a26":"#3a3830"):"#282620"}`,
                      color:refAdj[cat.id]===lv.v?(lv.v<0?"#9ee0ad":lv.v>0?"#ffd08d":"#bdb6a7"):"#746f64"}}>{lv.l}</span>))}</div>
                  </div>))}
                </div>
              </div>
            ):(
              <div>
                {params.shotType!=="clean"&&(
                  <div style={{marginBottom:10}}>
                    <div className="label">Start from a Nairobi place</div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:7}}>
                      {(CONFIG.archetypes||[]).map(a=>(
                        <button key={a.id} onClick={()=>applyArchetype(a)} style={{...S.preset,textAlign:"left",fontFamily:"inherit",border:`1px solid ${params.archetype===a.id?"#d88a26":"#2d2a23"}`,background:params.archetype===a.id?"#241c10":S.preset.background}}>
                          <div style={S.presetTitle}>{a.name}</div>
                          <div style={S.presetDesc}>{a.blurb}</div>
                        </button>
                      ))}
                      <button onClick={()=>setParams(p=>normalizeParams({...p,archetype:null}))} style={{...S.preset,textAlign:"left",fontFamily:"inherit",border:`1px solid ${!params.archetype?"#d88a26":"#2d2a23"}`,background:!params.archetype?"#241c10":S.preset.background}}>
                        <div style={S.presetTitle}>Custom</div>
                        <div style={S.presetDesc}>Assemble the place from fine controls</div>
                      </button>
                    </div>
                  </div>
                )}
                <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:8,flexWrap:"wrap"}}>
                  <button className="btn btn-small" onClick={()=>setShowFine(v=>!v)}>{showFine?"Hide fine controls":"Fine controls…"}</button>
                  <button className="btn btn-small" onClick={()=>updateSingle("shotType",params.shotType==="clean"?"use":"clean")}>{params.shotType==="clean"?"← Back to scene shots":"Clean product shot instead"}</button>
                  {params.archetype&&<span style={{fontSize:10,color:"#8d887c"}}>Fine-control changes become explicit adjustments to the place.</span>}
                </div>
                {(showFine||params.shotType==="clean")&&(
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:10}}>
                    {recipeGroups.map(renderRecipeGroup)}
                  </div>
                )}
                <div style={{marginTop:10}}>
                  <div className="label">Brief note</div>
                  <textarea value={params.customNotes||""} onChange={e=>setP("customNotes",e.target.value)} placeholder="Optional direction for this shot" className="textarea" style={{minHeight:70}}/>
                </div>
              </div>
            )}
          </div>

          <div className="panel" style={{position:"relative",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexWrap:"wrap"}}>
            <div>
              <div className="title">Ready for content</div>
              <div className="sub">{providerCfg.label} / approx ${providerCfg.imageCost.toFixed(2)} per image</div>
              {activeJob?.id&&<div style={{fontSize:10,color:"#f6bd64",marginTop:4}}>Unfinished Netlify job saved: {activeJob.id}</div>}
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",justifyContent:"flex-end"}}>
              {isDirty&&<span style={{fontSize:11,color:"#f6bd64"}}>{dirtyLabels.join(" + ")}</span>}
              {!(isGen&&mode==="refine")&&(
                <label style={{display:"flex",gap:5,alignItems:"center",fontSize:10,color:"#8d887c"}}>Takes
                  <select value={variations} onChange={e=>setVariations(Number(e.target.value))} className="select select-small" style={{width:52,padding:"0 6px"}}>
                    {[1,2,3,4,6].map(n=><option key={n} value={n}>{n}</option>)}
                  </select>
                </label>
              )}
              {activeJob?.id&&<button className="btn btn-large" disabled={processing} onClick={resumeActiveJob}>{processing?"Working":"Resume job"}</button>}
              {activeJob?.id&&<button className="btn btn-large" disabled={processing} onClick={clearActiveJob}>Forget</button>}
              <button className="btn btn-large btn-primary" disabled={runDisabled} onClick={()=>handleRun()}>
                {processing?procMsg:runLabel}
              </button>
              <button className="btn btn-large" disabled={runDisabled} onClick={openPromptEditor}>{editRunLabel}</button>
            </div>
            {processing&&<div style={{position:"absolute",bottom:0,left:0,right:0,height:3,background:"#25231d",borderRadius:"0 0 8px 8px",overflow:"hidden"}}><div style={{height:"100%",background:"#d88a26",animation:"pulse 1.5s ease-in-out infinite"}}/></div>}
          </div>

          {promptEditorOpen&&<div className="panel-tight">
            <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"center",marginBottom:7}}>
              <div>
                <div className="title">Prompt editor</div>
                <div className="sub">{editablePrompt.length} chars</div>
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
                <button className="btn btn-small" onClick={()=>{navigator.clipboard.writeText(editablePrompt);addLog("info","Prompt copied")}}>Copy</button>
                <button className="btn btn-small" onClick={()=>{setEditablePrompt(editableRunPrompt);setPromptEditorContext(currentPromptContext())}}>Reset</button>
                <button className="btn btn-small" onClick={()=>{setPromptEditorOpen(false);setPromptEditorContext(null)}}>Cancel</button>
                <button className="btn btn-small btn-primary" disabled={processing||!editablePrompt.trim()} onClick={()=>handleRun(editablePrompt)}>{editedRunLabel}</button>
              </div>
            </div>
            <textarea value={editablePrompt} onChange={e=>setEditablePrompt(e.target.value)} className="textarea" style={{minHeight:260,maxHeight:460,fontFamily:"ui-monospace, SFMono-Regular, Menlo, monospace",fontSize:10,lineHeight:1.45,whiteSpace:"pre-wrap"}}/>
          </div>}
        </section>
      </div>
    </div>
  );
}

// Nothing mounts until there is a key /api/auth accepts. The page holds no
// secret, but it is useless without one, and a half-drawn studio that fails on
// every request is a worse experience than being asked for the key.
window.FrameworkGate.ready().then(function(){
  ReactDOM.render(<App/>,document.getElementById("root"));
});
</script>
</body>
</html>
