<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Framework studio</title>
<!--
  A bench tool, not a page. It reads a corpus generated by
  scripts/generate-designs.mjs and draws it with the builder's own renderer.

  Run it through the dev server, which is what serves the corpus file and takes
  the verdicts back:

      npm run dev     # then http://127.0.0.1:8770/studio.html

  It carries no ?v= asset version on purpose. The bump script exists so that
  /builder's code and catalogue can never be served half-stale from a CDN; this
  page is served from disk with no-store and has no CDN to go stale in, so
  versioning it would only be one more thing to remember to bump.
-->
<style>
  :root {
    --ink: #1d2321;
    --muted: #6b7672;
    --line: #dfe3e0;
    --paper: #f7f8f7;
    --keep: #2f8f6f;
    --maybe: #c99a2e;
    --reject: #c0554a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: #fff; border-bottom: 1px solid var(--line);
    padding: 12px 20px 0;
  }
  .dl-top { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.01em; }
  #dl-tally { color: var(--muted); font-size: 13px; }
  .dl-controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .dl-bar { display: flex; gap: 6px; }
  .dl-bar button, #dl-export {
    font: inherit; font-size: 13px; padding: 5px 11px;
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    color: var(--muted); cursor: pointer;
  }
  .dl-bar button.is-on { background: var(--ink); border-color: var(--ink); color: #fff; }
  #dl-progress { height: 3px; background: var(--line); margin: 12px -20px 0; }
  #dl-progress-bar { height: 100%; background: var(--keep); width: 0; transition: width 0.2s; }

  main { padding: 24px 20px 60px; }
  .dl-empty { color: var(--muted); text-align: center; padding: 60px 0; }

  /* --- one at a time --- */
  .dl-card {
    display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr);
    gap: 28px; max-width: 1100px; margin: 0 auto;
    background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px;
  }
  .dl-figure { background: #fff; border-radius: 10px; display: flex; align-items: center; }
  .dl-figure img { width: 100%; height: auto; display: block; }
  .dl-panel { display: flex; flex-direction: column; gap: 10px; }
  .dl-position { color: var(--muted); font-size: 12px; margin: 0; text-transform: uppercase; letter-spacing: 0.08em; }
  .dl-code { margin: 0; font-size: 26px; letter-spacing: 0.06em; font-weight: 600; }
  .dl-size { margin: 0; color: var(--ink); font-size: 13px; }
  .dl-modules { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .dl-open { font-size: 13px; color: var(--keep); }
  .dl-note {
    font: inherit; font-size: 14px; min-height: 110px; resize: vertical;
    border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-top: auto;
  }
  .dl-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .dl-verdict {
    font: inherit; cursor: pointer; padding: 12px 6px; border-radius: 9px;
    border: 1px solid var(--line); background: #fff;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .dl-verdict small { color: var(--muted); font-size: 15px; }
  .dl-verdict-keep.is-on { background: var(--keep); border-color: var(--keep); color: #fff; }
  .dl-verdict-maybe.is-on { background: var(--maybe); border-color: var(--maybe); color: #fff; }
  .dl-verdict-reject.is-on { background: var(--reject); border-color: var(--reject); color: #fff; }
  .dl-verdict.is-on small { color: rgba(255, 255, 255, 0.75); }
  .dl-nav { display: flex; justify-content: space-between; }
  .dl-skip { font: inherit; font-size: 13px; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px; }

  /* --- all of them --- */
  .dl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .dl-cell {
    font: inherit; text-align: left; cursor: pointer; padding: 8px;
    background: #fff; border: 1px solid var(--line); border-top-width: 3px; border-radius: 10px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .dl-cell.is-keep { border-top-color: var(--keep); }
  .dl-cell.is-maybe { border-top-color: var(--maybe); }
  .dl-cell.is-reject { border-top-color: var(--reject); opacity: 0.55; }
  .dl-cell img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; }
  .dl-cell-code { font-size: 12px; letter-spacing: 0.08em; color: var(--muted); }
  .dl-cell-note { font-size: 12px; color: var(--ink); }

  #dl-canvas { position: fixed; left: -10000px; top: 0; width: 720px; height: 720px; }

  @media (max-width: 820px) {
    .dl-card { grid-template-columns: 1fr; }
  }

  /* --- the flow card's verdicts: as many columns as there are answers --- */
  .dl-actions-2 { grid-template-columns: repeat(2, 1fr); }
  .dl-actions-3 { grid-template-columns: repeat(3, 1fr); }
  .dl-actions-4 { grid-template-columns: repeat(4, 1fr); }
  .dl-verdict-keep:hover { background: var(--keep); border-color: var(--keep); color: #fff; }
  .dl-verdict-maybe:hover { background: var(--maybe); border-color: var(--maybe); color: #fff; }
  .dl-verdict-reject:hover { background: var(--reject); border-color: var(--reject); color: #fff; }
  .dl-verdict:hover small { color: rgba(255,255,255,0.75); }

  /* --- the same verdicts, small, on a grid cell --- */
  .dl-cell-verdicts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .dl-cell-btn.dl-tone-keep:hover:not(:disabled), .dl-cell-btn.dl-tone-keep.is-on { background: var(--keep); border-color: var(--keep); color: #fff; }
  .dl-cell-btn.dl-tone-maybe:hover:not(:disabled), .dl-cell-btn.dl-tone-maybe.is-on { background: var(--maybe); border-color: var(--maybe); color: #fff; }
  .dl-cell-btn.dl-tone-reject:hover:not(:disabled), .dl-cell-btn.dl-tone-reject.is-on { background: var(--reject); border-color: var(--reject); color: #fff; }
  /* one line for why not, read by whichever verdict is pressed */
  .dl-cell-why {
    font: inherit; font-size: 12px; width: 100%; padding: 4px 6px; margin-top: 4px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink);
  }
  .dl-cell-why::placeholder { color: #b3bab6; }
  .dl-cell.is-skip, .dl-cell.is-again, .dl-cell.is-fail { border-top-color: var(--reject); opacity: 0.55; }
  .dl-cell.is-reject:hover, .dl-cell.is-skip:hover, .dl-cell.is-again:hover, .dl-cell.is-fail:hover { opacity: 1; }
  /* the audit's score, small, in the corner of the picture */
  .dl-cell-open { position: relative; }
  .dl-badge {
    position: absolute; top: 6px; right: 6px; font-size: 11px; line-height: 1;
    padding: 4px 6px; border-radius: 999px; background: rgba(29, 35, 33, 0.72); color: #fff;
  }
  .dl-badge.is-pass { background: var(--keep); }
  .dl-badge.is-fail { background: var(--reject); }
  /* bringing the rejected back into a grid, greyed */
  .dl-show-rejected {
    font: inherit; font-size: 12px; background: none; border: 0; padding: 0;
    color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
  }
  .dl-show-rejected.is-on { color: var(--ink); }
  .dl-grid-head { display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 10px; }
  .dl-warn { margin: 0; font-size: 12px; color: var(--reject); }
  .dl-hint { margin: 0; font-size: 12px; color: var(--muted); }
  #dl-status { font-size: 12px; color: var(--muted); min-height: 16px; }
  #dl-mode {
    font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--muted); cursor: pointer;
  }
  #dl-mode.is-on { background: var(--ink); border-color: var(--ink); color: #fff; }
  /* the one control a brief adds: which file, or none */
  .dl-brief { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .dl-brief select {
    font: inherit; font-size: 12px; padding: 4px 6px; max-width: 180px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink);
  }
  .dl-done { text-align: center; padding: 60px 20px; }
  .dl-done .dl-hint { margin-top: 10px; }
  .dl-more {
    font: inherit; font-size: 14px; padding: 10px 20px; border-radius: 999px;
    border: 1px solid var(--keep); background: var(--keep); color: #fff; cursor: pointer;
  }
  .dl-browse { max-width: 1100px; margin: 0 auto; }
  .dl-browse-action { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 18px; }
  .dl-blank {
    width: 100%; aspect-ratio: 1; background: repeating-linear-gradient(45deg, #f2f3f2, #f2f3f2 6px, #ececec 6px, #ececec 12px);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
  }
  .dl-tabs { justify-content: center; margin-bottom: 18px; }
  .dl-browse .dl-cell { cursor: default; }
  .dl-browse .dl-open { font-size: 11px; }

  /* the queue lives at the foot of the page, out of the way until it matters */
  #dl-queue {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    background: #fff; border-top: 1px solid var(--line);
    padding: 8px 20px 10px; display: flex; flex-direction: column; gap: 6px;
  }
  .dl-queue-row { display: flex; align-items: center; gap: 14px; }
  .dl-queue-row h2 { width: 58px; flex: none; }
  #dl-scene-bar { height: 100%; width: 0; background: var(--maybe); transition: width 0.3s; }
  #dl-scene-count { font-size: 12px; color: var(--ink); white-space: nowrap; }
  .dl-cap { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .dl-cap input { font: inherit; font-size: 12px; width: 52px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; }
  #dl-scene-toggle {
    font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--muted); cursor: pointer;
  }
  #dl-scene-toggle.is-on { background: var(--keep); border-color: var(--keep); color: #fff; }
  .dl-verdict-again.is-on, .dl-verdict-again:hover { background: var(--maybe); border-color: var(--maybe); color: #fff; }
  .dl-verdict-later:hover { background: var(--muted); border-color: var(--muted); color: #fff; }
  .dl-skip { font: inherit; font-size: 13px; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 6px 0; align-self: flex-start; }
  .dl-note { font: inherit; font-size: 13px; min-height: 60px; resize: vertical;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  #dl-queue.is-idle { opacity: 0.6; }
  #dl-queue h2 { font-size: 12px; margin: 0; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  #dl-queue-track { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  #dl-queue-bar { height: 100%; width: 0; background: var(--keep); transition: width 0.3s; }
  #dl-queue-count { font-size: 12px; color: var(--ink); white-space: nowrap; }
  #dl-queue-now { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #dl-queue-failed { font-size: 12px; color: var(--reject); }
  #dl-pause {
    font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--muted); cursor: pointer;
  }
  #dl-pause.is-on { background: var(--maybe); border-color: var(--maybe); color: #fff; }

  /* --- walking the flow without answering it --- */
  .dl-nav-row { display: flex; align-items: center; gap: 8px; }
  .dl-nav-row .dl-position { flex: 1; }
  .dl-nav-step {
    font: inherit; font-size: 15px; line-height: 1; cursor: pointer;
    width: 26px; height: 26px; flex: none; padding: 0;
    border: 1px solid var(--line); background: #fff; border-radius: 50%; color: var(--muted);
  }
  .dl-nav-step:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
  .dl-nav-step:disabled { opacity: 0.3; cursor: default; }

  /* --- pushing one row on to the next stage, by hand --- */
  .dl-cell-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .dl-cell-btn {
    font: inherit; font-size: 11px; padding: 4px 9px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; border-radius: 999px; color: var(--muted);
  }
  .dl-cell-btn:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
  .dl-cell-btn.is-go { border-color: var(--keep); background: var(--keep); color: #fff; }
  .dl-cell-btn:disabled { opacity: 0.4; cursor: default; }
  .dl-edit { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .dl-edit-code {
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    width: 100%; resize: vertical; word-break: break-all;
    border: 1px solid var(--line); border-radius: 6px; padding: 6px;
  }


  /* --- one picture, large, with its whole family under it --- */
  .dl-cell-open {
    font: inherit; padding: 0; border: 0; background: none; cursor: zoom-in;
    display: block; width: 100%; border-radius: 6px;
  }
  .dl-cell-open:hover img, .dl-cell-open:focus-visible img { opacity: 0.82; }
  .dl-cell-open img { transition: opacity 0.15s; }
  .dl-detail { max-width: 1100px; margin: 0 auto; }
  .dl-detail-figure {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin: 10px 0 16px; display: flex; justify-content: center;
  }
  .dl-detail-figure img { max-width: 100%; max-height: 62vh; width: auto; display: block; }
  .dl-detail-head {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;
  }
  .dl-detail-head .dl-code { font-size: 20px; }
  .dl-detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .dl-scene-panel { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .dl-scene-panel .dl-note { min-height: 54px; }

  .dl-strips { display: flex; flex-direction: column; gap: 4px; margin-top: 18px; }
  .dl-strip { border-top: 1px solid var(--line); padding: 12px 0 4px; }
  .dl-strip-head { display: flex; align-items: baseline; gap: 8px; }
  .dl-strip-head h3 {
    font-size: 11px; margin: 0; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted);
  }
  .dl-strip-count { font-size: 11px; color: var(--muted); }
  .dl-strip .dl-hint { margin: 6px 0 0; }
  .dl-tiles { display: flex; gap: 10px; overflow-x: auto; padding: 10px 2px 4px; }
  .dl-tile {
    font: inherit; padding: 4px; cursor: pointer; flex: none; width: 116px;
    background: #fff; border: 1px solid var(--line); border-radius: 9px;
    display: flex; flex-direction: column; gap: 3px; text-align: left;
  }
  .dl-tile img, .dl-tile .dl-blank { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; }
  .dl-tile .dl-blank { font-size: 9px; }
  .dl-tile-label {
    font-size: 10px; color: var(--muted); letter-spacing: 0.05em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dl-tile:hover:not(:disabled) { border-color: var(--ink); }
  .dl-tile:disabled { opacity: 0.4; cursor: default; }
  /* the picture in front of you, and the branch it belongs to */
  .dl-tile.is-current { border-color: var(--keep); box-shadow: 0 0 0 2px var(--keep); }
  .dl-tile.is-current .dl-tile-label { color: var(--keep); }
  .dl-tile.is-branch { border-color: var(--keep); }

  main { padding-bottom: 120px; }
</style>
</head>
<body>
<header>
  <div class="dl-top">
    <h1>Studio</h1>
    <div id="dl-sections" class="dl-bar"></div>
    <span id="dl-tally">loading…</span>
    <div class="dl-controls">
      <span id="dl-status"></span>
      <label class="dl-brief">brief <select id="dl-brief"><option value="">none</option></select></label>
      <button id="dl-mode" type="button">Flow</button>
    </div>
  </div>
</header>

<main id="dl-stage"><p class="dl-empty">loading…</p></main>

<div id="dl-queue" class="is-idle">
  <div class="dl-queue-row">
    <h2>Renders</h2>
    <span id="dl-queue-count">nothing queued</span>
    <div id="dl-queue-track"><div id="dl-queue-bar"></div></div>
    <span id="dl-queue-now"></span>
    <span id="dl-queue-failed" hidden></span>
    <button id="dl-pause" type="button">Pause</button>
  </div>
  <div class="dl-queue-row">
    <h2>Scenes</h2>
    <span id="dl-scene-count">off</span>
    <div id="dl-queue-track"><div id="dl-scene-bar"></div></div>
    <label class="dl-cap">cap <input id="dl-scene-cap" type="number" min="0" max="500" step="1" value="25"></label>
    <button id="dl-scene-toggle" type="button">Auto</button>
  </div>
</div>

<canvas id="dl-canvas" width="720" height="720"></canvas>

<script src="/js/builder/engine.js"></script>
<script src="/js/builder/geometry.js"></script>
<script src="/js/builder/renderer.js"></script>
<script src="/js/gate.js"></script>
<script src="/js/studio/scale.js"></script>
<script src="/js/studio/prompt-config.js"></script>
<script src="/js/studio/scene-prompt.js"></script>
<script src="/js/studio/brief.js"></script>
<script src="/js/design-lab/design-words.js"></script>
<script src="/js/design-lab/scene-presets.js"></script>
<script src="/js/design-lab/scene-jobs.js"></script>
<script src="/js/design-lab/preview.js"></script>
<script src="/js/design-lab/studio.js"></script>
<script>
  /*
   * Opened as a file:// URL this page cannot work and cannot say so: its
   * scripts are referenced from the site root, so they 404 before anything of
   * ours runs, and a browser refuses fetch() on file:// besides. What you get
   * is the placeholder below, forever, with nothing in the console that names
   * the cause. So say it here, where the check costs one line.
   */
  if (!window.FrameworkStudio) {
    document.getElementById('dl-stage').innerHTML =
      '<p class="dl-empty">This page has to be served, not opened as a file.<br><br>' +
      'Run <code>npm run dev</code> and open ' +
      '<a href="http://127.0.0.1:8770/studio.html">127.0.0.1:8770/studio.html</a>.</p>';
  } else {
    // ?corpus= so a second run can be reviewed without renaming files, and
    // ?brief= to open on a brief from ../framework-marketing/briefs.
    var query = new URLSearchParams(location.search);
    window.FrameworkStudio.boot(query.get('corpus') || '/data/design-lab/corpus.json', {
      brief: query.get('brief') || ''
    });
  }
</script>
</body>
</html>
