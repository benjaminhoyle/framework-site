<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Framework Deliveries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700;800&display=swap" rel="stylesheet">
<!--
  Mockup of the delivery applet for Elvis, Peter and Ben. Everything is in memory: a refresh starts over.
  Real runs and orders are a copy of Airtable from 6 Nov 2026. Example orders are invented and marked.
  Client phone numbers are left out on purpose so nobody rings a client from a mock.
-->
<style>
  /* Same tokens and face as framework.co.ke/elvis. Layout: a two-week strip over an inbox and a day view. */
  :root {
    --ink: #1b1f1e; --muted: #68726f; --faint: #a3aca9;
    --paper: #ffffff; --wash: #f2f5f4; --line: #e1e7e5;
    --accent: #245d5f; --accent-soft: #cfe1de;
    --amber: #9a6512; --amber-soft: #f7edd9;
    --red: #a34034; --red-soft: #f7e3df;
    --map: #f6f8f7; --r1: #c3cdc9; --r2: #d5ddda; --r3: #e4e9e7; --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e7ecea; --muted: #9aa5a1; --faint: #5d6865;
      --paper: #161b1a; --wash: #0e1211; --line: #263130;
      --accent: #74b8b1; --accent-soft: #2c4a48;
      --amber: #d9a24a; --amber-soft: #33291a;
      --red: #e08a7c; --red-soft: #3a211d;
      --map: #111615; --r1: #39453f; --r2: #2c3633; --r3: #222b28; --on-accent: #0e1211;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #e7ecea; --muted: #9aa5a1; --faint: #5d6865;
    --paper: #161b1a; --wash: #0e1211; --line: #263130;
    --accent: #74b8b1; --accent-soft: #2c4a48;
    --amber: #d9a24a; --amber-soft: #33291a;
    --red: #e08a7c; --red-soft: #3a211d;
    --map: #111615; --r1: #39453f; --r2: #2c3633; --r3: #222b28; --on-accent: #0e1211;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--wash); color: var(--ink); font-size: 14px; line-height: 1.4;
    font-family: 'Red Hat Display', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1400px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* top bar */
  .top { background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .top .wrap { display: flex; align-items: center; gap: 14px; height: 54px; }
  .brand { font-weight: 800; font-size: 16px; letter-spacing: .01em; white-space: nowrap; }
  .tabs { display: flex; gap: 2px; }
  .tab { background: none; border: 0; padding: 7px 12px; border-radius: 9px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tab.on { background: var(--wash); color: var(--ink); }
  .count { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 11.5px; line-height: 18px; text-align: center; margin-left: 4px; }
  .spacer { flex: 1; }
  .plain { background: none; border: 1px solid var(--line); border-radius: 9px; padding: 6px 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .plain:hover { background: var(--wash); }
  .mocknote { font-size: 12.5px; color: var(--muted); padding-block: 8px 0; }
  .link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; }

  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 13px; font-weight: 700; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; }
  .btn:hover { background: var(--wash); }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.pri:hover { opacity: .92; background: var(--accent); }
  .btn.big { min-height: 52px; width: 100%; font-size: 16px; border-radius: 13px; }
  .btn.warn { color: var(--amber); }
  .btn:disabled { opacity: .45; cursor: default; }

  /* tags */
  .tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 7px; background: var(--wash); color: var(--muted); white-space: nowrap; }
  .tag.ex { background: var(--amber-soft); color: var(--amber); }
  .tag.ok { background: var(--accent-soft); color: var(--accent); }
  .tag.bad { background: var(--red-soft); color: var(--red); }

  /* week strip */
  .stripbar { display: flex; align-items: center; gap: 8px; padding-block: 12px 8px; }
  .stripbar b { font-size: 15px; }
  .arrow { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-weight: 800; color: var(--muted); }
  .strip { display: grid; grid-template-columns: repeat(14, minmax(72px, 1fr)); gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .dc { text-align: left; background: var(--paper); border: 1.5px solid transparent; border-radius: 12px; padding: 8px 9px; cursor: pointer; min-height: 74px; display: flex; flex-direction: column; gap: 1px; }
  .dc .dow { font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .dc .dn { font-size: 18px; font-weight: 800; line-height: 1.15; }
  .dc .di { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .dc .dm { font-size: 11.5px; font-weight: 800; color: var(--accent); white-space: nowrap; min-height: 0; }
  .dc.route .dow { color: var(--accent); }
  .dc:not(.route):not(.has) { background: transparent; }
  .dc:not(.route):not(.has) .dn, .dc:not(.route):not(.has) .dow { color: var(--faint); }
  .dc.has .di { color: var(--ink); font-weight: 700; }
  .dc.past { background: transparent; }
  .dc.past .dn, .dc.past .dow { color: var(--faint); }
  .dc.sel { border-color: var(--accent); }
  .dc.over { background: var(--accent-soft); }
  .dc.today .dow::after { content: " today"; }

  /* plan layout */
  .plan { display: grid; grid-template-columns: 276px minmax(0, 1fr); gap: 14px; align-items: start; padding-block: 8px 48px; }
  .box { background: var(--paper); border-radius: 15px; padding: 14px; }
  .inbox.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .inbox h2, .h2 { font-size: 15px; font-weight: 800; margin: 0; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .cards { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .oc { border: 1px solid var(--line); border-radius: 11px; padding: 9px 10px 9px 6px; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px; cursor: grab; background: var(--paper); user-select: none; }
  .oc:hover { border-color: var(--faint); }
  .grip { color: var(--faint); font-size: 14px; line-height: 18px; text-align: center; touch-action: none; cursor: grab; user-select: none; }
  .oc b { font-weight: 700; }
  .oc .ln { font-size: 12.5px; color: var(--muted); }
  .oc .warnline { font-size: 12.5px; color: var(--amber); font-weight: 700; }

  /* run card */
  .daytitle { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .daytitle h2 { font-size: 20px; font-weight: 800; margin: 0; }
  .run { background: var(--paper); border-radius: 15px; padding: 16px; margin-bottom: 12px; }
  .runhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .runhead .rn { font-weight: 800; font-size: 15px; }
  .runhead select { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 4px 6px; font-weight: 700; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; }
  .stat { display: flex; flex-direction: column; }
  .stat b { font-size: 18px; font-weight: 800; line-height: 1.2; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat.pos b { color: var(--accent); }
  .stat.neg b { color: var(--amber); }
  .note { border-radius: 10px; padding: 9px 12px; font-size: 13.5px; margin-top: 10px; background: var(--wash); }
  .note.amber { background: var(--amber-soft); }
  .note.red { background: var(--red-soft); }
  .note .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

  /* day timeline: one row per stop against a 7am to 8pm axis */
  .tl { margin-top: 14px; }
  .tr { display: grid; grid-template-columns: 236px minmax(0, 1fr) 96px; align-items: center; column-gap: 10px; min-height: 50px; border-top: 1px solid var(--line); }
  .tr.axis { min-height: 22px; border-top: 0; }
  .tr.ws { min-height: 34px; }
  .tr.drag-src { opacity: .4; }
  .lab { display: flex; align-items: center; gap: 7px; min-width: 0; cursor: pointer; padding-block: 6px; user-select: none; }
  .tr[data-drag] .lab { cursor: grab; }
  .tnum { flex: 0 0 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 800; display: grid; place-items: center; }
  .tnum.todo { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .tnum.bad { background: var(--amber); color: var(--paper); }
  .wholab { min-width: 0; line-height: 1.25; }
  .wholab b { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wholab small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wholab small.amber { color: var(--amber); font-weight: 700; }
  .track { position: relative; height: 30px; background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px calc(100% / 13)); }
  .axisrow { position: relative; height: 16px; }
  .axisrow span { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--muted); }
  .win { position: absolute; top: 4px; bottom: 4px; background: var(--accent-soft); border-radius: 6px; }
  .drv { position: absolute; top: 14px; height: 2px; background: var(--faint); }
  .svc { position: absolute; top: 8px; bottom: 8px; min-width: 6px; background: var(--accent); border-radius: 4px; }
  .svc.plan { background: var(--accent); opacity: .85; }
  .svc.late { background: var(--red); opacity: 1; }
  .svc.bad { background: var(--amber); opacity: 1; }
  .wsdot { position: absolute; top: 10px; width: 10px; height: 10px; margin-left: -5px; background: var(--ink); border-radius: 2px; }
  .end { text-align: right; line-height: 1.2; }
  .end b { display: block; font-weight: 800; }
  .end small { font-size: 12px; color: var(--muted); }
  .end small.late { color: var(--red); font-weight: 700; }
  .end small.tight { color: var(--amber); font-weight: 700; }
  .detail { grid-column: 1 / -1; padding: 4px 0 14px 29px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 22px; }
  .kv { font-size: 13px; }
  .kv > span { display: block; font-size: 12px; color: var(--muted); }
  .inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .inp { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 5px 7px; max-width: 100%; }
  .inp.num { width: 62px; }
  .inp.wide { width: 100%; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .tools label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .tailnote { font-size: 12.5px; color: var(--muted); padding-block: 8px 12px; border-top: 1px solid var(--line); }
  .lower { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; margin-top: 14px; }
  .lower.solo { grid-template-columns: minmax(0, 1fr); }
  .emptyday { background: var(--paper); border-radius: 15px; padding: 26px 18px; text-align: center; color: var(--muted); }
  .emptyday .btn { margin-top: 10px; }
  .insbar { position: fixed; height: 3px; background: var(--accent); border-radius: 2px; z-index: 60; pointer-events: none; }
  .ghost { position: fixed; z-index: 70; pointer-events: none; background: var(--paper); border-radius: 10px; padding: 8px 12px; box-shadow: 0 6px 22px rgba(0, 0, 0, .22); font-weight: 700; max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.dragging { cursor: grabbing; user-select: none; }

  /* map */
  .map { display: block; width: 100%; height: auto; border-radius: 12px; background: var(--map); }
  .map.placing { cursor: crosshair; outline: 2px solid var(--accent); }
  .m-bg { fill: var(--map); }
  .m-r { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
  .m-r1 { stroke: var(--r1); stroke-width: 2.4; }
  .m-r2 { stroke: var(--r2); stroke-width: 1.6; }
  .m-r3 { stroke: var(--r3); stroke-width: 1.1; }
  .m-route { fill: none; stroke: var(--accent); stroke-width: 3; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
  .m-lab { font-size: 11px; fill: var(--muted); text-anchor: middle; font-family: inherit; }
  .m-pin { fill: var(--accent); stroke: var(--paper); stroke-width: 2; }
  .m-pin.todo { fill: var(--paper); stroke: var(--accent); }
  .m-pin.bad { fill: var(--amber); }
  .m-num { font-size: 12px; font-weight: 800; fill: var(--on-accent); text-anchor: middle; font-family: inherit; }
  .m-num.todo { fill: var(--accent); }
  .m-ring { fill: none; stroke: var(--amber); stroke-width: 1.5; stroke-dasharray: 3 3; }
  .m-ws { fill: var(--ink); stroke: var(--paper); stroke-width: 2; }
  .m-wsl { font-size: 11px; font-weight: 800; fill: var(--ink); font-family: inherit; }
  .m-c { font-size: 9px; fill: var(--muted); font-family: inherit; }
  .hist { font-size: 13px; }
  .hist h3 { font-size: 13px; font-weight: 800; margin: 0 0 6px; }
  .hist div { padding: 6px 0; border-top: 1px solid var(--line); }
  .hist em { font-style: normal; color: var(--muted); display: block; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .thumbs img { width: 76px; height: 57px; object-fit: cover; border-radius: 7px; display: block; }

  /* close */
  .closegrid { max-width: 980px; margin: 0 auto; padding-block: 14px 48px; display: flex; flex-direction: column; gap: 12px; }
  .acct { background: var(--paper); border-radius: 15px; padding: 16px; }
  .cardline { margin-top: 10px; padding: 10px 12px; background: var(--wash); border-radius: 10px; font-size: 13.5px; }
  .closecard { background: var(--paper); border-radius: 15px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .closecard .title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .closecard .title b { font-size: 16px; font-weight: 800; }
  .slist { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13.5px; }
  .slist li { padding: 4px 0; display: flex; gap: 8px; }
  .slist li span:first-child { color: var(--muted); flex: 0 0 18px; }
  .rule { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .kmrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .kmbig { font-size: 26px; font-weight: 800; line-height: 1.1; }

  /* driver */
  .pv { max-width: 440px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
  .pc { background: var(--paper); border-radius: 16px; padding: 16px; }
  .pc h2 { font-size: 19px; font-weight: 800; margin: 0; }
  .pc h3 { font-size: 15px; font-weight: 800; margin: 0; }
  .pmeta { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .plist { display: flex; flex-direction: column; margin-top: 8px; }
  .prow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
  .prow:first-child { border-top: 0; }
  .prow .wholab { flex: 1; }
  .btnrow { display: flex; gap: 8px; margin-top: 12px; }
  .btnrow .btn { flex: 1; min-height: 46px; }
  .stacked { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .stopname { font-size: 21px; font-weight: 800; line-height: 1.2; margin: 2px 0 0; }
  .stopaddr { font-size: 15px; margin-top: 3px; }
  .eyebrow { font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .loadlist { font-size: 14px; margin: 10px 0 0; padding: 10px 12px; background: var(--wash); border-radius: 10px; }
  .loadlist div { padding: 1px 0; }
  .back { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; font-size: 14px; text-align: left; }

  /* sheet */
  .ov { position: fixed; inset: 0; background: rgba(0, 0, 0, .38); z-index: 40; display: grid; place-items: center; padding: 16px; }
  .sh { background: var(--paper); border-radius: 18px; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 18px; }
  .sh h2 { font-size: 18px; font-weight: 800; margin: 0; }
  .sh p { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; }
  .fld { display: block; margin-top: 12px; font-size: 13px; font-weight: 700; }
  .fld input, .fld textarea, .fld select { display: block; width: 100%; margin-top: 4px; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px; font-weight: 500; font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px solid var(--line); background: var(--paper); border-radius: 18px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  @media (max-width: 720px) { .top .plain .count { display: none; } }
  .fdot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; flex: none; background: linear-gradient(90deg, var(--st) 50%, var(--bd) 50%); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1); }
  .fdot.none { background: var(--wash); }
  .li { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .load { font-size: 14px; margin-top: 10px; }
  .load.withimg { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: start; }
  .load img { display: block; width: 100%; max-height: 160px; object-fit: contain; background: #fff; border-radius: 8px; }
  .exdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); vertical-align: middle; margin: 0 2px; }
  .promise { font-size: 13.5px; margin: 6px 0 10px; }
  .proof { display: inline-block; width: 44px; height: 58px; object-fit: cover; border-radius: 6px; margin: 0 6px; vertical-align: middle; }
  .clientbox { grid-column: 1 / -1; display: grid; gap: 8px; background: var(--wash); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  .clientbox .inp.wide { width: 100%; }
  .cbhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .am { color: var(--amber); font-weight: 700; }
  .okc { color: var(--accent); font-weight: 700; }
  .wholab small.cl { white-space: normal; }
  .msgbox { display: block; width: 100%; margin-top: 10px; border: 1px solid var(--line); background: var(--paper); color: inherit; border-radius: 10px; padding: 10px; font: inherit; font-size: 14px; line-height: 1.4; resize: vertical; }
  .pstop { padding: 10px 0; border-top: 1px solid var(--line); }
  .pstop .chips { margin-top: 6px; }
  .shacts { display: flex; gap: 8px; margin-top: 16px; }
  .shacts .btn { flex: 1; min-height: 46px; }
  .dayopt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; width: 100%; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; cursor: pointer; margin-top: 8px; }
  .dayopt:hover { background: var(--wash); }
  .dayopt b { font-weight: 800; }
  .dayopt .amt { font-weight: 800; color: var(--accent); text-align: right; }
  .dayopt .amt.hi { color: var(--amber); }
  .dayopt small { color: var(--muted); font-size: 12.5px; grid-column: 1 / -1; }
  .photo { width: 100%; border-radius: 12px; display: block; margin-top: 10px; }
  .filebtn { position: relative; overflow: hidden; }
  .filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .reorder { margin-top: 10px; }
  .rrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .rrow:first-child { border-top: 0; }
  .rrow .wholab { flex: 1; }
  .rbtn { width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--paper); font-weight: 800; cursor: pointer; }
  .rbtn:disabled { opacity: .3; }

  /* airtable feed */
  .feed { position: fixed; top: 0; right: 0; bottom: 0; width: min(390px, 100%); background: var(--paper); border-left: 1px solid var(--line); z-index: 30; display: flex; flex-direction: column; }
  .feed header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .feed h2 { font-size: 15px; font-weight: 800; margin: 0; }
  .feedlist { overflow-y: auto; padding: 4px 16px 20px; flex: 1; }
  .fi { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .fi b { font-weight: 800; }
  .fi .ft { font-size: 12px; color: var(--muted); }
  .fi .fnew { color: var(--amber); font-weight: 700; }
  .toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 12px; z-index: 80; width: max-content; display: flex; gap: 12px; align-items: center; font-weight: 500; max-width: calc(100% - 32px); }
  .toast button { background: none; border: 0; color: var(--paper); font-weight: 800; text-decoration: underline; cursor: pointer; }

  @media (max-width: 980px) {
    .plan { grid-template-columns: minmax(0, 1fr); }
    .inbox .cards { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
    .inbox .oc { flex: 0 0 230px; }
    .closecard { grid-template-columns: minmax(0, 1fr); }
    .lower { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 720px) {
    .tr { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "lab end" "track track"; padding-bottom: 6px; }
    .tr .lab { grid-area: lab; }
    .tr .end { grid-area: end; }
    .tr .track, .tr .axisrow { grid-area: track; }
    .tr.axis .lab, .tr.axis .end { display: none; }
    .detail { grid-template-columns: minmax(0, 1fr); padding-left: 0; }
    .axisrow span:nth-child(even) { display: none; }
    .top .wrap { gap: 8px; }
    .brand { font-size: 14px; }
    .bd { display: none; }
    .tab { padding: 7px 8px; }
    .plain { padding: 6px 8px; }
    .ov { place-items: end center; padding: 0; }
    .sh { border-radius: 18px 18px 0 0; width: 100%; max-height: 88vh; padding-bottom: max(18px, env(safe-area-inset-bottom, 0px)); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .toast { animation: rise .16s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translate(-50%, 6px); } }
  }
</style>

<script>
(function () {
'use strict';
const D = window.DATA;
let TODAY = D.asOf;
const EARLIEST = 660;             // agreed in the group on 2 Nov: first delivery from 11am
const PROMISE_GAP = 3;            // from the last 30 promises in the chats: the next delivery day at least 3 days out
const TRAFFIC = 1.5;              // road-service minutes are free-flow; Nairobi by day is slower
const AX0 = 420, AX1 = 1200;      // the Airtable window formula clamps to 7am-8pm
const NAMES = { elvis: 'Elvis', peter: 'Peter', ben: 'Ben', patrick: 'Patrick' };
const WS = { lat: D.workshop[0], lng: D.workshop[1] };
const ORD = {}; D.orders.forEach(o => { ORD[o.id] = o; });

// ---- helpers
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = n => n == null ? '' : Math.round(n).toLocaleString('en-US');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const plus = n => '+' + money(Math.max(0, n || 0));
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const dObj = s => new Date(s + 'T00:00:00Z');
const addD = (s, n) => { const d = dObj(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fD = s => { const d = dObj(s); return DOW[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MON[d.getUTCMonth()]; };
const fT = m => {
  if (m == null) return '';
  m = Math.round(m); let h = Math.floor(m / 60); const mm = m % 60; const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
  return mm ? h + ':' + String(mm).padStart(2, '0') + ap : h + ap;
};
const toInputT = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.round(m) % 60).padStart(2, '0');
const fromInputT = v => { const p = String(v).split(':'); return p.length === 2 ? (+p[0]) * 60 + (+p[1]) : null; };
const DELIVERY_DAYS = [3, 6];     // Wed and Sat, as Elvis tells clients. Sun is 0.
const isRouteDay = s => DELIVERY_DAYS.includes(dObj(s).getUTCDay());
const pct = m => clamp((m - AX0) / (AX1 - AX0) * 100, 0, 100);
const toU = p => [(p.lng - D.proj.lon0) * D.proj.k * 10000, (D.proj.lat0 - p.lat) * 10000];
const fromU = (x, y) => ({ lat: D.proj.lat0 - y / 10000, lng: x / (D.proj.k * 10000) + D.proj.lon0 });
const pk = p => p.lat.toFixed(4) + ',' + p.lng.toFixed(4);
const WEEK = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const fTU = m => fT(m).toUpperCase();
const fWin = (a, b) => fTU(a) + ' and ' + fTU(b);
const dayWord = d => d === TODAY ? 'today' : d === addD(TODAY, 1) ? 'tomorrow' : 'on ' + WEEK[dObj(d).getUTCDay()];
const nextDeliveryDay = from => { let d = addD(from, 1); while (!isRouteDay(d)) d = addD(d, 1); return d; };
const promiseDay = () => nextDeliveryDay(addD(TODAY, PROMISE_GAP - 1));
const atWorkshop = leave => Math.floor((leave - 60) / 30) * 30;
const FINISH = { Marine: ['#143F68', '#82AAD0'], Sage: ['#6F986A', '#B3D4BE'], Charcoal: ['#171E20', '#94A4B0'], Coral: ['#C8554B', '#F29A8C'] };
const dot = c => FINISH[c] ? `<span class="fdot" style="--st:${FINISH[c][0]};--bd:${FINISH[c][1]}" role="img" aria-label="${c}" title="${c}"></span>` : '<span class="fdot none"></span>';
const itemLines = o => o.items.map(x => `<div class="li">${dot(x.color)}<span>${x.qty} x ${esc(x.name)}${x.color && !FINISH[x.color] ? ', ' + esc(x.color) : ''}</span></div>`).join('');
function loadBlock(o) {
  if (!o || !o.items.length) return '';
  const img = o.design && D.shelves && D.shelves[o.design];
  return `<div class="load ${img ? 'withimg' : ''}">${img ? `<a href="https://framework.co.ke/d/${esc(o.design)}" target="_blank" rel="noopener"><img src="${img}" alt="The shelf in this order"></a>` : ''}<div>${itemLines(o)}</div></div>`;
}
const noUnit = s => !!(s.orderId && s.addr && !/\d/.test(s.addr));

}
function leg(a, b) {

}

function calcList(list, leave) {
  let prev = WS, km = 0;
  if (leave == null) {
    const first = list.find(s => s.lat != null);
    if (first) {
      const st = first.winS != null ? first.winS : EARLIEST;
      leave = Math.max(EARLIEST, Math.floor((st - leg(WS, first).min * TRAFFIC) / 5) * 5);
    } else leave = EARLIEST;
  }
  let t = leave;
  const rows = [];
  list.forEach(s => {
    const l = s.lat != null ? leg(prev, s) : { km: 0, min: 0, g: null };
    const drive = l.min * TRAFFIC;
    let arrive = t + drive, start, wait = 0;
    if (s.at != null) { arrive = s.at; start = s.at; }
    else { start = arrive; if (s.winS != null && arrive < s.winS) { wait = s.winS - arrive; start = s.winS; } }
    const late = s.winE != null && arrive > s.winE ? Math.round(arrive - s.winE) : 0;
    const spare = s.winE != null && !late ? Math.round(s.winE - arrive) : null;
    const depart = start + (s.svc || 0);
    km += l.km || 0;
    rows.push({ s, leg: l, drive, arrive, start, wait, late, spare, depart, from: t });
    t = depart;
    if (s.lat != null) prev = s;
  });

function hint(run) {
  if (run.driver !== 'Moveystar' || !editable(run)) return '';
  const list = stopsOf(run);
  if (list.length !== 1 || !list[0].orderId) return '';
  const cost = runCost(run), ch = charged(run);
  let best = null;
  S.runs.forEach(r => {
    if (r === run || !editable(r) || r.driver !== 'Moveystar' || r.date <= TODAY) return;
    const rd = ORD[list[0].orderId].ready;
    if (rd && r.date < rd) return;
    const m = insertBest(r, list[0]);
    const add = (m.cost || 0) - (runCost(r) || 0);
    if (!best || add < best.add) best = { r, add };
  });
  if (!best || cost == null) return '';
  const told = ORD[list[0].orderId].promised;
  return `<div class="note">Joining ${fD(best.r.date)} saves ${money(cost - Math.max(0, best.add))}.${told ? ' Client told ' + fD(told) + '.' : ''}</div>`;
}

// ---- sheets
function daysFor(o) {
  const from = o.ready && o.ready > TODAY ? o.ready : addD(TODAY, 1);
  const out = [], seen = new Set();
  for (let i = 0; i < 16; i++) {
    const d = addD(TODAY, 1 + i);
    if (d < from) continue;
    const hasRun = runsOn(d).some(r => editable(r));
    if (!hasRun && !isRouteDay(d)) continue;
    if (seen.has(d)) continue; seen.add(d);
    out.push(d);
  }
  return out.slice(0, 5);
}

    const firstFree = stopsOf(run).findIndex(s => s.status === 'todo');
    if (firstFree > 0) idx = Math.max(idx, firstFree);
    if (r0) { insbar.hidden = false; insbar.style.left = r0.left + 'px'; insbar.style.width = r0.width + 'px'; insbar.style.top = (top - 1) + 'px'; }
    dg.target = { kind: 'run', run, idx };
    return;
  }
  zone.classList.add('over');
  if (spec === 'inbox') { if (dg.spec.startsWith('stop:')) dg.target = { kind: 'inbox' }; else zone.classList.remove('over'); return; }
  if (spec.startsWith('day:')) {
    const date = spec.slice(4);
    if (date <= TODAY) { zone.classList.remove('over'); return; }
    dg.target = { kind: 'day', date };
  }
  // keep the page moving when a drag nears the edge
}
function endDrag(ok) {
  document.body.classList.remove('dragging');
  document.querySelectorAll('.over').forEach(n => n.classList.remove('over'));
  document.querySelectorAll('[data-marg]').forEach(n => { n.textContent = ''; });

  const d = dg; dg = null;
  suppress = true; setTimeout(() => { suppress = false; }, 50);
  if (!ok || !d.target) { return; }
  const [k, id] = d.spec.split(':'), t = d.target;
  if (k === 'order') {
    const o = ORD[id];
    if (t.kind === 'run') { addOrderToRun(o, t.run, t.idx); S.day = t.run.date; toast(o.client + ' added to ' + fD(t.run.date) + '.'); }
    else if (t.kind === 'day') { const run = addOrderToDay(o, t.date); toast(o.client + ' is on ' + fD(run.date) + '.'); }
  } else {
    const s = S.stops[id];
    if (t.kind === 'inbox') { if (s.orderId) { takeOff(id); toast(s.title + ' is back in To schedule.'); } else { takeOff(id); toast(s.title + ' removed.'); } }
    else if (t.kind === 'run') { moveStopTo(id, t.run, t.idx); S.day = t.run.date; }
    else if (t.kind === 'day') {
      const from = runOfStop(id);
      if (from.date === t.date) return;
      let run = runsOn(t.date).find(r => editable(r) && r.driver === from.driver);
      if (!run) { run = mkRun({ date: t.date, driver: from.driver, example: from.example }); feed('Orders - Truck Deliveries', fD(t.date), 'New run, Driver = ' + run.driver); }
      moveStopTo(id, run, null); S.day = t.date; toast(s.title + ' moved to ' + fD(t.date) + '.');
    }
  }
  render();
}
addEventListener('pointerdown', e => {
  if (e.button) return;
  const el = e.target.closest('[data-drag]');
  if (!el || e.target.closest('button,a,input,select,textarea,[data-nodrag]')) return;
  const handle = e.target.closest('[data-handle]');

});
addEventListener('pointermove', e => {

addEventListener('pointercancel', () => { if (dg) { if (dg.active) endDrag(false); else dg = null; } });
