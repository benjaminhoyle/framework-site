# Netlify configuration — framework.co.ke
# Static site: plain HTML/JS with in-browser Babel (JSX compiled at runtime).
# No build step; published straight from the repo root.

[build]
  publish = "."
  # (no build command — nothing to compile)

# --- Preserve existing clean URLs (served extensionless on GitHub Pages) ---
# status = 200 is a rewrite: the URL stays clean, the .html file is served.
[[redirects]]
  from = "/designer"
  to = "/designer.html"
  status = 200

[[redirects]]
  from = "/shelving"
  to = "/shelving.html"
  status = 200

[[redirects]]
  from = "/simplified-designer"
  to = "/simplified-designer.html"
  status = 200

[[redirects]]
  from = "/builder"
  to = "/builder.html"
  status = 200

# A saved design: /builder/1Y3MK7P. The page is served unchanged and reads the
# code off its own path, then resolves it through /api/design. The URL stays as
# typed, which is the point -- it is what the share image prints.
# (This is why the page's assets are referenced from the site root: at this depth
# a relative "css/..." would resolve inside /builder/.)
[[redirects]]
  from = "/builder/*"
  to = "/builder.html"
  status = 200

# The page was at /new-designer while it was being evaluated, and those links are
# in WhatsApp threads with a design in the URL fragment. 301 rather than a
# rewrite so the address corrects itself, and the fragment rides along untouched
# because the browser reapplies it after the redirect -- which is the whole
# design, so this cannot be dropped without breaking shelves people already have.
[[redirects]]
  from = "/new-designer"
  to = "/builder"
  status = 301

[[redirects]]
  from = "/new-designer/*"
  to = "/builder/:splat"
  status = 301

# --- /builder runtime assets -----------------------------------------------
# The geometry bundles are content-built by scripts/build-builder-assets.mjs and
# only change when the Rhino pipeline does, so they can be cached hard. They are
# JSON (not raw binary) specifically so Netlify's edge brotli applies --
# application/octet-stream is served uncompressed, which quadrupled the download.
[[headers]]
  for = "/assets/shelving/modules/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/shelving/catalog.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# --- The published catalogue -----------------------------------------------
# shelving.html fetches this. Short max-age so a publish shows up promptly, and
# a long stale-while-revalidate so a visitor never waits on it.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=86400"

# --- Keep internal-only paths out of the public site ---
# These live in the repo for handoff/tooling but must not be served.
# force = true makes the redirect win over the real static file.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# catalog.json is the EDITORIAL record: it holds retired products and their
# prices. What the public reads is data/catalog.json, which carries only the
# active ones. Serving the editorial copy leaked the difference.
[[redirects]]
  from = "/catalog.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# --- WS1 event lake collector (Netlify Functions + Blobs) ---
# track.js / export.js declare their own routes via `export const config.path`
# (/api/track, /api/export), so no redirects are needed here.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# --- Later phases (DO NOT enable yet — no handlers exist) ---
# /d/:code       → design short-code resolver (Phase 2)
# /shelf/:slug   → catalog slug pages (Phase 2)
